<!DOCTYPE html>
<html lang="en" style="background-color:#1A1D23">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Min / Max Rules — Pricing | VeriDex</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
<link href="assets/css/workspace.css" rel="stylesheet">
<script src="assets/js/tooltip-dictionary.js" defer></script>
<script src="assets/js/ui-ux.js" defer></script>
</head>
<body><div id="vxApp"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cosmos-model.js"></script>
<script src="assets/js/tenant-setup.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/grid.js"></script>
<script src="assets/js/ag-grid-adapter.js"></script>
<script>
vxShell("Minimum / Maximum Premium Rules", "Minimum premium, rounding and pro-rata rules. || Applied after the factor chain produces a raw premium.", [{l:"Pricing Rules"},{l:"Minimum / Maximum Premium Rules"}]);
document.getElementById("vxBody").innerHTML = `<div class="vx-card vx-anim"><div id="grid"></div></div>`;
vxAgGrid({ el:"#grid", key:"premiumRules", name:"Premium Rule",
  
  cols:[{k:"name",l:"Rule"},{k:"code",l:"Code"},{k:"lob",l:"LOB"},
      {k:"type",l:"Type",r:r=>'<span class="vx-b '+(r.type==="Minimum"?"green":r.type==="Maximum"?"red":"amber")+'">'+r.type+'</span>'},
      {k:"scope",l:"Scope"},{k:"value",l:"Value",r:r=>r.value<5?(r.value*100).toFixed(0)+"%":vxMoney(r.value)},
      {k:"active",l:"Status",r:r=>'<span class="vx-b '+(r.active?"green":"gray")+'">'+(r.active?"Active":"Inactive")+'</span>'}],
  form:[{k:"name",l:"Rule Name"},{k:"code",l:"Code"},{k:"lob",l:"LOB",t:"select",opts:vxLobNames()},
      {k:"type",l:"Type",t:"select",opts:["Minimum","Maximum","Threshold"]},{k:"scope",l:"Scope"},
      {k:"value",l:"Value",t:"number"},{k:"active",l:"Active",t:"check"}],
   });

</script>
</body>
</html>
