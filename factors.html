<!DOCTYPE html>
<html lang="en" style="background-color:#1A1D23">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rating Factors — Rating | VeriDex</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body><div id="vxApp"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/rate-data-full.js"></script>
<script src="assets/js/rate-tables-registry.js"></script>
<script src="assets/js/cosmos-model.js"></script>
<script src="assets/js/tenant-setup.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/grid.js"></script>
<script src="assets/js/ag-grid-adapter.js"></script>
<script>
vxShell("Rating Factors", "Every factor the rating engine actually applies. || What drives it, which sheet it came from, and the range it can take.",
  [{ l: "Products & Rating" }, { l: "Rating Factors" }]);

const KIND = {
  Lookup:   { c: "blue",   i: "fa-table-list", d: "Selected from a rate table by an insured answer" },
  Computed: { c: "purple", i: "fa-calculator", d: "Derived at rating time from several answers" },
  Judgment: { c: "amber",  i: "fa-user-pen",   d: "Set by an underwriter, not a table" },
  Constant: { c: "gray",   i: "fa-lock",       d: "Same on every quote" },
};

/* The grid below already reads through vxAgGrid's key:"ratingFactors" ->
   API.list -> COSMOS.query, so its rows were always correctly tenant-scoped.
   These summary cards read the raw VX.ratingFactors array directly and
   were not — a newly onboarded tenant with zero factors of its own saw
   VeriDex's full counts here regardless of which tenant was active.
   Scoped the same way the grid itself already is. */
const tenantFactorRows = (typeof COSMOS !== "undefined") ? COSMOS.query("ratingFactors", {}) : VX.ratingFactors;
const verified = tenantFactorRows.filter(f => f.verified).length;
const approx = tenantFactorRows.filter(f => !f.verified && !f.custom).length;
const custom = tenantFactorRows.filter(f => f.custom).length;

document.getElementById("vxBody").innerHTML = `
  <div class="row g-2 mb-3">
    <div class="col-6 col-lg-3"><div class="vx-stat stack"><div class="lbl">Factors in the engine</div>
      <div class="val">${tenantFactorRows.length}</div><div class="dt flat">across ${new Set(tenantFactorRows.map(f => f.lob)).size} lines of business</div></div></div>
    <div class="col-6 col-lg-3"><div class="vx-stat stack"><div class="lbl">Verified</div>
      <div class="val" style="color:var(--good)">${verified}</div><div class="dt flat">matched to a filed workbook</div></div></div>
    <div class="col-6 col-lg-3"><div class="vx-stat stack"><div class="lbl">Approximated</div>
      <div class="val" style="color:var(--warn)">${approx}</div><div class="dt flat">working values, not filed</div></div></div>
    <div class="col-6 col-lg-3"><div class="vx-stat stack"><div class="lbl">Custom (added here)</div>
      <div class="val">${custom}</div><div class="dt flat">${custom ? "not yet wired to the engine" : "none added yet"}</div></div></div>
  </div>

  <div class="vx-exp2 vx-anim" id="expFac" style="border-left-color:var(--primary)">
    <div class="hd"><i class="fa-solid fa-database" style="color:var(--primary);font-size:11.5px"></i><b>Derived from the engine</b><span>Ranges and row counts are computed live. Open a factor to see its rows.</span><button type="button" class="tog" onclick="vxExpToggle(&#39;expFac&#39;)">Why?</button></div>
    <div class="bd"><p>Every row is read from the rating engine's own tables — nothing here is stored separately. Open any factor to see its rows in <a href="rate-tables.html">Rate Tables</a>.</p><p>Adding a factor here registers it, but the engine does not execute configured factors yet, so new factors are marked <span class="vx-b amber">Not wired</span> until that loop is closed.</p></div>
  </div>

  <div id="approvals"></div>
  <div class="vx-card vx-anim"><div id="grid"></div></div>`;

function fmtRange(r) {
  if (!r.rowCount) return r.defaultValue != null ? `<span style="color:var(--text-mute)">${r.defaultValue} (fixed)</span>` : '<span style="color:var(--text-mute)">—</span>';
  if (r.minValue === r.maxValue) return `${r.minValue}`;
  const n = v => Math.abs(v) >= 1000 ? Number(v).toLocaleString("en-US") : v;
  return `<span style="font-variant-numeric:tabular-nums">${n(r.minValue)} – ${n(r.maxValue)}</span>`;
}

/* Where a factor's value comes from, in business terms rather than
   internal flags — the brief's "never show a value without its source". */
function sourceLabel(r) {
  if (r.custom || r.verified === undefined) return { label: "Added here", cls: "gray", detail: "Manually configured on this screen" };
  if (r.tableId) return { label: "Rate Table", cls: "cyan", detail: `Looked up from ${r.sourceSheet || "a rate table"}` };
  if (r.kind === "Computed") return { label: "Derived", cls: "purple", detail: "Derived from rating configuration at quote time" };
  if (r.kind === "Judgment") return { label: "Underwriter", cls: "amber", detail: "Set by an underwriter on the quote, not a table" };
  return { label: "Workbook", cls: "cyan", detail: `Fixed constant from ${r.sourceSheet || "the rating workbook"}` };
}
/* "Values / Rules" — how many distinct outcomes this factor can produce.
   A lookup factor's row count IS its rule count; a fixed factor has one. */
function valuesLabel(r) {
  if (r.rowCount) return `<b>${vxNum(r.rowCount)}</b> <span style="color:var(--text-mute)">values</span>`;
  if (r.defaultValue != null) return `<b>1</b> <span style="color:var(--text-mute)">fixed value</span>`;
  return '<span style="color:var(--text-mute)">—</span>';
}

/* One pending-change queue covers two request shapes — a Default Value
   change ({from,to}, vxRequestFactorChange) and a table-value change
   ({edits[]} or {newRow}, vxRequestFactorTableChange) — so every place that
   shows what a pending request proposes needs to read whichever shape it
   actually has. */
function factorChangeSummary(r) {
  return r.kind === "tableValues"
    ? (r.newRow ? `add a value to ${r.tableId}` : `${(r.edits || []).length} value${(r.edits || []).length === 1 ? "" : "s"} in ${r.tableId}`)
    : `${r.from ?? "none"} → ${r.to}`;
}

/* ---------- Pending factor changes ----------
   A requested change sits here until someone else approves it. Rendered
   above the grid because it is a queue, not a report: it exists to be
   cleared, and burying it would let a change wait unnoticed while the
   registry quietly still showed the old value. */
function renderApprovals() {
  const host = document.getElementById("approvals");
  if (!host) return;
  const pending = (VX.factorChangeRequests || []).filter(r => r.status === "Pending");
  const recent = (VX.factorChangeRequests || []).filter(r => r.status !== "Pending").slice(0, 3);
  if (!pending.length && !recent.length) { host.innerHTML = ""; return; }

  const me = vxCurrentUser();
  const row = r => {
    const mine = r.requestedBy === me;
    return `<tr>
      <td><b>${r.factorName}</b> <code style="font-size:10.5px">${r.factorCode}</code>
        <div style="font-size:10.6px;color:var(--text-mute)">${r.lob}</div></td>
      <td style="font-variant-numeric:tabular-nums">${factorChangeSummary(r)}</td>
      <td>${r.effectiveFrom}</td>
      <td style="font-size:11.4px">${r.requestedBy.split("@")[0]}
        <div style="color:var(--text-mute);font-size:10.5px">${r.requestedOn}</div></td>
      <td style="font-size:11.4px;color:var(--text-dim)">${r.reason || "—"}</td>
      <td style="text-align:right;white-space:nowrap">
        ${mine
          ? `<span class="vx-b gray hintdot" title="You raised this change. Approval is a second pair of eyes, so it has to be someone else — that is the only thing this step guarantees.">awaiting someone else</span>`
          : `<button class="btn btn-outline-secondary btn-sm" data-rej="${r.id}">Reject</button>
             <button class="btn btn-primary btn-sm ms-1" data-app="${r.id}">Approve</button>`}
      </td></tr>`;
  };

  host.innerHTML = `
    ${pending.length ? `<div class="vx-card vx-anim" style="margin-bottom:14px;border-left:3px solid var(--warn)">
      <div class="vx-card-head">
        <div><h2>Changes awaiting approval <span class="vx-b amber">${pending.length}</span></h2>
          <div class="sub">A factor value change does not take effect until someone else approves it, and then only from its effective date.</div></div>
      </div>
      <div class="vx-tw"><table class="vx-t" style="font-size:12.2px">
        <thead><tr><th>Factor</th><th>Change</th><th>Effective from</th><th>Requested by</th><th>Reason</th><th></th></tr></thead>
        <tbody>${pending.map(row).join("")}</tbody></table></div>
      <div style="font-size:11px;color:var(--text-mute);margin-top:8px">
        The registry keeps showing the value currently in force while a change waits here — so what you see is what applies.
      </div>
    </div>` : ""}
    ${recent.length ? `<div style="font-size:11.4px;color:var(--text-mute);margin-bottom:14px">
      Recently decided: ${recent.map(r => `<b>${r.factorName}</b> ${r.status.toLowerCase()} by ${String(r.decidedBy || "").split("@")[0] || "—"}`).join(" · ")}
    </div>` : ""}`;

  host.querySelectorAll("[data-app]").forEach(b => b.onclick = () => {
    const r = VX.factorChangeRequests.find(x => x.id === +b.dataset.app);
    /* The date requested can go stale while this sat pending — see
       vxSuggestedApprovalDate. So the approver gets an editable field, not
       just a readout of whatever was typed when the request was raised. */
    const suggested = vxSuggestedApprovalDate(r);
    const stale = suggested !== r.effectiveFrom;
    const isTable = r.kind === "tableValues";
    vxModal("Approve this change?", `
      <div style="font-size:13px;line-height:1.6">
        <b>${r.factorName}</b> ${isTable ? factorChangeSummary(r) : `moves from <b>${r.from ?? "none"}</b> to <b>${r.to}</b>`}.
        <div style="margin-top:8px">${isTable
          ? `Approving writes this straight into <code>${r.tableId}</code> — the exact table the engine reads.`
          : `The current value stays on file, closed the day before — a quote rate-locked earlier is still priced on it.`}</div>
      </div>
      <div class="row g-3 mt-2">
        <div class="col-md-7">
          <label>In force from</label>
          <input type="date" class="form-control form-control-sm" id="apEffDate" value="${suggested}">
          ${stale ? `<div style="font-size:11px;color:var(--warn);margin-top:4px">
              <i class="fa-solid fa-triangle-exclamation me-1"></i>${r.effectiveFrom} was requested, but that date has already passed while this sat pending — defaulted to today instead.</div>`
            : `<div style="font-size:11px;color:var(--text-mute);margin-top:4px">As requested.</div>`}
        </div>
      </div>
      <div class="mt-3" style="color:var(--text-dim);font-size:12.3px">
        ${isTable
          ? `This writes immediately once approved — nothing here resolves a value "as of" a date, so the field above is record-keeping, same as it is for Default Value changes.`
          : `This platform's engine rates off its own filed tables, so approving updates the registry and the audit trail rather than moving a premium by itself.`}
      </div>`,
      [{ t: "Cancel", c: "secondary" }, { t: "Approve", c: "primary", fn: () => {
        const eff = document.getElementById("apEffDate").value || suggested;
        const ok = isTable ? vxApproveFactorTableChange(r.id, "", eff) : vxApproveFactorChange(r.id, "", eff);
        if (ok) {
          vxToast("Approved", `${r.factorName} in force from ${eff}`, "ok");
          renderApprovals(); grid.reload();
        }
      } }], "modal-md");
  });
  host.querySelectorAll("[data-rej]").forEach(b => b.onclick = () => {
    const r = VX.factorChangeRequests.find(x => x.id === +b.dataset.rej);
    const isTable = r.kind === "tableValues";
    vxConfirm("Reject this change?",
      isTable ? `<b>${r.factorName}</b> keeps its current values in <code>${r.tableId}</code>, unchanged. The request stays in the audit trail with your name on it.`
              : `<b>${r.factorName}</b> keeps its current value of <b>${r.from ?? "none"}</b>. The request stays in the audit trail with your name on it.`,
      () => {
        if (isTable) vxRejectFactorTableChange(r.id, ""); else vxRejectFactorChange(r.id, "");
        vxToast("Rejected", r.factorName + " unchanged", "err"); renderApprovals(); grid.reload();
      }, true);
  });
}

/* Holds the pre-edit copy of the row between onBeforeSave and onAfterSave so
   the audit entry can report a real before → after. */
let beforeSnapshot = null;
const grid = vxAgGrid({ el: "#grid", key: "ratingFactors", name: "Rating Factor", size: 15,
  // Factors are managed as shared configuration, so cloning and per-row
  // version-history actions do not apply on this screen.
  noClone: true,
  noHist: true,
  /* Factors are entered in runs — a filed table rarely arrives one row at a
     time — so Add keeps going rather than closing after each. */
  addAnother: true,
  /* Name the dialog after the record. "Edit Rating Factor" told you which
     screen you were on but not which of 50-odd rows you had opened — on the
     one action that changes what gets charged, that is the thing you most
     need to be sure of before typing. */
  formTitle: (rec, isNew) => isNew ? "Add Rating Factor" : `Edit — ${rec.name}`,
  formHeader: (rec, isNew) => {
    if (isNew) {
      return `<div class="vx-ai mb-3" style="padding:10px 14px;font-size:12.3px;line-height:1.6">
        <i class="fa-solid fa-circle-info me-1"></i>
        Registers a new rating factor against a line of business.
        <span class="hintdot" title="The engine executes its own built-in factor chain. A factor added here is recorded, reportable and exportable, but it is not read while rating until that loop is closed — which is why it lands marked Not wired.">It will be marked <b>Not wired</b></span>
        until the configure-to-rate loop is closed.
      </div>`;
    }
    const s = sourceLabel(rec);
    const k = KIND[rec.kind] || KIND.Constant;
    const wired = rec.custom || rec.verified === undefined;
    return `<div class="mb-3" style="border:1px solid var(--border);border-left:3px solid var(--primary);
        border-radius:0 10px 10px 0;background:var(--surface-2);padding:11px 14px">
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <b style="font-size:14px">${rec.name}</b>
        <code style="font-size:11px">${rec.code}</code>
        <span class="vx-b ${k.c}" title="${k.d}"><i class="fa-solid ${k.i} me-1"></i>${rec.kind}</span>
        <span class="vx-b ${s.cls}" title="${s.detail}">${s.label}</span>
        ${wired
          ? `<span class="vx-b amber" title="Added through this screen. The engine does not execute configured factors yet, so this factor is recorded but not read while rating.">Not wired</span>`
          : (rec.verified
              ? `<span class="vx-b green" title="Matched line-by-line to a filed workbook or rating manual.">Verified</span>`
              : `<span class="vx-b amber" title="A working value that has not been checked against a filed source.">Approximated</span>`)}
      </div>
      <div style="font-size:11.6px;color:var(--text-dim);margin-top:5px;line-height:1.6">
        ${rec.lob} · ${rec.coverage || "unassigned"} ·
        <span class="hintdot" title="What the factor is measured against. Scope is what a factor varies BY; the coverage above is what it prices.">${rec.scope || "no scope"} scope</span>
        ${rec.rowCount
          ? ` · <span class="hintdot" title="This factor reads a row out of a rate table, so editing the Default Value below only changes the fallback used when no row matches — not what most quotes are charged.">${vxNum(rec.rowCount)} table values</span>`
          : ` · <span class="hintdot" title="No lookup table: the Default Value below is applied on every quote, so changing it changes every quote on this line.">fixed value</span>`}
        ${rec.updatedBy ? ` · last edited by <b>${rec.updatedBy.split("@")[0]}</b>${rec.updatedOn ? " on " + rec.updatedOn : ""}` : ""}
      </div>
      <div style="font-size:11.4px;color:var(--text-dim);margin-top:7px;padding-top:7px;border-top:1px solid var(--border)">
        <i class="fa-solid fa-clock-rotate-left me-1" style="color:var(--text-mute)"></i>
        Saving records the before and after in the
        <a href="audit.html">audit trail</a>${rec.rowCount ? " — to change the values themselves, use Edit values on the factor's detail panel" : ""}.
      </div>
    </div>`;
  },
  cols: [
    { k: "name", l: "Rating Factor" },
    { k: "lob", l: "Line of Business" },
    { k: "defaultValue", l: "Default", r: r => r.defaultValue != null
        ? `<b>${r.defaultValue}</b>`
        : (r.rowCount ? '<span style="color:var(--text-mute)" title="No single default — the value is always looked up">from table</span>'
                      : '<span class="vx-b red">none</span>') },
    { k: "rowCount", l: "Values / Rules", r: valuesLabel },
    { k: "minValue", l: "Range", sort: false, r: fmtRange },
    { k: "_source", l: "Source", sort: false, r: r => { const s = sourceLabel(r);
        return `<span class="vx-b ${s.cls}" title="${s.detail}">${s.label}</span>`; } },
    { k: "kind", l: "Type", r: r => { const k = KIND[r.kind] || KIND.Constant;
        return `<span class="vx-b ${k.c}" title="${k.d}"><i class="fa-solid ${k.i} me-1"></i>${r.kind}</span>`; } },
    { k: "driver", l: "Driven by", r: r => r.driver === "—"
        ? '<span style="color:var(--text-mute)">nothing — fixed</span>' : r.driver },
    { k: "coverage", l: "Coverage" },
    { k: "scope", l: "Scope", r: r => `<span class="vx-b gray">${r.scope || "—"}</span>` },
    { k: "_product", l: "Product", sort: false, r: r => (r.attachments || []).length
        ? (r.attachments || []).map(a => a.product).join(", ") : '<span style="color:var(--text-mute)">—</span>' },
    { k: "tableId", l: "Lookup Table", sort: false,
      r: r => r.tableId ? `<a href="#" onclick="editFactorValues(vxFactorById(${r.id}));return false" title="Edit this table's values">${tableName(r.tableId)}</a>`
                        : '<span style="color:var(--text-mute)">\u2014</span>' },
    { k: "code", l: "Code", r: r => `<code style="font-size:11px">${r.code}</code>` },
    { k: "_pending", l: "Approval", sort: false, r: r => {
        const p = vxPendingFactorRequest(r.code);
        return p
          ? `<span class="vx-b amber" title="Requested by ${p.requestedBy} on ${p.requestedOn}: ${factorChangeSummary(p)}, effective ${p.effectiveFrom}. The value shown is still the one in force.">pending ${factorChangeSummary(p)}</span>`
          : '<span style="color:var(--text-mute)">—</span>';
      } },
    { k: "updatedBy", l: "Last edited by", sort: false, r: r => {
        const who = r.updatedBy || r.createdBy;
        if (!who) return '<span style="color:var(--text-mute)" title="Seeded with the platform — never edited here">seed data</span>';
        return `<span title="${r.createdBy ? "Added by " + r.createdBy + " on " + (r.createdOn || "—") + ". " : ""}Last edited ${r.updatedOn || "—"}">${who.split("@")[0]}
          <div style="font-size:10.3px;color:var(--text-mute)">${r.updatedOn || r.createdOn || ""}</div></span>`;
      } },
    /* A factor added through this screen has no `verified` flag at all —
       that absence is what identifies it, rather than intercepting the
       grid's save. Anything user-added is Not wired, because the engine
       does not execute configured factors. */
    { k: "verified", l: "Status", r: r => (r.custom || r.verified === undefined)
        ? vxWiredChip(false)
        : (r.verified ? '<span class="vx-b green">Verified</span>'
                      : '<span class="vx-b amber">Approximated</span>') },
  ],
  form: [
    /* Grouped into named sections rather than one flat wall of fields — the
       old list read as sixteen equally-weighted boxes with no indication
       that four of them (Code, Type & Value, Change tracking) each depend
       on a choice made earlier in the form. Every field still carries its
       own hint; the section headers add the one level up — what this whole
       cluster of fields is FOR. */
    { k: "_secId", l: "Identity", t: "section", first: true,
      sub: "What this factor is called, and the code it's tracked by." },
    { k: "name", l: "Factor Name",
      hint: "How this factor appears in the rating trace on a quote — write it as an underwriter would say it, e.g. \"Radius of Operation Factor\"." },
    /* Generated, not typed. A free-text code produced the same idea spelled
       several ways (VEH_RADIUS vs VehRadius vs veh-radius) and nothing
       stopped two factors from colliding on the same one. Derived live from
       Name + Line of Business, upper-snake-cased and de-duplicated against
       every code already on file — readonly on Add, since there is nothing
       to type here that the system doesn't already know how to build.
       An EXISTING factor keeps its own code editable (grandfathered): `val`
       only falls back to generating one when the field is genuinely empty,
       so it never overwrites a real, possibly filed, code on save. */
    { k: "code", l: "Factor Code", dependsOn: ["name", "lob"], clearOnChange: false,
      val: r => (r && r.code) || vxGenerateFactorCode(r && r.name, r && r.lob),
      readonly: (r, isNew) => isNew,
      hint: (r, isNew) => isNew
        ? "Generated automatically from the name and line of business — upper snake case, guaranteed unique. This is what exports and the change log key on, so it isn't left to free text."
        : "Short stable identifier, upper snake case (VEH_RADIUS). Used in exports and the change log, so it should not be renamed after quotes have used it." },

    { k: "_secWhere", l: "Where it applies", t: "section",
      sub: "The line of business, coverage and scope this factor is assigned to." },
    { k: "lob", l: "Line of Business", t: "select", opts: vxLobNames(),
      hint: "The line whose engine reads this factor. Changing it reloads the Coverage and Lookup Table lists below, and regenerates the Factor Code above." },
    /* Re-renders when the LOB changes, so the list always shows that line's
       own coverage tree rather than another line's. */
    { k: "coverage", l: "Coverage (Assigned To)", t: "select", opts: r => coverageOptsFor(r), dependsOn: "lob",
      hint: "Which coverage this factor prices — drives the Factor → Assigned To chain on the detail panel. Pick Account Level for factors that price the whole policy." },
    { k: "scope", l: "Scope", t: "select", opts: ["Account", "Insured", "Risk", "Vehicle", "Coverage", "Policy", "Location", "State", "Class of Business"],
      hint: "What the factor is measured against: one Vehicle, one Driver's Risk, the whole Account, and so on. Scope is what a factor varies BY; Coverage above is what it prices." },

    { k: "_secType", l: "Type & value", t: "section",
      sub: "How the factor's value is determined, and what it defaults to." },
    /* Cards instead of a plain dropdown — "Lookup", "Constant" and
       "Computed" read as three real, different mechanisms with their own
       consequences for the fields below, not just three words in a list.
       Judgment stays available only as a grandfathered option on a factor
       that already carries it (an existing kind is never taken away), since
       this screen has no underwriter workflow to actually wire one to. */
    { k: "kind", l: "Type", t: "tiles", opts: r => {
        const base = [
          { value: "Lookup", label: "Lookup", icon: "fa-table-list", desc: "Selected from a rate table by an insured answer." },
          { value: "Constant", label: "Constant", icon: "fa-lock", desc: "Same value applied on every quote." },
          { value: "Computed", label: "Computed", icon: "fa-calculator", desc: "Derived at rating time from several answers." },
        ];
        return (r && r.kind && !base.some(o => o.value === r.kind))
          ? [{ value: r.kind, label: r.kind, icon: "fa-user-pen", desc: "Kept as-is — no longer offered for new factors, since this screen has no workflow to wire it to." }, ...base]
          : base;
      },
      hint: "Every factor added here is marked Not wired regardless of Type — the engine does not yet execute configured factors — so pick whichever actually describes how the value would be found once it is." },
    /* Which table a Lookup factor actually reads. Re-renders on LOB change so
       the list leads with that line of business's own tables. A closed,
       single control either way — `combo` puts the search box INSIDE the
       opened panel instead of as a second, separate control sitting above a
       plain select. tableOptsFor() scopes the list to the chosen LOB plus
       its admin-defined tables, which for Trucking alone still runs past 20
       entries — too many to scan by eye once you're picking, not browsing. */
    { k: "tableId", l: "Lookup Table", t: "combo", opts: r => tableOptsFor(r), dependsOn: "lob",
      searchPlaceholder: "Search by table name…",
      hint: "Which rate table this factor reads. Only meaningful when Type is Lookup — leave as none for Constant or Computed." },
    { k: "driver", l: "Driven by (which insured answer)",
      hint: "The question on the quote that selects the row, or that feeds a Computed formula — \"Radius of Operation\", \"Vehicle stated value\". Leave blank for a Constant; it is driven by nothing." },
    /* Picking "Computed" used to be a dead end — nowhere on this form asked
       WHAT the computation actually is, so a non-technical user chose it and
       then had nothing left to fill in. This does not make Computed real
       (nothing added here is — see the Type hint above) — it gives the
       person configuring it a real place to build the calculation: Formula
       Builder already has the working canvas (drag-and-drop tokens, a live
       evaluator, the real variable palette) for exactly this, so rather than
       a second, smaller canvas duplicating it here, this links straight to
       it and keeps a cross-reference on the factor. Both fields appear only
       for Computed. */
    { k: "formulaId", l: "Attached formula", t: "combo", dependsOn: ["kind", "lob"],
      hideIf: (r, isNew) => (r && r.kind) !== "Computed",
      opts: r => formulaOptsFor(r), searchPlaceholder: "Search by formula name…",
      hint: (r, isNew) => {
        const fid = r && +r.formulaId;
        const href = fid ? `formula-builder.html?id=${fid}` : "formula-builder.html?new=1";
        const label = fid ? "Open in Formula Builder" : "Build a new one in Formula Builder";
        return `The real formula (built on Formula Builder) that documents this factor's computation — a reference for readers, not an execution link, since the engine calls its own hardcoded calculators rather than reading this field. `
          + `<a href="${href}" target="_blank" rel="noopener">${label} →</a>`;
      } },
    { k: "computedFrom", l: "Computed how (quick note)", t: "textarea", dependsOn: "kind",
      hideIf: (r, isNew) => (r && r.kind) !== "Computed",
      hint: "A short description if there's no formula attached above yet — e.g. \"Base Rate × Territory Factor × Increased Limits Factor\". Documentation only, same as the attached formula." },
    { k: "defaultValue", l: "Default Value", t: "number", step: "0.001", def: 1,
      hint: "Applied on every quote (Constant), or as a fallback when a Lookup factor's table has no matching row. 1.000 is neutral — it changes no premium." },

    { k: "_secRef", l: "Reference", t: "section",
      sub: "Where the value came from, for later audit." },
    { k: "sourceSheet", l: "Reference",
      hint: "Where the value came from — a workbook sheet and cell, a filed manual, or the rule that set it. This is what makes a factor auditable later." },

    /* Meaningless on Add — there is no prior value yet for an effective date
       or a reason to describe a change FROM. Showing them anyway was the
       clearest case of the old form displaying fields that did not apply to
       what you were doing; both the section and its two fields now render
       only when editing an existing factor's value. */
    { k: "_secChange", l: "Change tracking", t: "section", hideIf: (r, isNew) => isNew,
      sub: "Only used when changing an existing factor's Default Value — see the audit banner above the fields." },
    /* When a changed value starts applying. A quote whose rate lock predates
       this keeps the previous value — which is the entire point of a rate
       lock, and why the old value is closed rather than overwritten. */
    { k: "effectiveFrom", l: "New value effective from", t: "date", hideIf: (r, isNew) => isNew,
      def: (typeof VX !== "undefined" && VX.referenceDate) || "",
      hint: "Only used when you change the Default Value. The previous value stays in force up to the day before this date, so a quote rate-locked earlier is still priced on it." },
    { k: "changeReason", l: "Reason for the change", hideIf: (r, isNew) => isNew,
      hint: "Shown to whoever approves it, and kept on the factor's value history. e.g. \"Filed rate revision 2026-09\" or \"Corrects a transcription error\"." },
  ],
  filters: [
    { k: "lob", l: "LOB", opts: [...new Set(VX.ratingFactors.map(f => f.lob))] },
    { k: "kind", l: "Type", opts: ["Lookup", "Computed", "Judgment", "Constant"] },
    { k: "coverage", l: "Coverage", opts: [...new Set(VX.ratingFactors.map(f => f.coverage))] },
    { k: "scope", l: "Scope", opts: ["Account", "Insured", "Risk", "Vehicle", "Coverage", "Policy", "Location", "State", "Class of Business"] },
  ],
  rowActions: [
    { i: "fa-pen-to-square", t: "Open factor detail", fn: openFactorPanel },
    { i: "fa-table-cells", t: "View rows in Rate Tables", fn: viewRows },
  ],
  /* Changing a rating factor is a configuration change, so it belongs in the
     audit trail. `beforeSnapshot` is captured on the way in because by the
     time onAfterSave runs, VX.ratingFactors already holds the new values and
     the old ones are gone — logging "from" without it would be guesswork. */
  onBeforeSave: rec => { beforeSnapshot = rec ? { ...rec } : null; },
  /* Who touched this factor, and when. The change log records that a value
     moved, but the factor row itself carried no authorship at all — so
     "who added this?" could only be answered by scrolling an audit list,
     and not at all once it aged out. Stamped here, shown in the grid and on
     the detail panel. */
  onAfterSave: (rec, isNew) => {
    if (rec) {
      const who = vxCurrentUser();
      const when = vxNowStamp();
      if (isNew && !rec.createdBy) { rec.createdBy = who; rec.createdOn = when; }

      /* A VALUE change does not take effect on save — it is raised for
         approval and applied from its effective date once someone else signs
         it off. Everything else on the form (name, reference, driver) is
         descriptive and saves immediately; only the number that decides what
         is charged goes through the gate. */
      const before = beforeSnapshot;
      const valueChanged = !isNew && before
        && String(before.defaultValue ?? "") !== String(rec.defaultValue ?? "");

      if (valueChanged) {
        const proposed = rec.defaultValue;
        rec.defaultValue = before.defaultValue;          // stays in force until approved
        const req = vxRequestFactorChange(rec, proposed, rec.effectiveFrom, rec.changeReason);
        vxToast("Sent for approval",
          `${rec.name}: ${req.from ?? "none"} → ${req.to} from ${req.effectiveFrom}. The current value stays in force until someone else approves it.`, "info");
      } else {
        rec.updatedBy = who;
        rec.updatedOn = when;
        vxLogFactorChange(before, rec);
      }
      delete rec.effectiveFrom; delete rec.changeReason;  // form-only fields
      renderApprovals();
      /* persistCustom() below already owns writing user-added factors to
         localStorage — going around it with a second key would give the
         same row two homes that could disagree. */
      persistCustom();
    }
    beforeSnapshot = null;
  },
  onAfterDelete: rec => { if (rec) vxAudit("Rating Factors", "Deleted record",
    `${rec.name} (${rec.code}) deleted — was ${rec.defaultValue ?? "no default"}`); },
});

/* ---------- Factor side panel ----------
   Replaces a full page/modal round-trip for the most common inspection:
   what this factor defaults to, where that default comes from, and the
   actual values it can take. Uses Bootstrap's Offcanvas (already loaded
   platform-wide) rather than a new hand-rolled component. */
/* Two adjacent registry columns are a From/To or Min/Max band when the first
   column's key or label ends in "min"/"from" and the next one's ends in
   "max"/"to" — the same pairing a reader has to do by eye today (e.g.
   "Points From" / "Points To"). Detecting it once here lets both the
   read-only Factor Values table below and the Edit values modal collapse
   the pair into a single Range column/field instead of two numbers a
   reader must recombine themselves. */
function detectRangePairs(cols) {
  const idx = [];
  for (let i = 0; i < cols.length - 1; i++) {
    const a = cols[i], b = cols[i + 1];
    const aFrom = /(min|from)$/i.test(a.k) || /\b(from|min)\b/i.test(a.l);
    const bTo = /(max|to)$/i.test(b.k) || /\b(to|max)\b/i.test(b.l);
    if (aFrom && bTo) idx.push(i);
  }
  return idx;
}
function rangeColLabel(a, b) {
  const strip = s => s.replace(/\b(from|to|min|max)\b/ig, "").replace(/\s+/g, " ").trim();
  const base = strip(a.l) || strip(b.l);
  return (base && base !== "%" ? base : "Rate") + " Range";
}

/* Real column names and formatted values for a factor's lookup table,
   sourced from the same registry Rate Tables itself renders from
   (rate-tables-registry.js) — so a header here always matches the header a
   click-through to Rate Tables shows, instead of the generic "Key" /
   "Sub-key" / "Value" placeholders that named the SHAPE of the data rather
   than what it actually was. Falls back to that generic walk only for the
   rare VX table with no registry entry. */
function factorValueRows(rec) {
  if (!rec.tableId) return null;
  const lt = ltTableFor(rec.tableId);
  if (lt) {
    if (!lt.columns || !lt.columns.length || !lt.data || !lt.data.length) return null;
    const cols = lt.columns.map(c => c.name);
    const rows = lt.data.slice(0, 40).map(row => cols.map(c => row[c] ?? ""));
    return { cols, rows };
  }
  const t = allRateTables().find(x => x.id === rec.tableId);
  if (t) {
    let raw = []; try { raw = t.rows() || []; } catch (e) { raw = []; }
    if (!raw.length) return null;
    const mergeAt = new Set(detectRangePairs(t.cols));
    const cols = [];
    for (let i = 0; i < t.cols.length; i++) {
      if (mergeAt.has(i)) { cols.push({ l: rangeColLabel(t.cols[i], t.cols[i + 1]), range: [t.cols[i], t.cols[i + 1]] }); i++; }
      else cols.push(t.cols[i]);
    }
    const rows = raw.slice(0, 40).map(r => cols.map(c => c.range
      ? `${vxFmtCell(r[c.range[0].k], c.range[0])} – ${vxFmtCell(r[c.range[1].k], c.range[1])}`
      : vxFmtCell(r[c.k], c)));
    return { cols: cols.map(c => c.l), rows };
  }
  /* No registry entry (a handful of nested VX tables) — the ~40 rate tables
     come in three real shapes: arrays of arrays, arrays of objects, and
     keyed objects (some nested one level, e.g. truckILF is state → limit →
     factor). Flatten generically rather than special-casing each. */
  const raw = VX[rec.tableId];
  if (!raw) return null;
  let rows = [];
  if (Array.isArray(raw)) {
    if (!raw.length) return null;
    rows = raw.slice(0, 40).map(row => Array.isArray(row) ? row : Object.values(row));
  } else if (typeof raw === "object") {
    outer: for (const [k, v] of Object.entries(raw)) {
      if (v && typeof v === "object" && !Array.isArray(v)) {
        for (const [k2, v2] of Object.entries(v)) {
          rows.push([k, k2, v2]);
          if (rows.length >= 40) break outer;
        }
      } else {
        rows.push([k, Array.isArray(v) ? v.join(" · ") : v]);
        if (rows.length >= 40) break outer;
      }
    }
  } else return null;
  if (!rows.length) return null;
  const width = rows[0].length;
  const cols = width <= 1 ? ["Value"] : width === 2 ? ["Key", "Value"] : ["Key", "Sub-key", "Value"];
  return { cols, rows };
}

/* Bridges the read-only detail panel's Edit button into the grid's real
   edit form (vxAgGrid's own formModal, exposed on the returned `grid`
   object). Closes the offcanvas first — Bootstrap does not stack a modal
   cleanly on top of an open offcanvas — then reopens with the current row,
   not the copy the panel was drawn from, in case it changed underneath. */
function closeFactorPanelThenEdit(id) {
  const el = document.getElementById("vxFactorPanel");
  const inst = el && bootstrap.Offcanvas.getInstance(el);
  if (inst) inst.hide();
  setTimeout(() => grid.formModal(vxFactorById(id)), 260);
}
function openFactorPanel(rec) {
  const s = sourceLabel(rec);
  const valueTable = factorValueRows(rec);
  const rangeTxt = rec.rowCount ? fmtRange(rec) : null;

  let el = document.getElementById("vxFactorPanel");
  if (!el) {
    el = document.createElement("div");
    el.id = "vxFactorPanel";
    el.className = "offcanvas offcanvas-end";
    el.tabIndex = -1;
    el.style.width = "min(560px, 94vw)";
    document.body.appendChild(el);
  }
  /* Same header standard as the Edit popup: name, code, and a full row of
     status badges with tooltips, not a plain text line. This panel is what
     the "Open factor detail" pencil actually opens — it sits ahead of the
     grid's own Edit action in the row, so most people land here first, and
     it read as if it had no header worth the name next to that one. */
  const k = KIND[rec.kind] || KIND.Constant;
  const wired = rec.custom || rec.verified === undefined;
  const pending = vxPendingFactorRequest(rec.code);
  el.innerHTML = `
    <div class="offcanvas-header" style="border-bottom:1px solid var(--border);align-items:flex-start">
      <div style="flex:1">
        <h5 class="offcanvas-title" style="font-size:16px;margin:0">${rec.name}</h5>
        <div style="font-size:11.5px;color:var(--text-mute);margin-top:2px">
          <code>${rec.code}</code> · ${rec.lob} · ${rec.coverage || "unassigned"}</div>
        <div class="d-flex align-items-center gap-2 flex-wrap" style="margin-top:8px">
          <span class="vx-b ${k.c}" title="${k.d}"><i class="fa-solid ${k.i} me-1"></i>${rec.kind}</span>
          <span class="vx-b ${s.cls}" title="${s.detail}">${s.label}</span>
          ${wired
            ? `<span class="vx-b amber" title="Added through this screen. The engine does not execute configured factors yet, so this factor is recorded but not read while rating.">Not wired</span>`
            : (rec.verified
                ? `<span class="vx-b green" title="Matched line-by-line to a filed workbook or rating manual.">Verified</span>`
                : `<span class="vx-b amber" title="A working value that has not been checked against a filed source.">Approximated</span>`)}
          <span class="hintdot vx-b gray" style="border:none" title="What the factor is measured against. Scope is what a factor varies BY; the coverage above is what it prices.">${rec.scope || "no scope"} scope</span>
          ${pending ? `<span class="vx-b amber" title="Requested by ${pending.requestedBy} on ${pending.requestedOn}: ${factorChangeSummary(pending)}, effective ${pending.effectiveFrom}. The value shown below is still the one in force.">pending ${factorChangeSummary(pending)}</span>` : ""}
        </div>
      </div>
      <div class="d-flex align-items-start gap-2">
        <button type="button" class="btn btn-outline-secondary btn-sm" onclick="closeFactorPanelThenEdit(${rec.id})"
          title="Edit this factor — name, coverage, scope, type and default value">
          <i class="fa-solid fa-pen me-1"></i>Edit</button>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
      </div>
    </div>
    <div class="offcanvas-body">
      <div class="vx-card" style="margin-bottom:14px">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mute)">Factor Assignment</div>
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;font-size:12px">
          <span class="vx-b purple">${rec.name}</span>
          <i class="fa-solid fa-arrow-right" style="font-size:9px;color:var(--text-mute)"></i>
          <a href="coverages.html" class="vx-b blue" style="text-decoration:none">${rec.assignedTo || rec.coverage || "—"}</a>
          <i class="fa-solid fa-arrow-right" style="font-size:9px;color:var(--text-mute)"></i>
          <span class="vx-b gray">${rec.scope || "—"} scope</span>
          <i class="fa-solid fa-arrow-right" style="font-size:9px;color:var(--text-mute)"></i>
          ${(rec.attachments || []).length
            ? rec.attachments.map(a => `<a href="products.html" class="vx-b cyan" style="text-decoration:none">${a.product}</a>
                <span style="color:var(--text-mute);font-size:10.5px">(<a href="versions.html" style="color:inherit">${a.ratingVersion}</a>)</span>`).join(" · ")
            : `<span style="color:var(--text-mute)">${rec.lob} — no product attached</span>`}
        </div>
      </div>
      <div class="vx-card" style="margin-bottom:14px">
        <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mute)">Default Value</div>
        <div style="font-size:24px;font-weight:800;margin:4px 0 6px">
          ${rec.defaultValue != null ? rec.defaultValue : (rec.rowCount ? '<span style="font-size:15px;color:var(--text-mute)">No single default — always looked up</span>' : '<span class="vx-b red">Not configured</span>')}</div>
        <div style="font-size:12.3px;color:var(--text-dim);line-height:1.6">
          ${rec.rowCount
            ? "Used when the lookup below has no matching row for the insured's answer."
            : "Applied identically on every quote — this factor has no lookup table."}
        </div>
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12.3px">
          <b>Source:</b> <span class="vx-b ${s.cls}">${s.label}</span>
          <div style="color:var(--text-dim);margin-top:4px">${s.detail}</div>
        </div>
        ${rec.kind === "Computed" ? (() => {
          const fname = rec.formulaId ? formulaName(rec.formulaId) : null;
          const body = fname
            ? `Documented in <a href="formula-builder.html?id=${rec.formulaId}" target="_blank" rel="noopener">${fname}</a> on Formula Builder.`
            : (rec.computedFrom
                ? rec.computedFrom.replace(/</g, "&lt;")
                : '<span style="color:var(--text-mute)">Not described yet — open Edit and attach a formula or add a note.</span>');
          return `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12.3px">
            <b>Computed how</b>
            <div style="color:var(--text-dim);margin-top:4px;line-height:1.6">${body}</div>
            <div style="color:var(--text-mute);font-size:11px;margin-top:5px">A cross-reference for readers — the engine calls its own hardcoded calculators rather than reading this field.</div>
          </div>`;
        })() : ""}
        ${/* What this factor was worth, and when. An approved change closes the
             previous value rather than overwriting it, so a quote rate-locked
             before the change can still be shown the value it was priced on. */""}
        ${(() => { const p = vxPendingFactorRequest(rec.code);
          return (p && p.kind !== "tableValues") || (rec.valueHistory || []).length > 1; })() ? `
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12.3px">
          <b>Value history</b>
          ${(() => { const p = vxPendingFactorRequest(rec.code); if (!p || p.kind === "tableValues") return "";
            return `<div style="margin-top:5px;border-left:3px solid var(--warn);padding-left:9px;font-size:11.8px">
              <b style="color:var(--warn)">Pending approval</b> — ${p.from ?? "none"} → ${p.to} from ${p.effectiveFrom},
              requested by ${p.requestedBy.split("@")[0]}. Not in force yet.</div>`; })()}
          <div class="vx-tw" style="margin-top:6px"><table class="vx-t" style="font-size:11.6px">
            <thead><tr><th>Value</th><th>In force</th><th>Approved by</th></tr></thead>
            <tbody>${(rec.valueHistory || []).slice().reverse().map(v => `<tr>
              <td style="font-variant-numeric:tabular-nums"><b>${v.value}</b></td>
              <td>${v.effectiveStart || "—"} ${v.effectiveEnd ? "to " + v.effectiveEnd : "onward"}</td>
              <td style="font-size:11px;color:var(--text-dim)">${v.approvedBy ? v.approvedBy.split("@")[0] : "—"}
                ${v.note ? `<div style="color:var(--text-mute);font-size:10.4px">${v.note}</div>` : ""}</td>
            </tr>`).join("")}</tbody></table></div>
        </div>` : ""}
        ${/* Authorship, so "who put this here and when" is answerable from the
             factor itself rather than only from an audit list that ages out. */""}
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12.3px">
          <b>Record history</b>
          <div style="color:var(--text-dim);margin-top:4px;line-height:1.6">
            ${rec.createdBy
              ? `Added by <b>${rec.createdBy.split("@")[0]}</b>${rec.createdOn ? ` on ${rec.createdOn}` : ""}.`
              : "Seeded with the platform — not added through this screen."}
            ${rec.updatedBy
              ? `<br>Last edited by <b>${rec.updatedBy.split("@")[0]}</b>${rec.updatedOn ? ` on ${rec.updatedOn}` : ""}.`
              : (rec.createdBy ? "" : "<br>Never edited here.")}
          </div>
        </div>
      </div>

      <div class="vx-card">
        <div class="d-flex align-items-center justify-content-between">
          <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-mute)">Factor Values</div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm" onclick="addFactorValue(vxFactorById(${rec.id}))">
              <i class="fa-solid fa-plus me-1"></i>Add value</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="editFactorValues(vxFactorById(${rec.id}))">
              <i class="fa-solid fa-pen me-1"></i>Edit values</button>
          </div>
        </div>
        <div style="font-size:12.3px;color:var(--text-dim);margin:4px 0 10px">
          ${rec.rowCount
            ? `${vxNum(rec.rowCount)} value${rec.rowCount === 1 ? "" : "s"} on file${rangeTxt ? `, ranging ${rangeTxt}` : ""} — selected by <b>${rec.driver === "—" ? "no input" : rec.driver}</b>.`
            : "This factor has no value table — see the default above."}
        </div>
        ${valueTable
          ? (() => {
              const { cols: labels, rows } = valueTable;
              /* The Range/Value column — the last one, whatever it's actually
                 called — carries the computed min–max hint from the grid, so
                 hovering it tells you the full spread even though only the
                 first 40 rows are listed below. */
              const rangeAttr = rangeTxt ? ` data-vx-range="${rangeTxt.replace(/"/g, "&quot;")}"` : "";
              const thead = `<thead><tr>${labels.map((l, i) => `<th${i === labels.length - 1 ? rangeAttr : ""}>${l}</th>`).join("")}</tr></thead>`;
              const body = `<tbody>${rows.map(r => `<tr>${r.map(c => `<td style="font-size:11.8px">${c === null || c === undefined || c === "" ? "—" : c}</td>`).join("")}</tr>`).join("")}</tbody>`;
              return `<div class="vx-tw" style="max-height:340px;overflow:auto"><table class="vx-t">${thead}${body}</table></div>`
                   + (rec.rowCount > rows.length ? `<div style="font-size:11.3px;color:var(--text-mute);margin-top:7px">Showing first ${rows.length} of ${vxNum(rec.rowCount)} — <a href="${tableLinkHref(rec.tableId)}">open the full table →</a></div>` : "");
            })()
          : (rec.rowCount
              ? `<div style="font-size:12.3px"><a href="${tableLinkHref(rec.tableId)}">${isLtId(rec.tableId) ? "Browse this factor's rows in Lookup Tables" : "Browse this factor's rows in Rate Tables"} →</a></div>`
              : "")}
      </div>
    </div>`;
  bootstrap.Offcanvas.getOrCreateInstance(el).show();
}


/* ---------------------------------------------------------------------------
   Lookup-table selection + value editing.

   A factor of Kind "Lookup" has to read SOME table, but the form never asked
   which one: `tableId` was only ever set by the seed data, so any factor added
   through the UI was a Lookup pointing at nothing. RATE_TABLES (now shared via
   rate-tables-registry.js) is the real registry the Rate Tables screen renders
   from, so the picker offers exactly the tables that actually exist.
   --------------------------------------------------------------------------- */
function vxFactorById(id) { return (VX.ratingFactors || []).find(f => f.id === id); }
function allRateTables() { return (typeof RATE_TABLES !== "undefined") ? RATE_TABLES : []; }

/* A table an admin defines on Lookup Tables (VX.lookupTables -- "Add" on that
   screen) is a second, separate registry from RATE_TABLES: real config, not
   a filed workbook. Addressed with an "lt:" prefix so its ids (small
   integers assigned by the grid) never collide with RATE_TABLES' own string
   ids -- a table added there shows up here without either registry having
   to know about the other's id scheme. */
function isLtId(id) { return typeof id === "string" && id.slice(0, 3) === "lt:"; }
function ltIdOf(id) { return +String(id).slice(3); }
function ltTableFor(id) { return isLtId(id) ? (VX.lookupTables || []).find(t => t.id === ltIdOf(id)) : null; }
/* Where "open the full table" should send you — Rate Tables for the filed
   registry, Lookup Tables for an admin-defined one. */
function tableLinkHref(tableId) {
  return isLtId(tableId) ? "lookup-tables.html" : "rate-tables.html?table=" + encodeURIComponent(tableId || "");
}

/* Tables for this factor's LOB first, then the rest — a Trucking factor almost
   always wants a Trucking table, but cross-LOB picks stay possible. Admin-
   defined lookup tables for the same LOB are appended under their own
   heading -- tableOptsFor() re-reads VX.lookupTables live every call (on
   open, and again whenever Line of Business changes), so a table just added
   on Lookup Tables becomes selectable here without a page reload. */
function tableOptsFor(rec) {
  const lob = rec && rec.lob;
  const all = allRateTables();
  const opt = t => ({ value: t.id, label: `${t.name} · ${t.cov}` });
  const none = [{ value: "", label: "— none (no table) —" }];
  const admin = (VX.lookupTables || []).filter(t => !lob || t.lob === lob)
    .map(t => ({ value: "lt:" + t.id, label: `${t.name} (admin-defined)` }));
  const adminHeading = admin.length ? [{ value: "", label: "-- admin-defined lookup tables --" }] : [];
  // A Trucking factor should only ever be offered Trucking tables, not
  // General Liability's or Property's — cross-LOB entries in this list were
  // never a real choice, just noise the reader had to scroll past.
  if (!lob) return none.concat(all.map(t => ({ value: t.id, label: `${t.name} · ${t.lob}` }))).concat(adminHeading).concat(admin);
  return none.concat(all.filter(t => t.lob === lob).map(opt)).concat(adminHeading).concat(admin);
}
function tableName(id) {
  const lt = ltTableFor(id);
  if (lt) return lt.name;
  const t = allRateTables().find(x => x.id === id);
  return t ? t.name : (id || "—");
}


/* ---------------------------------------------------------------------------
   System-generated Factor Code.

   A free-text code field let the same idea get spelled several ways
   (VEH_RADIUS vs VehRadius vs veh-radius) and never stopped two factors from
   colliding on the same code. Built instead from Line of Business + Factor
   Name \u2014 upper snake case, short, and checked against every code already on
   file so it can never collide silently.
   --------------------------------------------------------------------------- */
const VX_LOB_PREFIX = {
  "Commercial Trucking": "TRK", "Commercial Property": "PR", "General Liability": "GL",
  "Professional Liability (MPL)": "MPL", "Cyber": "CY", "Workers' Compensation": "WC",
};
function vxLobPrefix(lob) {
  if (VX_LOB_PREFIX[lob]) return VX_LOB_PREFIX[lob];
  const letters = String(lob || "").replace(/[^A-Za-z]/g, "");
  return letters.slice(0, 3).toUpperCase() || "GEN";
}
/* Drops filler words ("Factor", "the", "of") that add length without adding
   meaning \u2014 every real factor name ends in one, so keeping it would make
   "Territory Base Loss Cost Factor" and "Territory Base Loss Cost" collide
   on nothing useful while wasting most of the code's readable length. */
const VX_CODE_STOPWORDS = new Set(["factor", "the", "of", "a", "an", "for", "and", "rate", "value"]);
function slugifyFactorName(name) {
  const words = String(name || "").toUpperCase().replace(/[^A-Z0-9]+/g, " ").trim().split(/\s+/).filter(Boolean);
  const kept = words.filter(w => !VX_CODE_STOPWORDS.has(w.toLowerCase()));
  return (kept.length ? kept : words).slice(0, 3).join("_").slice(0, 24) || "FACTOR";
}
function vxGenerateFactorCode(name, lob) {
  if (!name) return "";
  const prefix = vxLobPrefix(lob), slug = slugifyFactorName(name);
  // Skip the prefix rather than double it when the name already starts with
  // it — "MPL Increased Limits Factor" reads as MPL_INCREASED_LIMITS, not
  // MPL_MPL_INCREASED_LIMITS.
  const base = slug.startsWith(prefix + "_") ? slug : `${prefix}_${slug}`;
  const existing = new Set((VX.ratingFactors || []).map(f => f.code).filter(Boolean));
  if (!existing.has(base)) return base;
  let n = 2;
  while (existing.has(`${base}_${n}`)) n++;
  return `${base}_${n}`;
}

/* Coverage ("Assigned To") options for the chosen line of business.

   This was a free-text box, which is why the same idea is spelled several
   ways across the registry and why the Coverage filter above has a ragged
   option list \u2014 a typo silently created a new "coverage" that no coverage
   record backs. The real coverage tree (VX.cob) already defines what a
   factor can be assigned to, so it is offered directly.

   Two additions beyond the tree, both real:
     - Account Level, for factors that price the whole account rather than
       any one coverage (the account-factor chain genuinely works this way).
     - whatever the record already carries, if it predates this list \u2014 an
       existing assignment is kept selectable rather than silently reset to
       something the factor was never assigned to. */
function coverageOptsFor(rec) {
  const lob = rec && rec.lob;
  const tree = (VX.cob || []).filter(c => c.lob === lob);
  const primary = tree.filter(c => c.level === "Primary").map(c => c.name);
  const child = tree.filter(c => c.level !== "Primary").map(c => c.name);
  const out = [];
  if (primary.length) out.push({ value: "", label: "\u2500\u2500 primary coverages \u2500\u2500" }, ...primary.map(n => ({ value: n, label: n })));
  if (child.length) out.push({ value: "", label: "\u2500\u2500 child coverages \u2500\u2500" }, ...child.map(n => ({ value: n, label: n })));
  out.push({ value: "", label: "\u2500\u2500 other \u2500\u2500" }, { value: "Account Level", label: "Account Level (whole account, not one coverage)" });
  const known = new Set(out.map(o => o.value));
  if (rec && rec.coverage && !known.has(rec.coverage)) {
    out.unshift({ value: rec.coverage, label: rec.coverage + " (current)" });
  }
  return out;
}

/* Formulas for the "Attached formula" field on a Computed factor — this
   line of business's own first, matching the same lead-with-your-own-LOB
   pattern the Lookup Table picker uses. */
function formulaOptsFor(rec) {
  const lob = rec && rec.lob;
  const all = VX.savedFormulas || [];
  const mine = all.filter(f => f.lob === lob);
  const rest = all.filter(f => f.lob !== lob);
  const none = [{ value: "", label: "— none —" }];
  const opt = f => ({ value: f.id, label: f.name });
  return none.concat(mine.map(opt))
    .concat(rest.length ? [{ value: "", label: "── other lines of business ──" }] : [])
    .concat(rest.map(opt));
}
function formulaName(id) {
  const f = (VX.savedFormulas || []).find(x => x.id === +id);
  return f ? f.name : null;
}

/* ---- value editing -------------------------------------------------------
   Rate tables come in three shapes: a flat {key: value} map, a nested
   {key: {key2: value}} map, and an array of row objects. Rather than
   special-casing each, walk to the numeric leaves and address every one by a
   path. One editor then works for all three, and writes back into the very
   object engine.js dereferences while rating.

   Where the table's registry entry (rate-tables-registry.js) declares a
   From/To or Min/Max column pair \u2014 the same pairing factorValueRows() above
   uses to build a Range column \u2014 two adjacent leaves in the same row are
   grouped into one Range item with two bounds edited together, instead of
   two disconnected rows labeled with raw object keys a reader has to
   recombine themselves. */
/* Never an editable rate value, whatever table it's on \u2014 the row's own
   primary key. Left in, "id" showed up as its own row in the Edit values
   list (Fleet Size Factor's raw rows carry one) with nothing to distinguish
   it from an actual factor value, and editing it would silently corrupt the
   table's row order rather than change anything the engine rates on. */
const LEAF_EXCLUDE_KEYS = new Set(["id"]);
function colLabelFor(cols, k) {
  const c = cols && cols.find(c => c.k === k);
  return c ? c.l : k;
}
/* Every non-numeric column the registry declares, joined \u2014 not just the
   first match. Fleet Size Factor's rows are only distinguishable by TWO
   columns together (Vehicle Type and Units); showing just the first left
   twenty rows for the same vehicle type reading as identical labels. */
function rowLabel(row, i, cols) {
  if (cols) {
    const parts = cols.filter(c => row[c.k] != null && typeof row[c.k] !== "number").map(c => String(row[c.k]));
    if (parts.length) return parts.join(" \u00b7 ");
  }
  for (const k of ["name", "state", "code", "label", "type", "class"]) if (row[k] != null) return String(row[k]);
  return "row " + (i + 1);
}
/* A raw row can carry a numeric min/max (or from/to) pair the registry never
   declared as columns at all \u2014 Fleet Size Factor stores its unit band as
   both a text label ("Units") AND the raw min/max the label was built from.
   Matched by key name alone so it still collapses into one Range control
   instead of showing as two loose, unlabeled numbers. */
function guessRangePartner(k, keys) {
  const lk = k.toLowerCase();
  let suffix = null, want = null;
  if (lk.endsWith("min")) { suffix = "min"; want = "max"; }
  else if (lk === "from") { suffix = "from"; want = "to"; }
  else return null;
  const prefix = lk.slice(0, lk.length - suffix.length);
  return keys.find(x => x.toLowerCase() === prefix + want) || null;
}
function leafItems(node, cols) {
  const rangeIdx = cols ? new Set(detectRangePairs(cols)) : new Set();
  const out = [];
  function fromRow(row, path, ctx) {
    const numKeys = Object.keys(row).filter(k => typeof row[k] === "number" && !LEAF_EXCLUDE_KEYS.has(k));
    const used = new Set();
    numKeys.forEach(k => {
      if (used.has(k)) return;
      const ci = cols ? cols.findIndex(c => c.k === k) : -1;
      const declared = (ci >= 0 && rangeIdx.has(ci) && cols[ci + 1] && numKeys.includes(cols[ci + 1].k)) ? cols[ci + 1].k : null;
      const partnerKey = declared || guessRangePartner(k, numKeys);
      if (partnerKey) {
        used.add(k); used.add(partnerKey);
        const c1 = cols && cols.find(c => c.k === k), c2 = cols && cols.find(c => c.k === partnerKey);
        const label = (c1 && c2) ? rangeColLabel(c1, c2) : "Value Range";
        out.push({ kind: "range", label: ctx ? `${ctx} \u00b7 ${label}` : label,
          from: { path: path.concat([k]), value: row[k] }, to: { path: path.concat([partnerKey]), value: row[partnerKey] } });
      } else {
        used.add(k);
        out.push({ kind: "single", label: ctx ? `${ctx} \u00b7 ${colLabelFor(cols, k)}` : colLabelFor(cols, k), path: path.concat([k]), value: row[k] });
      }
    });
  }
  if (Array.isArray(node)) {
    node.forEach((row, i) => { if (row && typeof row === "object") fromRow(row, [i], rowLabel(row, i, cols)); });
    return out;
  }
  (function walk(n, path, depth) {
    if (depth > 4 || !n || typeof n !== "object") return;
    const numKeys = Object.keys(n).filter(k => typeof n[k] === "number" && !LEAF_EXCLUDE_KEYS.has(k));
    if (numKeys.length) fromRow(n, path, path.join(" \u203a "));
    Object.keys(n).forEach(k => { const v = n[k]; if (v && typeof v === "object" && !Array.isArray(v)) walk(v, path.concat([k]), depth + 1); });
  })(node, [], 0);
  return out;
}
/* Add a row from the factor panel instead of making an analyst leave the
   current record. Flat key-to-number tables cover the lookup shape shown in
   the panel (for example State -> Base Loss Cost); array tables use their
   registry columns so their row fields stay named after the actual table. */
function addFactorValue(rec) {
  if (rec && isLtId(rec.tableId)) {
    vxModal(`${rec.name} — add value`,
      `<div class="sub">This factor reads an admin-defined lookup table, not the filed rate-table registry — add rows to it from <a href="lookup-tables.html">Lookup Tables</a> instead.</div>`,
      [{ t: "Close", c: "secondary" }]);
    return;
  }
  const root = rec && rec.tableId && VX[rec.tableId];
  const table = rec && allRateTables().find(t => t.id === rec.tableId);
  if (!root || !table) {
    vxModal(`${rec ? rec.name : "Factor"} — add value`,
      `<div class="sub">Attach a supported lookup table before adding a value.</div>`,
      [{ t: "Close", c: "secondary" }]);
    return;
  }
  const cols = table.cols || [];
  const isFlatMap = !Array.isArray(root) && typeof root === "object"
    && Object.values(root).every(v => typeof v === "number");
  const isObjectRows = Array.isArray(root) && root.every(r => r && typeof r === "object" && !Array.isArray(r));
  if (!isFlatMap && !isObjectRows) {
    vxModal(`Add value — ${rec.name}`, `<div class="sub">This table has a nested structure. Add rows from <a href="rate-tables.html?table=${encodeURIComponent(rec.tableId)}">Rate Tables</a> so all required lookup keys can be supplied.</div>`,
      [{ t: "Close", c: "secondary" }]);
    return;
  }

  const fields = isFlatMap
    ? [{ k: "key", l: (cols[0] || {}).l || "Key", numeric: false }, { k: "value", l: (cols[1] || {}).l || "Value", numeric: true }]
    : cols.map(c => ({ k: c.k, l: c.l, numeric: !!(c.money || c.f) || typeof (root[0] || {})[c.k] === "number" }));
  const effectiveDate = rec.valueEffectiveDate || VX.referenceDate || new Date().toISOString().slice(0, 10);
  vxModal(`Add value — ${rec.name}`, `
    <div class="sub mb-3">Add a new row to <b>${table.name}</b>. Sent for someone else's approval — this table keeps its current rows, unchanged, until then.</div>
    <div class="row g-3">${fields.map(f => `<div class="col-md-6"><label>${f.l}</label>
      <input id="fav-${f.k}" class="form-control" type="${f.numeric ? "number" : "text"}" ${f.numeric ? 'step="any"' : ""}></div>`).join("")}
      <div class="col-md-6"><label>In force from</label><input id="fav-effective-date" class="form-control" type="date" value="${effectiveDate}"></div>
      <div class="col-md-6"><label>Reason</label><input id="fav-reason" class="form-control" placeholder="Optional"></div>
    </div>`,
    [{ t: "Cancel", c: "secondary" }, { t: "Send for approval", c: "primary", fn: () => {
      const row = {};
      for (const f of fields) {
        const input = document.getElementById(`fav-${f.k}`);
        const raw = (input && input.value || "").trim();
        if (!raw) { vxToast("Value not added", `${f.l} is required`, "err"); return false; }
        const value = f.numeric ? Number(raw) : raw;
        if (f.numeric && !Number.isFinite(value)) { vxToast("Value not added", `${f.l} must be a number`, "err"); return false; }
        row[f.k] = value;
      }
      const effectiveDate = document.getElementById("fav-effective-date").value;
      if (!effectiveDate) { vxToast("Value not added", "Effective date is required", "err"); return false; }
      const reason = document.getElementById("fav-reason").value;
      if (isFlatMap) {
        if (Object.prototype.hasOwnProperty.call(root, row.key)) { vxToast("Value not added", `${row.key} already exists`, "err"); return false; }
        const req = vxRequestFactorTableChange(rec, null, { value: row.value }, row.key, effectiveDate, reason);
        vxToast("Sent for approval", `${rec.name}: add ${row.key} = ${row.value}, effective ${req.effectiveFrom}.`, "info");
      } else {
        const req = vxRequestFactorTableChange(rec, null, row, null, effectiveDate, reason);
        vxToast("Sent for approval", `${rec.name}: add a row to ${table.name}, effective ${req.effectiveFrom}.`, "info");
      }
      renderApprovals();
      grid.reload();
      /* Repaint the still-open factor panel only after Bootstrap has closed
         this modal; otherwise its focus trap and the offcanvas compete. */
      setTimeout(() => {
        const panel = document.getElementById("vxFactorPanel");
        if (panel && panel.classList.contains("show")) openFactorPanel(vxFactorById(rec.id));
      }, 280);
    } }]);
}

function editFactorValues(rec) {
  if (isLtId(rec.tableId)) {
    vxModal(`${rec.name} — edit values`,
      `<div class="sub">This factor reads an admin-defined lookup table, not the filed rate-table registry — edit its rows from <a href="lookup-tables.html">Lookup Tables</a> instead.</div>`,
      [{ t: "Close", c: "secondary" }]);
    return;
  }
  if (!rec.tableId || !VX[rec.tableId]) {
    vxModal(`${rec.name} \u2014 no table attached`, `
      ${vxNotWiredBanner("This factor has no lookup table to edit.",
        "Edit the factor and choose a <b>Lookup Table</b> to attach one, or set its <b>Default Value</b> if it is a constant.")}`,
      [{ t: "Close", c: "secondary" }]);
    return;
  }
  const regTable = allRateTables().find(x => x.id === rec.tableId);
  const cols = regTable ? regTable.cols : null;
  const items = leafItems(VX[rec.tableId], cols);
  if (!items.length) {
    vxModal(`${rec.name} \u2014 values`, `<div class="sub">No editable numeric values found in this table.</div>`,
      [{ t: "Close", c: "secondary" }]);
    return;
  }
  const shown = items.slice(0, 250);
  const s = sourceLabel(rec);
  const effectiveDate = rec.valueEffectiveDate || VX.referenceDate || new Date().toISOString().slice(0, 10);
  /* Named after the FACTOR, but never said which real file or table the
     numbers actually come from \u2014 "Territory Base Loss Cost" told you what
     you were editing, not where it was sourced from or what its 12 rows are
     keyed by. Same badge-header standard as the other two factor popups. */
  vxModal(`Edit values \u2014 ${rec.name}`, `
    <div class="mb-3" style="border:1px solid var(--border);border-left:3px solid var(--primary);
        border-radius:0 10px 10px 0;background:var(--surface-2);padding:11px 14px">
      <div class="d-flex align-items-center gap-2 flex-wrap">
        <b style="font-size:14px">${rec.name}</b>
        <code style="font-size:11px">${rec.code}</code>
        <span class="vx-b ${s.cls}" title="${s.detail}">${s.label}</span>
        ${rec.custom || rec.verified === undefined
          ? `<span class="vx-b amber" title="Added through the Rating Factors screen. The engine does not execute configured factors yet, so this table is recorded but not read while rating.">Not wired</span>`
          : (rec.verified
              ? `<span class="vx-b green" title="Matched line-by-line to a filed workbook or rating manual.">Verified</span>`
              : `<span class="vx-b amber" title="Working values that have not been checked against a filed source.">Approximated</span>`)}
      </div>
      <div style="font-size:11.6px;color:var(--text-dim);margin-top:6px;line-height:1.6">
        ${rec.lob} \u00b7 ${rec.coverage || "unassigned"} \u00b7
        <span class="hintdot" title="The real workbook sheet (or filed manual) these ${vxNum(items.length)} rows were extracted from \u2014 the actual file behind this table, not just this factor's display name.">
          source: <b>${rec.sourceSheet || "\u2014"}</b></span>
        \u00b7
        <span class="hintdot" title="The internal table this factor reads at rating time (VX.${rec.tableId}). Same table shown on the Rate Tables screen \u2014 open it there for the full row set and history.">
          table key: <code>${rec.tableId}</code></span>
      </div>
      <div style="font-size:11.4px;color:var(--text-dim);margin-top:7px;padding-top:7px;border-top:1px solid var(--border)">
        <i class="fa-solid fa-triangle-exclamation me-1" style="color:var(--warn)"></i>
        These are the live numbers <code>engine.js</code> reads while rating. Sending this for approval does <b>not</b> change what the next quote is charged \u2014
        the table keeps its current values until someone else approves it, then from its effective date.
        ${items.length > shown.length ? `Showing the first ${vxNum(shown.length)} of ${vxNum(items.length)} rows \u2014 ` : ""}<a href="rate-tables.html?table=${encodeURIComponent(rec.tableId)}">open the full table on Rate Tables \u2192</a>
      </div>
    </div>
    <div class="row g-2 align-items-end mb-2">
      <div class="col-sm-5"><label class="mb-1">In force from</label>
        <input id="fv-effective-date" class="form-control form-control-sm" type="date" value="${effectiveDate}"></div>
      <div class="col-sm-7"><label class="mb-1">Reason</label>
        <input id="fv-reason" class="form-control form-control-sm" placeholder="Optional"></div>
    </div>
    <input class="form-control form-control-sm mb-2" id="fvq" placeholder="Filter rows\u2026"
      oninput="fvFilter(this.value)">
    <div class="vx-tw" style="max-height:400px;overflow:auto"><table class="vx-t">
      <thead><tr><th>Row</th><th style="width:190px;text-align:right">Value / Range</th></tr></thead>
      <tbody id="fvBody">${shown.map((it, i) => it.kind === "range" ? `<tr data-fvrow="${i}">
        <td style="font-size:11.8px">${it.label}</td>
        <td style="text-align:right;white-space:nowrap">
          <input type="number" step="0.0001" class="form-control form-control-sm fv d-inline-block" style="width:82px;text-align:right"
            data-i="${i}" data-part="from" value="${it.from.value}" title="Range start">
          <span style="color:var(--text-mute);padding:0 2px">\u2013</span>
          <input type="number" step="0.0001" class="form-control form-control-sm fv d-inline-block" style="width:82px;text-align:right"
            data-i="${i}" data-part="to" value="${it.to.value}" title="Range end"></td></tr>`
        : `<tr data-fvrow="${i}">
        <td style="font-size:11.8px">${it.label}</td>
        <td style="text-align:right"><input type="number" step="0.0001" class="form-control form-control-sm fv"
          data-i="${i}" value="${it.value}" style="text-align:right"></td></tr>`).join("")}</tbody>
    </table></div>`,
    [{ t: "Cancel", c: "secondary" },
     { t: "Send for approval", c: "primary", fn: () => {
        const edits = [];
        const effectiveDate = document.getElementById("fv-effective-date").value;
        if (!effectiveDate) { vxToast("Not sent", "Effective date is required", "err"); return false; }
        const reason = document.getElementById("fv-reason").value;
        // A Range item edits its From and To bounds through two inputs sharing
        // one data-i — data-part says which bound each one is.
        document.querySelectorAll(".fv").forEach(inp => {
          const it = shown[+inp.dataset.i];
          const part = inp.dataset.part;
          const bound = part ? it[part] : it;
          const v = parseFloat(inp.value);
          if (!isNaN(v) && v !== bound.value) {
            edits.push({ path: bound.path, label: `${it.label}${part ? ` (${part})` : ""}`, from: bound.value, to: v });
          }
        });
        if (!edits.length) { vxToast("No changes", "Nothing was different", "info"); return; }
        const req = vxRequestFactorTableChange(rec, edits, null, null, effectiveDate, reason);
        vxToast("Sent for approval",
          `${rec.name}: ${edits.length} value${edits.length === 1 ? "" : "s"} in ${tableName(rec.tableId)}, effective ${req.effectiveFrom}. The current values stay in force until someone else approves it.`, "info");
        renderApprovals();
        grid.reload();
     } }], "modal-lg");
}
function fvFilter(q) {
  q = (q || "").toLowerCase();
  document.querySelectorAll("#fvBody tr").forEach(tr => {
    tr.style.display = !q || tr.textContent.toLowerCase().includes(q) ? "" : "none";
  });
}

function viewRows(rec) {
  if (rec.custom) {
    vxModal(`${rec.name} — custom factor`, `
      ${vxNotWiredBanner("Registered, but <b>not wired to the rating engine</b>.",
        "The engine currently executes hardcoded calculators and does not read configured factors, so adding a factor here does not change any premium.")}
      <div class="row g-3">
        <div class="col-md-6"><label>Code</label><div style="font-size:13px"><code>${rec.code}</code></div></div>
        <div class="col-md-6"><label>Type</label><div style="font-size:13px">${rec.kind}</div></div>
        <div class="col-md-6"><label>Driven by</label><div style="font-size:13px">${rec.driver || "—"}</div></div>
        <div class="col-md-6"><label>Default</label><div style="font-size:13px">${rec.defaultValue ?? "—"}</div></div>
      </div>`, [{ t: "Close", c: "secondary" }]);
    return;
  }
  if (!rec.tableId) {
    vxModal(`${rec.name}`, `
      <div class="row g-3 mb-3">
        <div class="col-md-6"><label>Type</label><div style="font-size:13px">${rec.kind}</div></div>
        <div class="col-md-6"><label>Driven by</label><div style="font-size:13px">${rec.driver}</div></div>
        <div class="col-md-6"><label>Reference</label><div style="font-size:13px"><code>${rec.sourceSheet || "—"}</code></div></div>
        <div class="col-md-6"><label>Value</label><div style="font-size:13px">${rec.defaultValue ?? "—"}</div></div>
      </div>
      <div class="vx-ai" style="padding:10px 14px;font-size:12.4px"><i class="fa-solid fa-circle-info me-1"></i>
        This factor has no browsable rate table — it is ${rec.kind === "Computed"
          ? "computed at rating time from several answers rather than looked up"
          : rec.kind === "Judgment" ? "set by an underwriter rather than a table"
          : "a fixed constant applied identically on every quote"}.</div>`,
      [{ t: "Close", c: "secondary" }]);
    return;
  }
  location.href = tableLinkHref(rec.tableId);
}

renderApprovals();

/* Persist anything added through this screen so it survives a reload.
   Runs off the grid's own state rather than intercepting its save button —
   any factor lacking a `verified` flag was user-added. */
function persistCustom() {
  const added = VX.ratingFactors.filter(f => f.verified === undefined || f.custom);
  VX.customFactors = added.map(f => ({ ...f, custom: true, wired: false }));
  localStorage.setItem("vxCustomFactors", JSON.stringify(VX.customFactors));
}
["click", "change"].forEach(ev => document.addEventListener(ev, () => setTimeout(persistCustom, 200), true));

</script>
<script src="assets/js/tooltip-dictionary.js"></script>
<script src="assets/js/column-tooltips.js"></script>
</body>
