      </div>
      <div class="grp"><h3><i class="fa-solid fa-user-tie" style="color:var(--primary)"></i>Underwriter</h3>
        <div class="bd"><div class="row g-3">
          <div class="col-md-5"><label>Underwriter</label><input class="form-control form-control-sm" id="underwriter" list="uwNames" value="${S.underwriter || ""}" placeholder="Who this account is assigned to">
            <datalist id="uwNames">${(VX.users || []).filter(u => u.role === "Underwriter").map(u => `<option value="${u.name}">`).join("")}</datalist></div>
          <div class="col-md-5"><label>Underwriter Manager</label><input class="form-control form-control-sm" id="underwriterManager" list="uwmNames" value="${S.underwriterManager || ""}" placeholder="Who reviews this account if it's referred">
            <datalist id="uwmNames">${(VX.users || []).filter(u => u.role === "Underwriter Manager").map(u => `<option value="${u.name}">`).join("")}</datalist>
            <small class="d-block" style="font-size:10.5px;color:var(--text-mute);margin-top:2px">Clears any quote an eligibility rule has referred (see Roles) — distinct from the day-to-day Underwriter above.</small></div>
        </div></div>
      </div>
      <div class="grp"><h3><i class="fa-solid fa-user-tie" style="color:var(--primary)"></i>Broker Info</h3>
        <div class="bd"><div class="row g-3">
          <div class="col-md-4"><label>Producing Agency</label><input class="form-control form-control-sm F" data-k="brokerAgency" value="${S.v.brokerAgency || ""}"></div>
          <div class="col-md-4"><label>Producer / Agent Name</label><input class="form-control form-control-sm F" data-k="brokerAgent" value="${S.v.brokerAgent || ""}"></div>
          <div class="col-md-4"><label>Agency Code / NPN</label><input class="form-control form-control-sm F" data-k="brokerAgencyCode" value="${S.v.brokerAgencyCode || ""}"></div>
          <div class="col-md-4"><label>Agent License #</label><input class="form-control form-control-sm F" data-k="brokerLicense" value="${S.v.brokerLicense || ""}"></div>
          <div class="col-md-4"><label>Broker Email</label><input type="email" class="form-control form-control-sm F" data-k="brokerEmail" value="${S.v.brokerEmail || ""}"></div>
          <div class="col-md-4"><label>Broker Phone</label><input type="tel" class="form-control form-control-sm F" data-k="brokerPhone" value="${S.v.brokerPhone || ""}"></div>
        </div></div></div>`,
    risk: () => `
      <div class="vx-card vx-anim">
        <h2>${L.n} — Risk Details</h2>
        <div class="sub">Only the questions this product needs. Every answer feeds a rating factor.</div>
        ${questions("det")}
      </div>`,
    cov: () => `
      <div class="vx-card vx-anim">
        <h2>Coverage Selection</h2>
        <div class="sub">Pick the primary coverages to quote — each one reveals the child coverages it carries.</div>
        ${questions("cov")}
      </div>`,
    vehicles: () => `
      <div class="vx-card vx-anim">
        <h2>Vehicles &amp; Drivers</h2>
        <div class="sub">The scheduled units and drivers on this account. Each unit rates on its own class, value and garaging, so the schedule drives premium directly.</div>
      </div>
      ${questions("vehicles")}`,
    commodities: () => `
      <div class="vx-card vx-anim">
        <h2>Commodities Hauled</h2>
        <div class="sub">What this fleet actually carries. The Cargo charge rates off the single highest classification factor among the coverable commodities selected, so the mix matters — not just the limit.</div>
      </div>
      ${questions("commodities")}`,
    factors: () => `
      <div class="vx-card vx-anim">
        <div class="vx-card-head">
          <div><h2>Rating Factors</h2>
          <div class="sub">Every factor the engine applies to this risk — what drove it, the rule it matched,
            and what it did to the premium.</div></div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm" onclick="setAllFactorSections(true)">Expand all</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="setAllFactorSections(false)">Collapse all</button>
          </div>
        </div>
        <div id="factorChain"></div>
      </div>
      <div class="vx-card vx-anim" id="acctCard" style="display:none;padding:0;overflow:hidden">
        <div onclick="toggleAcctSection()" style="display:flex;align-items:center;gap:8px;padding:13px 16px;
          cursor:pointer;background:var(--surface-2)">
          <i class="fa-solid fa-chevron-right" data-acctchev style="font-size:10px;color:var(--text-mute);width:11px"></i>
          <i class="fa-solid fa-sliders" style="color:var(--primary)"></i>
          <b style="font-size:13px">Account-Level Factor</b>
          <span class="vx-b gray">8 answers</span>
        </div>
        <div data-acctbody style="padding:14px 16px;display:none">
          <div class="sub" style="margin-top:-4px">The eight underwriting answers that combine into a single
            policy-level credit or debit.</div>
          <div id="acctBreakdown"></div>
          <div id="expModPreview" class="mt-3"></div>
        </div>
      </div>`,
    premium: () => `<div id="premiumPane"></div>`,
  }[S.tab]();

  document.getElementById("vxBody").innerHTML = `
    <div id="quoteCtx"></div>
    ${tabBar()}
    <div class="row g-3">
      <div class="col-lg-8">${body}
        <div class="d-flex gap-2 mt-3">
          ${S.tab !== "insured" ? `<button class="btn btn-outline-secondary btn-sm" id="prevTab"><i class="fa-solid fa-arrow-left me-1"></i>Back</button>` : ""}
          ${S.tab !== "premium"
            ? `<button class="btn btn-primary btn-sm ms-auto" id="nextTab">Continue<i class="fa-solid fa-arrow-right ms-1"></i></button>`
            : `<button class="btn btn-primary btn-sm ms-auto" id="calcBtn"><i class="fa-solid fa-bolt me-1"></i>${S.res ? "Recalculate" : "Calculate"} Premium</button>`}
        </div>
      </div>
      <div class="col-lg-4"><div id="side">
        <div class="vx-card vx-anim"><div class="vx-empty"><i class="fa-solid fa-calculator"></i>
          ${S.res ? "" : "Complete the tabs and calculate to see the premium and how it was built up."}</div></div>
      </div></div>
    </div>`;

  renderQuoteContext();
  bind();
  if (S.tab === "insured") counties();
  if (S.tab === "factors") {
    // Account-level breakdown + experience mod are Commercial Trucking only —
    // the other lines have no equivalent policy-level factor, so the card is
    // hidden rather than shown empty.
    const acctCard = document.getElementById("acctCard");
    if (acctCard) acctCard.style.display = S.lob === "TRUCK" ? "" : "none";
    if (S.lob === "TRUCK") { renderAcctBreakdown(); renderExpModPreview(); renderAcctSection(); }
    renderFactorChain();
  }

  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => goTab(b.dataset.tab));
  const nb = document.getElementById("nextTab");
  if (nb) nb.onclick = () => goTab(TABS[TABS.findIndex(t => t.k === S.tab) + 1].k);
  const pb = document.getElementById("prevTab");
  if (pb) pb.onclick = () => goTab(TABS[TABS.findIndex(t => t.k === S.tab) - 1].k);

  // Fields that aren't .F-bound still have to survive a tab switch.
  const nm = document.getElementById("insName");
  if (nm) nm.oninput = () => { S.insName = nm.value; saveQuoteState(); };
  const ef = document.getElementById("eff");
  if (ef) ef.onchange = () => { S.eff = ef.value; saveQuoteState(); };
  const uw = document.getElementById("underwriter");
  if (uw) uw.oninput = () => { S.underwriter = uw.value; saveQuoteState(); };
  const uwm = document.getElementById("underwriterManager");
  if (uwm) uwm.oninput = () => { S.underwriterManager = uwm.value; saveQuoteState(); };

  if (S.tab === "premium" && !S.res) {
    document.getElementById("premiumPane").innerHTML = `
      <div class="vx-card vx-anim"><div class="vx-empty"><i class="fa-solid fa-calculator"></i>
        Nothing calculated yet — press <b>Calculate Premium</b> to rate this risk and see every factor that was applied.</div></div>`;
  }
  /* A result goes stale the moment any answer changes. Landing on Premium (or
     Rating Factors) with a stale result used to show the PREVIOUS
     calculation — so ticking a coverage and switching tabs looked like the
     new coverage simply wasn't rated. Re-rate instead of showing a figure
     that no longer matches the inputs. */
  if (S.dirty && (S.tab === "premium" || S.tab === "factors")) {
    S.dirty = false;
    if (S.res) calc();
  }
  saveQuoteState();
  if (S.res) paint();
}

const ACCT_FACTOR_KEYS = new Set(["yearsInBusiness","carrierSafetyRating","fmcsaAlerts",
  "oosVehiclesBand","oosDriversBand","lossFreqBand","iccFiling","policyType","renewalEligible",
  "driverCriteria1Year","broadenedPollution","defenseAddback"]);
const EXPMOD_KEYS = new Set(["priorClaims","priorIncurredLosses","experienceMonths","state","liabLimit","garageZip"]);

function bind() {
  /* Any answer changing invalidates the last calculation. Registered once on
     the body container (which survives re-renders) rather than on each
     control, so no handler can be added later and forget to do it. */
  const bodyEl = document.getElementById("vxBody");
  if (bodyEl && !bodyEl.__dirtyHooked) {
    bodyEl.__dirtyHooked = true;
    bodyEl.addEventListener("change", () => { S.dirty = true; }, true);
    bodyEl.addEventListener("input", () => { S.dirty = true; }, true);
  }
  document.querySelectorAll(".F").forEach(e => e.onchange = () => {
    S.v[e.dataset.k] = e.type === "checkbox" ? e.checked : (e.type === "number" ? +e.value : e.value);
    if (e.dataset.k === "state") counties();
    // The renewal-discount question only applies once Policy Type is Renewal
    if (e.dataset.k === "policyType") {
      const w = document.getElementById("renewalEligWrap");
      if (w) w.style.display = e.value === "Renewal" ? "" : "none";
      if (e.value !== "Renewal") S.v.renewalEligible = "no";
    }
    // Re-render so the excluded-commodity warning banner shows/hides
    if (e.dataset.k === "cargoCommodity") render();
    if (ACCT_FACTOR_KEYS.has(e.dataset.k)) renderAcctBreakdown();
    if (EXPMOD_KEYS.has(e.dataset.k)) renderExpModPreview();
    vxAutoSave();
  });
  // primary coverage toggle — reveals / hides its child coverages
  document.querySelectorAll(".PCOV").forEach(e => e.onchange = () => {
    const pid = +e.dataset.p;
    S.v.cov[pid].on = e.checked;
    if (!e.checked) S.v.cov[pid].kids = [];
    syncCob(); vxAutoSave();
    // Full re-render — sections gated on coverage selection (Garagekeepers'
    // location schedule, Cargo's limit/commodity) only appear this way.
    // Toggling classes/display in place used to leave them stuck hidden
    // until something else happened to trigger a render.
    render();
  });
  // child coverage toggle
  document.querySelectorAll(".KCOV").forEach(e => e.onchange = () => {
    const pid = +e.dataset.p;
    S.v.cov[pid].kids = [...document.querySelectorAll(`.KCOV[data-p="${pid}"]:checked`)].map(x => +x.dataset.k);
    syncCob(); vxAutoSave();
    // Re-render so each class's factor and premium share update with the
    // selection — the share is a weighting across the CHOSEN classes, so
    // ticking one changes every other row's number too.
    if (S.tab === "cov") render();
  });
  syncCob();
  // vehicle schedule rows
  document.querySelectorAll(".V").forEach(e => e.onchange = () => {
    const r = S.v.vehicles[+e.dataset.i];
    r[e.dataset.f] = e.type === "checkbox" ? e.checked
      : (e.type === "number" ? +e.value : e.value);
    // Stated Value is DERIVED from Model Year in the real system (see
    // truckStatedValueFor / D.truckStatedValueByAge) — re-derive it whenever
    // the year changes, unless the underwriter has already typed their own
    // value, in which case that override sticks even across a year edit.
    if (e.dataset.f === "year" && !r._valueOverridden) {
      r.value = VX.truckStatedValueFor(r.year, "powerUnit");
      render();
    }
    if (e.dataset.f === "value") r._valueOverridden = true;
    // units changes the fleet count; VIN and class feed the schedule validation
    if (e.dataset.f === "units" || e.dataset.f === "vin" || e.dataset.f === "primaryClass") render();
    if (e.dataset.f === "garageZip") renderExpModPreview();
    vxAutoSave();
  });
  // trailer schedule rows — a trailer is its own titled unit
  document.querySelectorAll(".T").forEach(e => e.onchange = () => {
    const t = S.v.trailers[+e.dataset.i];
    t[e.dataset.f] = e.type === "number" ? +e.value : e.value;
    if (e.dataset.f === "vin") t.vin = String(t.vin || "").toUpperCase();
    // Same real derivation as the power unit above, keyed off the trailer's
    // own type -> valueBucket (Dry Van / Reefer / Flatbed carry different
    // real depreciation curves).
    if ((e.dataset.f === "year" || e.dataset.f === "type") && !t._valueOverridden) {
      const bucket = (VX.trailerTypes.find(x => x.type === t.type) || {}).valueBucket;
      if (bucket) t.value = VX.truckStatedValueFor(t.year, bucket);
    }
    if (e.dataset.f === "value") t._valueOverridden = true;
    syncTrailers();
    render();
    vxAutoSave();
  });
  // driver schedule rows
  document.querySelectorAll(".D").forEach(e => e.onchange = () => {
    const d = S.v.drivers[+e.dataset.i];
    d[e.dataset.f] = e.type === "number" ? +e.value : e.value;
    if (e.dataset.f === "violations") render();
    // Driver Licence States is one of the eight account-factor drivers
    if (e.dataset.f === "licState") renderAcctBreakdown();
    vxAutoSave();
  });
  // Garagekeepers location schedule
  document.querySelectorAll(".K").forEach(e => e.onchange = () => {
    const row = S.v.gkl[+e.dataset.i];
    row[e.dataset.f] = e.dataset.f === "limit" ? +e.value : e.value;
    // changing state can invalidate the selected limit (limits vary by state)
    if (e.dataset.f === "state") render();
    vxAutoSave();
  });
  // Insured locations schedule (GL / GL Package / Property / MPL)
  document.querySelectorAll(".LOC").forEach(e => e.onchange = () => {
    S.v.locations[+e.dataset.i][e.dataset.f] = e.value;
    vxAutoSave();
  });
  // GL class codes schedule
  document.querySelectorAll(".GCC").forEach(e => e.onchange = () => {
    const row = S.v.glClassCodes[+e.dataset.i];
    row[e.dataset.f] = e.dataset.f === "exposureAmount" ? +e.value : e.value;
    syncGlFromSchedule();
    render();
  });
  // Commodities Hauled schedule (Cargo)
  document.querySelectorAll(".CGC").forEach(e => e.onchange = () => {
    const code = e.dataset.code;
    if (e.checked) {
      if (!S.v.cargoCommodities.some(c => c.code === code)) S.v.cargoCommodities.push({ code, maxValue: 15000, avgValue: 10000, loadPct: 0 });
    } else {
      S.v.cargoCommodities = S.v.cargoCommodities.filter(c => c.code !== code);
    }
    render();
  });
  document.querySelectorAll(".CGCF").forEach(e => e.onchange = () => {
    const row = S.v.cargoCommodities.find(c => c.code === e.dataset.code);
    if (row) row[e.dataset.f] = +e.value;
    vxAutoSave();
  });
  // WC exposures schedule
  document.querySelectorAll(".WCX").forEach(e => e.onchange = () => {
    const row = S.v.wcExposures[+e.dataset.i];
    row[e.dataset.f] = e.dataset.f === "payroll" ? +e.value : e.value;
    render();
  });
  const cb = document.getElementById("calcBtn");
  if (cb) cb.onclick = calc;
}

/* Translate the coverage tree selection into the flat keys the engine expects,
   and keep a structured copy for the premium breakdown rollup. */
function syncCob() {
  if (!S.v.cov) return;
  const sel = [];
  Object.entries(S.v.cov).forEach(([pid, st]) => {
    if (!st.on) return;
    const p = VX.cob.find(c => c.id === +pid);
    if (!p) return;
    sel.push({ id: p.id, name: p.name, kids: st.kids.map(k => VX.cob.find(c => c.id === k)).filter(Boolean) });
  });
  S.v.selectedCoverages = sel;
  // Trucking engine keys off these three primary names
  S.v.cob = sel.map(s => s.name === "Motor Truck Cargo" ? "Cargo" : s.name);
}

function counties() {
  const st = S.v.state || "TX";
  const list = VX.counties.filter(c => c.state === st);
  const sel = document.getElementById("county");
  if (!sel) { note(); return; }   // county select only exists on the Insured tab
  sel.innerHTML = list.length
    ? list.map(c => `<option value="${c.name}" data-tax="${c.taxRate}">${c.name}${c.taxRate ? " (+" + c.taxRate.toFixed(2) + "%)" : ""}</option>`).join("")
    : `<option value="">No counties configured</option>`;
  if (S.county && list.some(c => c.name === S.county)) sel.value = S.county;
  sel.onchange = () => { S.county = sel.value; saveQuoteState(); note(); };
  note();
}
function note() {
  // Read from VX.taxes, not VX.states — VX.taxes is what ENGINE.rate() actually
  // charges (engine.js), so this preview can never disagree with the real total.
  const tx = VX.taxes.find(t => t.state === (S.v.state || "TX"));
  const stTax = tx ? tx.surplusTax : 2;
  const o = document.getElementById("county").selectedOptions[0];
  const ct = o ? +o.dataset.tax || 0 : 0;
  // The engine looks the rate up from the county NAME, so that is what the
  // quote carries; the percentage below is only for this preview line.
  S.v.county = (o && o.value) || null;
  const tn = document.getElementById("taxNote");
  if (!tn) return;
  tn.innerHTML = `<div class="vx-ai" style="padding:9px 12px;font-size:12.3px">
    <b>Tax for this location:</b> ${stTax.toFixed(2)}% state
    ${ct ? `+ <b style="color:var(--warn)">${ct.toFixed(2)}% county</b>` : "+ 0.00% county (this county charges no local tax)"}
    = <b>${(stTax + ct).toFixed(2)}% total</b></div>`;
}

async function calc() {
  /* The Calculate button only exists on the tabs that show it — the Rating
     Factors tab rates on demand to resolve its factor chain, and used to
     throw here before the calculation ever ran. */
  const b = document.getElementById("calcBtn");
  if (b) { b.disabled = true; b.innerHTML = '<span class="vx-spin" style="border-top-color:var(--color-on-brand);vertical-align:-2px"></span> Calculating...'; }
  await new Promise(r => setTimeout(r, 520));
  try {
    ensureQuoteDefaults();
    /* County tax used to be layered on here, after the engine returned. That
       made it a property of this screen rather than of the quote, so the
       Quote JSON page — running the identical ENGINE.rate() call — produced a
       total with no local tax in it. The engine charges it now; this just
       tells it which county, the same way it is told which state. */
    S.v.county = S.county || null;
    S.res = ENGINE.rate(S.lob, S.v);
    S.elig = S.res.eligibility;
    vxToast("Premium calculated", LOBS.find(l => l.k === S.lob).n + " — " + vxMoney(S.res.finalPremium), "ok");
  } catch (e) { vxToast("Rating error", e.message, "err"); }
  if (b) { b.disabled = false; b.innerHTML = '<i class="fa-solid fa-bolt me-1"></i>Recalculate Premium'; }
  S.dirty = false;   // result now matches the inputs again
  saveQuoteState();
  paint();
  // Rating Factors reads its chain off the result, so refresh it once rated.
  if (S.tab === "factors") renderFactorChain();
}

/* Child coverages included under a primary group, with their share of the
   group premium — mirrors how premium rolls up per parent_cob_id. */
/* Credits the quote did NOT receive, and why.

   A credit that was never applied is invisible on a premium breakdown, which
   makes two very different situations look identical: "we checked and this
   account does not qualify" and "nobody asked the question". The second is
   worth an underwriter's time — it is a credit the insured may well be
   entitled to, sitting behind one unanswered field on the submission. So the
   undetermined ones are listed first and counted in the summary line. */
function creditsNotAppliedRow(r) {
  const skipped = r.creditsSkipped || [];
  if (!skipped.length) return "";
  const undet = skipped.filter(s => s.undetermined);
  const rest = skipped.filter(s => !s.undetermined);
  const rows = [...undet, ...rest].map(s => `<tr>
      <td style="padding-inline-start:30px;color:var(--text-mute)">
        <i class="fa-solid ${s.undetermined ? "fa-circle-question" : "fa-circle-minus"}"
           style="font-size:9px;margin-inline-end:6px;color:var(--${s.undetermined ? "warn" : "text-mute"})" aria-hidden="true"></i>${s.name}</td>
      <td style="text-align:right;color:var(--text-mute);font-size:11.5px">${s.reason}</td></tr>`).join("");
  return `<tr class="vx-exp" data-x="nocred" style="cursor:pointer"><td>
      <i class="fa-solid fa-chevron-right me-2" style="font-size:9px;transition:.2s" id="chevnocred" aria-hidden="true"></i>
      Credits &amp; debits not applied
      <span class="vx-b gray" style="margin-inline-start:6px">${skipped.length}</span>
      ${undet.length ? `<span class="vx-b amber" style="margin-inline-start:4px">${undet.length} undetermined</span>` : ""}</td>
      <td style="text-align:right;color:var(--text-mute)">—</td></tr>
    <tr class="vx-exp-body" id="expnocred"><td colspan="2" style="padding:0">
      <table class="vx-t" style="margin:0">${rows}</table></td></tr>`;
}

function childRows(g, r) {
  const sel = (S.v.selectedCoverages || []).find(s =>
    s.name === g.name || (s.name === "Motor Truck Cargo" && g.name === "Cargo") ||
    g.name.startsWith(s.name) || s.name.startsWith(g.name));
  if (!sel || !sel.kids.length) return "";
  const w = sel.kids.reduce((a, k) => a + (k.factor || 0.1), 0) || 1;
  return `<tr><td colspan="2" style="padding:6px 12px 3px 32px;font-size:10.5px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;color:var(--text-mute)">Child coverages included</td></tr>`
    + sel.kids.map(k => `<tr>
      <td style="padding-left:42px;font-size:12.1px">↳ ${k.name}
        ${k.mandatory ? '<span class="vx-b green" style="margin-left:5px">req</span>' : ""}</td>
      <td style="text-align:right;font-size:12.1px">${vxMoney(g.subtotal * (k.factor || 0.1) / w)}</td></tr>`).join("")
    + `<tr><td colspan="2" style="border-bottom:1px solid var(--border)"></td></tr>`;
}

const fmtF = (v, k) => k === "money" ? vxMoney(v) : k === "x" ? Number(v).toFixed(3) + "×" : vxNum(v);

/* Which coverages just now got rated by whatever's saved and Active in
   Formula Builder, versus the platform's built-in default calculation.
   Directly answers "did my Formula Builder edit actually change anything" —
   until this existed, that question had no visible answer anywhere. */
function ratedByBadge(rb) {
  if (!rb) return "";
  if (rb.mode === "formula") return `<span class="vx-b blue ms-2" style="font-size:9px" title="Attached ${rb.version || ""} · updated ${rb.updated}"><i class="fa-solid fa-wand-magic-sparkles me-1"></i>Formula Builder — ${rb.name}</span>`;
  if (rb.error) return `<span class="vx-b amber ms-2" style="font-size:9px" title="Its saved formula failed to evaluate: ${rb.error} — fell back automatically so the quote still completed"><i class="fa-solid fa-triangle-exclamation me-1"></i>Default engine (formula error)</span>`;
  return `<span class="vx-b gray ms-2" style="font-size:9px">Default engine</span>`;
}

/* ==========================================================================
   Calculation performed — the arithmetic, not just the factors.

   The Premium tab could already say which factors applied and what each was
   worth, but not what the engine actually computed with them. This shows
   every formula evaluation in the order it ran, with the real values
   substituted, so a premium can be checked by hand rather than trusted.

   Steps come from r.calculationSteps, recorded by the engine AT evaluation
   time (see applySavedFormula in engine.js) — not rebuilt here, because a
   display-side rebuild can drift from the code that actually rated.
   ========================================================================== */
function calculationWalkthrough(r) {
  const steps = r.calculationSteps || [];
  if (!steps.length) return "";
  const num = v => typeof v === "number"
    ? (Math.abs(v) >= 1000 ? v.toLocaleString("en-US", { maximumFractionDigits: 2 })
                           : +v.toFixed(4) + "")
    : v;

  const stepCard = (s, i) => {
    const head = `${s.context ? `<span class="vx-b gray" style="font-size:9px">${s.context}</span> ` : ""}${s.coverage.replace(/^__|__$/g, "").replace(/_/g, " ")}`;
    const mode = s.failed
      ? `<span class="vx-b amber" style="font-size:9px" title="${s.error}"><i class="fa-solid fa-triangle-exclamation me-1"></i>saved formula failed — engine default used</span>`
      : s.mode === "formula"
        ? `<span class="vx-b blue" style="font-size:9px"><i class="fa-solid fa-wand-magic-sparkles me-1"></i>${s.formulaName}</span>`
        : `<span class="vx-b gray" style="font-size:9px">engine default chain</span>`;
    return `<div style="border:1px solid var(--border);border-radius:10px;padding:11px 14px;margin-bottom:9px">
      <div class="d-flex align-items-center gap-2 flex-wrap" style="font-size:12.6px;font-weight:650">
        <span style="color:var(--text-mute);font-variant-numeric:tabular-nums">${i + 1}.</span>${head}${mode}
        <span class="ms-auto" style="font-variant-numeric:tabular-nums;font-weight:800">${num(s.result)}</span>
      </div>
      ${s.expression ? `<div style="font-size:11.4px;color:var(--text-dim);margin-top:6px;word-break:break-word">
        <div style="font-family:var(--mono, monospace)">${s.expression}</div>
        ${s.substituted ? `<div style="font-family:var(--mono, monospace);color:var(--text);margin-top:3px">${s.substituted} <b>= ${num(s.result)}</b></div>` : ""}
      </div>` : `<div style="font-size:11.4px;color:var(--text-mute);margin-top:5px">
        Rated by the engine's built-in chain for this coverage — no saved formula is Active on it.</div>`}
      ${s.failed ? `<div style="font-size:11.2px;color:var(--warn);margin-top:5px"><b>${s.error}</b> — the quote completed on the default chain instead.</div>` : ""}
      ${s.vars.length ? `<details style="margin-top:6px">
        <summary style="font-size:11.2px;color:var(--text-mute);cursor:pointer">${s.vars.length} values used</summary>
        <div class="vx-tw" style="max-height:220px;overflow:auto;margin-top:5px"><table class="vx-t" style="font-size:11.4px">
          <tbody>${s.vars.map(v => `<tr><td>${v.name}</td>
            <td style="text-align:right;font-variant-numeric:tabular-nums">${num(v.value)}</td></tr>`).join("")}</tbody>
        </table></div></details>` : ""}
    </div>`;
  };

  const failed = (r.formulaFailures || []).length;
  return `<div class="vx-card vx-anim">
    <div class="vx-card-head">
      <div><h2>Calculation performed</h2>
        <div class="sub">Every formula the engine evaluated for this quote, in order, with the real values substituted.</div></div>
      <div class="d-flex gap-2 align-items-center">
        <span class="vx-b ${r.usedSavedFormula ? "blue" : "gray"}">${r.usedSavedFormula ? "saved formulas in use" : "all engine defaults"}</span>
        ${failed ? `<span class="vx-b amber" title="${(r.formulaFailures || []).map(f => f.coverage + ": " + f.error).join("; ")}">${failed} formula failed</span>` : ""}
      </div>
    </div>
    ${failed ? `<div class="mb-3" style="border:1px solid var(--border);border-left:3px solid var(--warn);background:rgba(198,137,15,.08);border-radius:0 10px 10px 0;padding:10px 13px;font-size:12.2px;line-height:1.6">
      <i class="fa-solid fa-triangle-exclamation me-1" style="color:var(--warn)"></i>
      <b>${failed} Active formula ${failed === 1 ? "did" : "each"} not evaluate and the engine rated on its default chain instead.</b>
      The premium is still correct for the default chain, but it is not what the saved formula would have produced — fix the formula or deactivate it.
    </div>` : ""}
    ${steps.map(stepCard).join("")}
    <div style="font-size:11.2px;color:var(--text-mute);margin-top:4px">
      Recorded by the engine as each formula ran, so this is the arithmetic that actually produced the premium above — not a re-derivation.
    </div>
  </div>`;
}

/* A factor is almost never a constant — it's a row selected out of a rate
   table by one of the insured's own answers. These renderers show that whole
   chain (default → what was entered → which row matched → what applied →
   what it did to premium) instead of a bare number that looks fixed. */
function impChip(f) {
  if (!f.measurable) return "";
  if (f.atDefault) return `<span class="fimp flat" title="Sitting on this table's default row — it moved nothing">at default</span>`;
  const up = f.impact > 0;
  return `<span class="fimp ${up ? "up" : "down"}">${up ? "+" : "−"}${vxMoney(Math.abs(f.impact))}</span>`;
}

function factorDetail(f) {
  const steps = [
    { k: "Default", v: f.base == null ? "<span style='color:var(--text-mute)'>no neutral row</span>" : fmtF(f.base, f.kind) },
    ...(f.driver ? [{ k: "Insured input", v: `<span style="font-weight:500;color:var(--text-dim);font-size:10.5px">${f.driver}</span><br>${f.input || "—"}` }] : []),
    ...(f.matched ? [{ k: "Matched rule", v: f.matched }] : []),
    { k: "Applied factor", v: fmtF(f.value, f.kind), cls: "applied" },
    ...(f.measurable ? [{ k: "Premium impact", cls: f.atDefault ? "" : (f.impact > 0 ? "up" : "down"),
      v: f.atDefault ? "<span style='color:var(--text-mute)'>no change</span>"
        : `${f.impact > 0 ? "+" : "−"}${vxMoney(Math.abs(f.impact))}<div style="font-size:10px;font-weight:500;opacity:.8">${f.pct > 0 ? "+" : ""}${f.pct.toFixed(1)}% vs default</div>` }] : []),
  ];
  const optRows = (f.options || []).length ? `
    <div style="font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text-mute);margin:2px 0 4px">
      What other answers would apply</div>
    <div style="max-height:168px;overflow-y:auto">${f.options.map(o => `
      <div class="fopt ${o.active ? "on" : ""}">
        <span>${o.active ? '<i class="fa-solid fa-check me-1" style="font-size:9px"></i>' : ""}${o.label}</span>
        <span style="font-variant-numeric:tabular-nums">${typeof o.value === "number" ? (Math.abs(o.value) < 10 ? o.value.toFixed(3).replace(/0+$/, "").replace(/\.$/, "") : vxNum(o.value)) : o.value}</span>
      </div>`).join("")}</div>` : "";
  return `<div class="fchain">${steps.map(s => `<div class="fstep ${s.cls || ""}"><span class="k">${s.k}</span><div class="v">${s.v}</div></div>`).join("")}</div>
    ${optRows}
    ${f.note ? `<div style="font-size:11.3px;color:var(--text-dim);margin-top:7px;line-height:1.5"><i class="fa-solid fa-circle-info me-1" style="color:var(--accent)"></i>${f.note}</div>` : ""}`;
}

function factorRow(f, gi, fi) {
  const id = `f${gi}_${fi}`;
  const hasDetail = !!(f.driver || (f.options || []).length || f.note || f.table);
  const sub = f.driver
    ? `${f.driver}: <b style="color:var(--text-dim)">${f.input || "—"}</b>${f.matched ? ` <i class="fa-solid fa-arrow-right-long" style="font-size:8px;opacity:.5"></i> ${f.matched}` : ""}`
    : (f.matched || "");
  const chip = impChip(f);
  return `<tr class="${hasDetail ? "ftrow" : ""}" ${hasDetail ? `data-ft="${id}"` : ""}>
      <td style="padding-left:30px;font-size:12.1px">
        ${hasDetail ? `<i class="fa-solid fa-chevron-right me-2" style="font-size:8px;color:var(--text-mute);transition:.2s" id="chf${id}"></i>` : `<span style="display:inline-block;width:16px"></span>`}
        <span>${f.label}</span>
        ${f.varies ? '<span class="vx-b amber ms-1" style="font-size:9px">varies by unit</span>' : ""}
        ${sub ? `<div style="padding-left:16px;font-size:10.6px;color:var(--text-mute);margin-top:2px;line-height:1.4">${sub}</div>` : ""}
      </td>
      <td style="text-align:right;font-size:12.1px;white-space:nowrap;vertical-align:top">
        <b>${fmtF(f.value, f.kind)}</b>${chip ? `<div style="margin-top:3px">${chip}</div>` : ""}
      </td></tr>
    ${hasDetail ? `<tr class="vx-exp-body" id="expf${id}"><td colspan="2" style="padding:10px 14px 13px 46px;background:var(--surface-2)">${factorDetail(f)}</td></tr>` : ""}`;
}

/* Audit view: every factor across every coverage, ranked by what it actually
   did to the premium. Answers "why is my premium this number?" in one screen. */
function tracePanel(r) {
  const all = ENGINE.trace(r).filter(t => t.measurable && !t.atDefault);
  if (!all.length) return "";
  const moved = all.slice().sort((a, b) => Math.abs(b.impact) - Math.abs(a.impact));
  const max = Math.abs(moved[0].impact) || 1;
  const ups = moved.filter(t => t.impact > 0).reduce((a, t) => a + t.impact, 0);
  const downs = moved.filter(t => t.impact < 0).reduce((a, t) => a + t.impact, 0);
  return `
    <div class="vx-tw"><table class="vx-t">
        <thead><tr><th>Factor</th><th>Driven by</th><th style="text-align:right">Default → Applied</th><th style="text-align:right">Impact</th></tr></thead>
        <tbody>${moved.map(t => `<tr>
          <td><b style="font-size:12px">${t.label}</b>
            <div style="font-size:10.4px;color:var(--text-mute)">${t.group}</div></td>
          <td style="font-size:11.4px">${t.driver ? `${t.driver}<div style="font-size:10.6px;color:var(--text-mute)">${t.input || ""}</div>` : '<span style="color:var(--text-mute)">program constant</span>'}</td>
          <td style="text-align:right;font-size:11.6px;white-space:nowrap;font-variant-numeric:tabular-nums">
            <span style="color:var(--text-mute)">${fmtF(t.neutral, t.kind)}</span>
            <i class="fa-solid fa-arrow-right-long mx-1" style="font-size:8px;opacity:.5"></i>
            <b>${fmtF(t.value, t.kind)}</b></td>
          <td style="text-align:right;white-space:nowrap">
            <div class="d-flex align-items-center justify-content-end gap-2">
              <div class="fbar"><i style="width:${Math.round(Math.abs(t.impact) / max * 100)}%;background:${t.impact > 0 ? "var(--bad)" : "var(--good)"}"></i></div>
              <span style="font-size:11.5px;font-weight:700;color:${t.impact > 0 ? "var(--bad)" : "var(--good)"}">${t.impact > 0 ? "+" : "−"}${vxMoney(Math.abs(t.impact))}</span>
            </div></td></tr>`).join("")}</tbody>
      </table></div>`;
}

/* The movers table is reference material, not something you read on the way
   past — it is long, it repeats what the factor chain already says, and it
   pushed the premium summary down the page. The headline numbers stay inline
   as a one-line strip; the table itself opens on demand. */
function moversStrip(r) {
  const all = ENGINE.trace(r).filter(t => t.measurable && !t.atDefault);
  if (!all.length) return "";
  const ups = all.filter(t => t.impact > 0).reduce((a, t) => a + t.impact, 0);
  const downs = all.filter(t => t.impact < 0).reduce((a, t) => a + t.impact, 0);
  return `
    <div class="vx-card vx-anim vx-anim-d2" style="padding:12px 16px">
      <div class="d-flex align-items-center gap-2 flex-wrap" style="font-size:11.8px">
        <b style="font-size:13px">What moved this premium</b>
        <span class="fimp up">+${vxMoney(ups)} added</span>
        <span class="fimp down">−${vxMoney(Math.abs(downs))} saved</span>
        <span style="color:var(--text-mute)">${all.length} factors off default</span>
        <button class="btn btn-outline-secondary btn-sm ms-auto" onclick="showMovers()">
          <i class="fa-solid fa-list-ol me-1"></i>See all ${all.length}</button>
      </div>
    </div>`;
}

function showMovers() {
  const r = S.res;
  if (!r) return;
  const all = ENGINE.trace(r).filter(t => t.measurable && !t.atDefault);
  const ups = all.filter(t => t.impact > 0).reduce((a, t) => a + t.impact, 0);
  const downs = all.filter(t => t.impact < 0).reduce((a, t) => a + t.impact, 0);
  vxModal("What moved this premium", `
    <div class="sub" style="margin-top:-6px">Every factor that landed off its default row, ranked by dollar
      impact. Change the matching answer on the earlier tabs and these move.</div>
    <div class="d-flex gap-2 mb-3" style="font-size:11.8px">
      <span class="fimp up">+${vxMoney(ups)} added</span>
      <span class="fimp down">−${vxMoney(Math.abs(downs))} saved</span>
      <span style="color:var(--text-mute);align-self:center">${all.length} factors off default</span>
    </div>
    ${tracePanel(r)}`,
    [{ t: "Close", c: "secondary" }], "modal-lg");
}

function eligBanner() {
  const el = S.elig;
  if (!el || (!el.declines.length && !el.refers.length)) return "";
  const line = (e, icon) => `<div style="margin-top:4px"><i class="fa-solid ${icon} me-1"></i><b>${e.rule.name}</b> — ${e.reason}</div>`;
  return `
    ${el.declines.length ? `<div class="vx-card vx-anim mb-2" style="border:1px solid var(--bad);background:rgba(210,69,69,.08);padding:12px 14px;font-size:12.3px;line-height:1.5">
      <span class="vx-b red"><i class="fa-solid fa-ban me-1"></i>Ineligible — cannot quote</span>
      ${el.declines.map(e => line(e, "fa-circle-xmark")).join("")}
    </div>` : ""}
    ${el.refers.length ? `<div class="vx-card vx-anim mb-2" style="border:1px solid var(--warn);background:rgba(198,137,15,.08);padding:12px 14px;font-size:12.3px;line-height:1.5">
      <span class="vx-b amber"><i class="fa-solid fa-triangle-exclamation me-1"></i>Refers to underwriter</span>
      ${el.refers.map(e => line(e, "fa-flag")).join("")}
    </div>` : ""}`;
}

/* ==========================================================================
   Premium Calculation tab — the full, transparent factor-by-factor build-up.
   Every column comes from the trace records engine.js already emits, so this
   is the real calculation, not a restatement of it:
     Factor        f.label
     Input value   f.input        (what the insured actually answered)
     Matched rule  f.matched      (the table row that answer selected)
     Applied       f.value        (the factor actually used)
     Default       f.base         (the neutral/default value)
     Adjustment    value vs base  (what this factor did to the premium)
   Where applied differs from default, applied is emphasised and the default
   shown greyed alongside — never the default on its own.
   ========================================================================== */
/* ==========================================================================
   Trucking Premium Estimate summary — Premium Breakdown / Loss Ratio & Rates /
   Vehicle Type / Driver Info / a tabbed Account-Auto Liability-Cargo-
   Commodity factor view. Every figure here is read off engine.js's already-
   computed trucking() result (r.groups / r.vehicleTypeRollup /
   r.driverStateDistribution / r.cargoBreakdown / r.accountFactorLines) — no
   new rating math, just a compact re-presentation alongside the full
   transparent factor table below (which stays; this doesn't replace it). */
/* Commercial Trucking's real formula (and the rich Premium Breakdown / Loss
   Ratio / Vehicle Type / Driver Info summary built specifically on top of
   its output) was removed at the user's explicit request, alongside its
   factor registry and saved formulas — see data.js/engine.js. Those rollups
   (vehicleTypeRollup, driverStateDistribution, lossRatio3yr/5yr,
   cargoBreakdown) all come from the real formula, which was later restored
   and is what this summary renders. Two candidate models were briefly shown
   beside it during a comparison exercise; both have been removed, so this is
   the filed formula's own breakdown and nothing else. */
function truckPremiumSummary(r) {
  if (r.lob !== "Commercial Trucking") return "";
  const money = v => vxMoney(v);
  const al = r.groups.find(g => g.name === "Auto Liability");
  const cargo = r.groups.find(g => g.name === "Cargo");
  const brokerFee = (r.feeLines || []).find(f => f.name === "Broker Fee");
  const advancePremium = r.groups.reduce((s, g) => s + g.subtotal, 0);
  const stampPct = (r.taxDetail && r.taxDetail.stampingFee) || 0;
  const stampAmt = Math.round((advancePremium + r.tax) * stampPct / 100);
  const costOfPolicy = r.finalPremium + stampAmt;
  const pctOrNA = ratio => (r.priorClaims || r.priorIncurred) ? (ratio * 100).toFixed(1) + "%" : "N/A";
  const vt = r.vehicleTypeRollup || [];
  const ds = r.driverStateDistribution || {};

  return `
  <div class="row g-3 mb-3">
    <div class="col-lg-6">
      <div class="vx-card vx-anim">
        <h2 style="font-size:14px;margin-bottom:8px">Premium Breakdown</h2>
        <table class="vx-t pt" style="margin:0">
          <tbody>
            ${r.groups.map(g => `<tr><td>Total ${g.name} Premium</td><td class="pt-num">${money(g.subtotal)}</td></tr>`).join("")}
            <tr class="pt-total"><td><b>Estimated Advance Premium</b></td><td class="pt-num"><b>${money(advancePremium)}</b></td></tr>
            <tr><td class="pt-mute">Broker Service Fee</td><td class="pt-num pt-mute">${money(brokerFee ? brokerFee.amt : 0)}</td></tr>
            <tr><td class="pt-mute">Surplus Lines Tax</td><td class="pt-num pt-mute">${money(r.tax)}</td></tr>
            <tr><td class="pt-mute">Stamping Fee${stampPct ? ` (${stampPct}%)` : ""}</td><td class="pt-num pt-mute">${money(stampAmt)}</td></tr>
            <tr class="pt-final"><td><b>Cost Of Policy</b></td><td class="pt-num"><b style="font-size:15px">${money(costOfPolicy)}</b></td></tr>
          </tbody>
        </table>
        ${stampPct ? `<div style="font-size:10.3px;color:var(--text-mute);margin-top:8px">Stamping Fee is the real per-state filed rate (State Taxes) added here for the estimate — the engine's own Final Premium (right rail) does not yet fold it in.</div>` : ""}
      </div>
    </div>
    <div class="col-lg-6">
      <div class="vx-card vx-anim">
        <h2 style="font-size:14px;margin-bottom:8px">Loss Ratio &amp; Rates</h2>
        <table class="vx-t pt" style="margin:0">
          <thead><tr><th></th><th class="pt-num">AL</th><th class="pt-num">Cargo</th></tr></thead>
          <tbody>
            <tr><td>3-Year Loss Ratio</td><td class="pt-num">${pctOrNA(r.lossRatio3yr)}</td><td class="pt-num">N/A</td></tr>
            <tr><td>5-Year Loss Ratio</td><td class="pt-num">${pctOrNA(r.lossRatio5yr)}</td><td class="pt-num">N/A</td></tr>
            <tr><td>Rate %</td><td class="pt-num">N/A</td><td class="pt-num">${cargo && r.units ? money(Math.round(cargo.subtotal / r.units)) + " PPU" : "N/A"}</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-3">
    <div class="col-lg-6">
      <div class="vx-card vx-anim">
        <h2 style="font-size:14px;margin-bottom:8px"><i class="fa-solid fa-truck me-1"></i>Vehicle Type</h2>
        <table class="vx-t pt" style="margin:0">
          <thead><tr><th>Vehicle Type</th><th class="pt-num">Units</th><th class="pt-num">PPU</th></tr></thead>
          <tbody>${vt.map(v => `<tr><td>${v.type}</td><td class="pt-num">${v.units}</td><td class="pt-num">${v.units && v.premium ? money(v.ppu) : "N/A"}</td></tr>`).join("")}
            <tr class="pt-total"><td><b>Total Units</b></td><td class="pt-num"><b>${r.units}</b></td><td></td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="vx-card vx-anim">
        <h2 style="font-size:14px;margin-bottom:8px"><i class="fa-solid fa-users me-1"></i>Driver Info</h2>
        <table class="vx-t pt" style="margin:0">
          <tbody>
            <tr><td>Risk State (${r.state})</td><td class="pt-num">${ds.riskState || 0}</td></tr>
            <tr><td>New York</td><td class="pt-num">${ds.ny || 0}</td></tr>
            <tr><td>Florida</td><td class="pt-num">${ds.fl || 0}</td></tr>
            <tr><td>Other States</td><td class="pt-num">${ds.other || 0}</td></tr>
            <tr><td>Excluded Drivers</td><td class="pt-num">${ds.excluded || 0}</td></tr>
            <tr class="pt-total"><td>Average Driver Factor</td><td class="pt-num">${r.driverFactorAvg != null ? r.driverFactorAvg.toFixed(3) : "—"}</td></tr>
            <tr class="pt-total"><td>Applied Driver Factor</td><td class="pt-num">${(+r.driverFactorApplied || 1).toFixed(3)}</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>


  ${truckFactorTabs(r)}`;
}

/* Tabs come from the rated result, not a fixed list: "Account", then one tab
   per coverage class actually on this quote. Each coverage tab shows a row per
   scheduled unit where that coverage rates per unit, because a fleet quote is
   priced unit by unit and a single blended row hides which truck is expensive. */
function factorTabNames(r) {
  const names = [];
  if (r.accountFactorLines && r.accountFactorLines.length) names.push("Account");
  (r.groups || []).forEach(g => { if (!names.includes(g.name)) names.push(g.name); });
  return names.length ? names : ["Account"];
}

function truckFactorTabs(r) {
  const TABS_F = factorTabNames(r);
  if (!S.truckFactorTab || !TABS_F.includes(S.truckFactorTab)) S.truckFactorTab = TABS_F[0];
  const cur = S.truckFactorTab;
  const money = v => vxMoney(v);
  const f2 = v => (v == null || isNaN(+v)) ? "\u2014" : (+v).toFixed(2);
  const f3 = v => (v == null || isNaN(+v)) ? "\u2014" : (+v).toFixed(3);

  // One table per coverage \u2014 Liability and Physical Damage each compute a
  // separately-clamped Account-Level Factor now (see engine.js); shown as
  // two tables rather than one so it's visible they can genuinely differ.
  const acctTable = (title, lines, value) => `<div class="sub" style="margin-top:10px">${title}</div>
      <div class="vx-tw"><table class="vx-t pt" style="min-width:900px">
      <thead><tr>${lines.map(([n]) => `<th>${n}</th>`).join("")}<th>Account-Level Factor</th></tr></thead>
      <tbody><tr>${lines.map(([, v]) => `<td class="pt-num">${f2(v)}</td>`).join("")}<td class="pt-num"><b>${f3(value)}\u00d7</b></td></tr></tbody>
      </table></div>`;
  const acctPanel = () => {
    const liabLines = r.accountFactorLines || [];
    const pdLines = r.pdAccountFactorLines || [];
    if (!liabLines.length && !pdLines.length) return `<div class="vx-empty" style="padding:20px"><i class="fa-solid fa-sliders"></i>No account-level factor applies to this line of business.</div>`;
    return `<div class="sub">One policy-level credit/debit set per coverage, applied to every unit.</div>
      ${liabLines.length ? acctTable("Auto Liability \u2014 Account-Level Factor", liabLines, r.accountFactor) : ""}
      ${pdLines.length ? acctTable("Physical Damage \u2014 Account-Level Factor", pdLines, r.pdAccountFactor) : ""}`;
  };

  /* Per-unit liability table. */
  const liabPanel = () => {
    const pv = (r.perVehicle || []).filter(v => v.covLiab !== false);
    if (!pv.length) return groupPanel("Auto Liability");
    return `<div class="sub">${pv.length} unit${pv.length === 1 ? "" : "s"} \u2014 each rated on its own class, age and value, then summed.</div>
      <div class="vx-tw"><table class="vx-t pt" style="min-width:1040px">
      <thead><tr><th>#</th><th>Class</th><th>Model Yr</th><th class="pt-num">Value</th><th class="pt-num">Primary</th><th class="pt-num">Age</th>
        <th class="pt-num">Fleet</th><th class="pt-num">OCN</th><th class="pt-num">Secondary</th><th class="pt-num">Miles</th><th class="pt-num">Liability Premium</th></tr></thead>
      <tbody>${pv.map(v => `<tr><td>${v.n}</td><td>${v.primDesc}</td><td>${v.year}</td><td class="pt-num">${money(v.value)}</td>
        <td class="pt-num">${f2(v.primFactor)}</td><td class="pt-num">${f2(v.ageFactor)}</td><td class="pt-num">${f3(v.fleetFactor)}</td>
        <td class="pt-num">${f2(v.ocnFactor)}</td><td class="pt-num">${f2(v.secondaryFactor)}</td><td class="pt-num">${f2(v.milesFactor)}</td>
        <td class="pt-num">${money(v.liab)}</td></tr>`).join("")}</tbody>
      <tfoot><tr class="pt-total"><td colspan="10">Total</td>
        <td class="pt-num">${money(pv.reduce((a, v) => a + (+v.liab || 0), 0))}</td></tr></tfoot>
      </table></div>`;
  };

  /* Per-unit physical damage. Different drivers from liability — stated value
     and trailer attachment matter here, vehicle class much less. */
  const apdPanel = () => {
    const pv = (r.perVehicle || []).filter(v => v.covApd !== false && (+v.apd || 0) > 0);
    if (!pv.length) return groupPanel("Physical Damage");
    return `<div class="sub">${pv.length} unit${pv.length === 1 ? "" : "s"} \u2014 rated on stated value and trailer attachment.</div>
      <div class="vx-tw"><table class="vx-t pt" style="min-width:940px">
      <thead><tr><th>#</th><th>Class</th><th>Model Yr</th><th class="pt-num">Stated Value</th><th class="pt-num">TIV</th>
        <th class="pt-num">Trailer</th><th class="pt-num">Miles</th><th>Radius</th><th class="pt-num">Phys. Damage Premium</th></tr></thead>
      <tbody>${pv.map(v => `<tr><td>${v.n}</td><td>${v.primDesc}</td><td>${v.year}</td>
        <td class="pt-num">${money(v.value)}</td><td class="pt-num">${money(v.tiv)}</td>
        <td class="pt-num">${f3(v.trailerFactor)}</td><td class="pt-num">${f2(v.milesFactor)}</td>
        <td>${v.radiusLabel || "\u2014"}</td><td class="pt-num">${money(v.apd)}</td></tr>`).join("")}</tbody>
      <tfoot><tr class="pt-total"><td colspan="8">Total</td>
        <td class="pt-num">${money(pv.reduce((a, v) => a + (+v.apd || 0), 0))}</td></tr></tfoot>
      </table></div>`;
  };

  const cargoPanel = () => {
    const cb = r.cargoBreakdown;
    if (!cb) return groupPanel("Cargo");
    return `<div class="sub">Cargo rates off the single highest classification factor among the commodities carried.</div>
      <div class="vx-tw"><table class="vx-t pt" style="min-width:900px">
      <thead><tr><th>Commodity</th><th class="pt-num">Base Rate</th><th class="pt-num">Load Factor</th><th class="pt-num">Refer Basic Load</th>
        <th class="pt-num">Classification Factor</th><th class="pt-num">Hazardous Mod</th><th class="pt-num">Total Basic Charge</th></tr></thead>
      <tbody>${cb.rows.map(row => `<tr>
        <td>${row.commodity.label}${row.excluded ? ' <span class="vx-b red" style="font-size:9px">excluded</span>' : ""}</td>
        <td class="pt-num">${money(cb.baseRate)}</td><td class="pt-num">${cb.loadFactor}</td><td class="pt-num">0</td>
        <td class="pt-num">${row.clsFactor}</td><td class="pt-num">${row.hazFactor}</td><td class="pt-num">${money(row.totalBasicCharge)}</td>
      </tr>`).join("")}</tbody>
      <tfoot><tr class="pt-total"><td colspan="6">Loss Cost Factor</td><td class="pt-num">${cb.lossCostFactor}</td></tr></tfoot>
      </table></div>
      <h3 style="font-size:12px;font-weight:600;margin:16px 0 6px">Commodity detail</h3>
      <div class="vx-tw"><table class="vx-t pt">
      <thead><tr><th>#</th><th>Commodity ID</th><th>Commodity</th><th class="pt-num">Load %</th><th class="pt-num">Classification Factor</th><th class="pt-num">Factor</th></tr></thead>
      <tbody>${cb.rows.map((row, i) => `<tr>
        <td>${i + 1}</td><td>${row.commodity.classificationNumber}</td><td>${row.commodity.label}</td>
        <td class="pt-num">${row.loadPct}</td><td class="pt-num">${row.excluded ? "\u2014" : row.clsFactor}</td>
        <td class="pt-num">${row.excluded ? "\u2014" : (row.clsFactor * row.hazFactor).toFixed(3)}</td>
      </tr>`).join("")}</tbody></table></div>`;
  };

  /* Fallback for any coverage that does not rate per unit — renders that
     group's own factor chain, so every LOB gets a real tab rather than a
     blank one. */
  function groupPanel(name) {
    let g = (r.groups || []).find(x => x.name === name);
    if (!g) return `<div class="vx-empty" style="padding:20px"><i class="fa-solid fa-shield-halved"></i>${name} is not selected on this quote.</div>`;
    const fs = g.factors || [];
    if (!fs.length) return `<div class="vx-empty" style="padding:20px"><i class="fa-solid fa-shield-halved"></i>${name} carries no itemised factors \u2014 subtotal ${money(g.subtotal)}.</div>`;
    return `<div class="sub">${fs.length} factor${fs.length === 1 ? "" : "s"} applied \u2014 subtotal ${money(g.subtotal)}.</div>
      <div class="vx-tw"><table class="vx-t pt" style="min-width:820px">
      <thead><tr><th>Factor</th><th>Driven by</th><th>Matched</th><th class="pt-num">Applied</th><th class="pt-num">Base</th></tr></thead>
      <tbody>${fs.map(x => `<tr>
        <td class="pt-f">${x.label}${x.varies ? ' <span class="vx-b amber" style="font-size:9px">per unit</span>' : ""}</td>
        <td>${x.input ?? '<span class="pt-mute">\u2014</span>'}</td>
        <td>${x.matched || '<span class="pt-mute">\u2014</span>'}</td>
        <td class="pt-num"><b>${fmtF(x.value, x.kind)}</b></td>
        <td class="pt-num pt-mute">${x.base != null ? fmtF(x.base, x.kind) : "\u2014"}</td></tr>`).join("")}</tbody>
      </table></div>`;
  }

  const panelFor = name => {
    if (name === "Account") return acctPanel();
    if (name === "Auto Liability") return liabPanel();
    if (name === "Physical Damage") return apdPanel();
    if (name === "Cargo") return cargoPanel();
    return groupPanel(name);
  };

  return `<div class="vx-card vx-anim">
    <ul class="nav nav-tabs" style="border-bottom:1px solid var(--border)">
      ${TABS_F.map(t => `<li class="nav-item"><a class="nav-link ${t === cur ? "active" : ""}" href="#" data-truck-tab="${t}" style="font-size:12.3px">${t}</a></li>`).join("")}
    </ul>
    <div style="padding-top:12px">${panelFor(cur)}</div>
  </div>`;
}

function premiumTable(r) {
  const money = v => vxMoney(v);
  const rows = [];
  r.groups.forEach(g => {
    rows.push(`<tr class="pt-grp"><td colspan="6"><i class="fa-solid ${g.icon} me-2" style="color:${g.color}"></i><b>${g.name}</b>
      ${ratedByBadge(g.ratedBy)}</td><td style="text-align:right"><b>${money(g.subtotal)}</b></td></tr>`);
    (g.factors || []).forEach(f => {
      const base = f.base, val = f.value;
      const differs = base != null && typeof val === "number" && Math.abs(val - base) > 1e-9;
      const adj = (base != null && typeof val === "number" && base !== 0 && f.kind === "x")
        ? ((val / base - 1) * 100) : null;
      rows.push(`<tr>
        <td class="pt-f">${f.label}${f.varies ? ' <span class="vx-b amber" style="font-size:9px">per unit</span>' : ""}</td>
        <td>${f.driver ? `<span title="${f.driver}">${f.input ?? "—"}</span>` : '<span class="pt-mute">—</span>'}</td>
        <td>${f.matched || '<span class="pt-mute">—</span>'}</td>
        <td class="pt-num"><b${differs ? ' class="pt-applied"' : ""}>${fmtF(val, f.kind)}</b></td>
        <td class="pt-num ${differs ? "pt-mute" : ""}">${base != null ? fmtF(base, f.kind) : '<span class="pt-mute">—</span>'}</td>
        <td class="pt-num">${adj == null ? '<span class="pt-mute">—</span>'
          : `<span style="color:${adj > 0 ? "var(--bad)" : adj < 0 ? "var(--good)" : "var(--text-mute)"}">${adj > 0 ? "+" : ""}${adj.toFixed(1)}%</span>`}</td>
        <td class="pt-num">${f.kind === "money" ? money(val) : '<span class="pt-mute">—</span>'}</td>
      </tr>`);
    });
  });

  const line = (lbl, val, cls) => `<tr class="pt-total ${cls || ""}"><td colspan="6">${lbl}</td><td class="pt-num">${val}</td></tr>`;
  return `
    <div class="vx-card vx-anim">
      <div class="vx-card-head"><div>
        <h2>How this premium was calculated</h2>
        <div class="sub">Every rating factor applied to this risk, the answer that selected it, and what it did to the premium.</div>
      </div></div>
      <div class="vx-tw"><table class="vx-t pt">
        <thead><tr>
          <th>Rating factor</th><th>Input value</th><th>Matched rule</th>
          <th class="pt-num">Applied</th><th class="pt-num">Default</th><th class="pt-num">Adjustment</th><th class="pt-num">Premium</th>
        </tr></thead>
        <tbody>
          ${rows.join("")}
          ${line("<b>Coverage Premium</b>", "<b>" + money(r.coveragePremium) + "</b>")}
          ${(r.discounts || []).map(d => line("− " + d.name, `<span style="color:var(--good)">${money(d.amt)}</span>`)).join("")}
          ${(r.surcharges || []).map(x => line("+ " + x.name, `<span style="color:var(--bad)">+${money(x.amt)}</span>`)).join("")}
          ${r.driverFactor && r.driverFactor !== 1 ? line(`Driver Factor (worst-rated driver) — ${r.driverFactor.toFixed(3)}×`, money(r.afterDriver)) : ""}
          ${line("Fees", "+" + money(r.fees))}
          ${line(`State Tax (${(r.taxPct * 100).toFixed(2)}%)`, "+" + money(r.tax))}
          ${r.countyTax ? line(`County Tax (${r.countyRate.toFixed(2)}%)`, "+" + money(r.countyTax)) : ""}
          ${line("<b>Final Premium</b>", `<b style="font-size:15px">${money(r.finalPremium)}</b>`, "pt-final")}
        </tbody>
      </table></div>
      <div style="font-size:11.5px;color:var(--text-mute);margin-top:10px">
        <i class="fa-solid fa-circle-info me-1"></i><b>Applied</b> is the value used for this risk;
        <b>Default</b> is the neutral value the factor would take with no matching answer. Where they differ, the applied
        value is highlighted. Open any coverage in the panel on the right to drill into a factor's source table.
      </div>
    </div>`;
}

function paint() {
  const r = S.res, ex = ENGINE.explain(r);
  const fmt = fmtF;
  // The county select only exists on the Insured tab; fall back to the saved
  // value so painting from any other tab still labels county tax correctly.
  const countyEl = document.getElementById("county");
  const county = countyEl ? countyEl.value : (S.county || "");
  const declined = S.elig && S.elig.declines.length;

  // Premium Calculation tab: full transparent build-up.
  const pane = document.getElementById("premiumPane");
  if (pane) {
    pane.innerHTML = eligBanner() + truckPremiumSummary(r) + premiumTable(r) + calculationWalkthrough(r);
    pane.querySelectorAll("[data-truck-tab]").forEach(a => a.onclick = e => {
      e.preventDefault(); S.truckFactorTab = a.dataset.truckTab; paint();
    });
  }

  document.getElementById("side").innerHTML = `
    ${eligBanner()}
    <div class="vx-card vx-anim" style="text-align:center;background:linear-gradient(155deg,var(--primary-soft),rgba(14,165,183,.05))">
      <div style="font-size:11px;color:var(--text-mute);font-weight:650;text-transform:uppercase;letter-spacing:.04em">Annual Premium</div>
      <div style="font-size:34px;font-weight:800;margin:5px 0;letter-spacing:-.02em">${vxMoney(r.finalPremium)}</div>
      <div style="font-size:12px;color:var(--text-dim)">${r.lob} · ${r.state}${county ? " · " + county : ""}</div>
      ${r.minApplied ? '<div class="vx-b amber mt-2">Minimum premium applied</div>' : ""}
      <div class="d-flex gap-2 mt-3"><button class="btn btn-primary btn-sm w-100" onclick="issue()" ${declined ? "disabled title=\"Resolve the decline above first\"" : ""}><i class="fa-solid fa-file-lines me-1"></i>Generate Quote</button></div>
    </div>

    ${S.tab === "factors" ? "" : `
    <div class="vx-card vx-anim vx-anim-d1">
      <h2>How this premium was built</h2><div class="sub">Click a coverage to see its factors</div>
      <div class="vx-tw"><table class="vx-t"><tbody>
        ${r.groups.map((g, i) => `
          <tr class="vx-exp" data-x="${i}" style="cursor:pointer">
            <td><i class="fa-solid fa-chevron-right me-2" style="font-size:9px;transition:.2s" id="chev${i}"></i>
              <i class="fa-solid ${g.icon} me-1" style="color:${g.color}"></i><b>${g.name}</b>
              ${ratedByBadge(g.ratedBy)}</td>
            <td style="text-align:right"><b>${vxMoney(g.subtotal)}</b></td></tr>
          <tr class="vx-exp-body" id="exp${i}"><td colspan="2" style="padding:0">
            <table class="vx-t" style="margin:0">
              ${childRows(g, r)}
              <tr><td colspan="2" style="padding:5px 12px 4px 30px;font-size:9.5px;font-weight:800;letter-spacing:.05em;
                text-transform:uppercase;color:var(--text-mute)">Factor chain — click any row to see where its value came from</td></tr>
              ${g.factors.map((f, fi) => factorRow(f, i, fi)).join("")}
            </table></td></tr>`).join("")}
        <tr><td><b>Coverage Premium</b></td><td style="text-align:right"><b>${vxMoney(r.coveragePremium)}</b></td></tr>
        ${r.discounts.map(d => `<tr><td style="color:var(--good)">− ${d.name}${d.why ? ` <span class="hintdot" title="${d.why}">Why</span>` : ""}</td><td style="text-align:right;color:var(--good)">${vxMoney(d.amt)}</td></tr>`).join("")}
        ${r.surcharges.map(s => `<tr><td style="color:var(--bad)">+ ${s.name}${s.why ? ` <span class="hintdot" title="${s.why}">Why</span>` : ""}</td><td style="text-align:right;color:var(--bad)">+${vxMoney(s.amt)}</td></tr>`).join("")}
        ${creditsNotAppliedRow(r)}
        ${r.driverFactor && r.driverFactor !== 1 ? `<tr><td>Driver Factor (worst-rated driver)</td>
          <td style="text-align:right">${r.driverFactor.toFixed(3)}×</td></tr>
        <tr><td>After Driver Factor</td><td style="text-align:right">${vxMoney(r.afterDriver)}</td></tr>` : ""}
        <tr class="vx-exp" data-x="fees" style="cursor:pointer"><td>
          <i class="fa-solid fa-chevron-right me-2" style="font-size:9px;transition:.2s" id="chevfees"></i>Fees</td>
          <td style="text-align:right">+${vxMoney(r.fees)}</td></tr>
        <tr class="vx-exp-body" id="expfees"><td colspan="2" style="padding:0"><table class="vx-t" style="margin:0">
          ${(r.feeLines || []).map(f => `<tr>
            <td style="padding-left:32px;font-size:12.1px;color:var(--text-dim)">${f.name}
              ${f.valueType === "Percent"
                ? `<span style="color:var(--text-mute)">— ${f.pct}% of ${f.percentOf} (${vxMoney(f.base)})</span>
                   ${f.capped ? `<span class="vx-b amber" style="margin-left:5px">${f.capped} ${vxMoney(f.capped === "min" ? f.minFee : f.maxFee)} applied</span>` : ""}`
                : `<span style="color:var(--text-mute)">— ${vxMoney(f.unit)} × ${f.qty} (${f.chargeType})</span>`}
              ${f.taxable ? '<span class="vx-b gray" style="margin-left:5px">taxable</span>' : ""}</td>
            <td style="text-align:right;font-size:12.1px">${vxMoney(f.amt)}</td></tr>`).join("")}
        </table></td></tr>
        <tr><td>State Tax (${(r.taxPct*100).toFixed(2)}%)</td><td style="text-align:right">+${vxMoney(r.tax)}</td></tr>
        ${r.countyTax ? `<tr><td>County Tax — ${r.countyName} (${r.countyRate.toFixed(2)}%)</td>
          <td style="text-align:right">+${vxMoney(r.countyTax)}</td></tr>` : ""}
        ${r.countyUnknown ? `<tr><td colspan="2" style="color:var(--warn);font-size:11.8px">
          <i class="fa-solid fa-triangle-exclamation" style="margin-inline-end:6px" aria-hidden="true"></i>
          ${r.countyRequested} is not configured for ${r.state} — no local tax was charged.
          Add it under Geography &rsaquo; Counties before binding.</td></tr>` : ""}
        <tr style="background:var(--primary-soft)"><td><b>Total</b></td><td style="text-align:right"><b>${vxMoney(r.finalPremium)}</b></td></tr>
      </tbody></table></div>
    </div>`}

    ${r.perVehicle ? `<div class="vx-card vx-anim vx-anim-d2">
      <h2>Premium by Vehicle</h2><div class="sub">${r.perVehicle.length} units — each rated separately, then summed</div>
      <div class="vx-tw"><table class="vx-t">
        <thead><tr><th>#</th><th>Unit</th><th>Trailer</th><th>Liability</th><th>Phys Dam</th><th>Total</th></tr></thead>
        <tbody>${r.perVehicle.map(v => `<tr>
          <td><b>${v.n}</b></td>
          <td style="font-size:12.1px">${v.desc}<div style="color:var(--text-mute);font-size:11px">${v.primaryClass} · ${v.year} · ${vxMoney(v.value)}</div></td>
          <td style="font-size:12.1px">${v.trailer.startsWith("None") ? '<span style="color:var(--text-mute)">—</span>'
            : v.trailer + `<div style="color:var(--text-mute);font-size:11px">${vxMoney(v.trailerValue)} · ${v.trailerFactor.toFixed(2)}×</div>`}</td>
          <td>${vxMoney(v.liab)}</td><td>${vxMoney(v.apd)}</td><td><b>${vxMoney(v.total)}</b></td></tr>`).join("")}
        </tbody></table></div></div>` : ""}

    ${r.perDriver ? `<div class="vx-card vx-anim vx-anim-d2">
      <h2>Drivers</h2><div class="sub">Worst-rated driver sets the policy driver factor (${r.driverFactor.toFixed(3)}×)</div>
      <div class="vx-tw"><table class="vx-t">
        <thead><tr><th>Driver</th><th>Age</th><th>CDL</th><th>Viol.</th><th>Class</th><th>Net Factor</th></tr></thead>
        <tbody>${r.perDriver.map((d, k) => `<tr ${k === 0 ? 'style="background:var(--primary-soft)"' : ""}>
          <td style="font-size:12.1px">${d.name}${k === 0 ? ' <span class="vx-b blue">rating driver</span>' : ""}</td>
          <td>${d.age}</td><td>${d.cdlYears}y</td>
          <td>${d.violations > 0 ? `<span class="vx-b amber">${d.violations}</span>` : "0"}</td>
          <td style="font-size:11.8px">${d.cls}</td>
          <td><b>${(d.classFactor ?? 1).toFixed(3)}×</b></td></tr>`).join("")}
        </tbody></table></div>
      ${r.surchargedDrivers ? `<div style="font-size:11.8px;color:var(--text-dim);margin-top:8px">
        <i class="fa-solid fa-circle-info me-1"></i>${r.surchargedDrivers} driver${r.surchargedDrivers > 1 ? "s" : ""}
        with violations incurred the Driver Surcharge Fee.</div>` : ""}</div>` : ""}

    ${moversStrip(r)}

    <div class="vx-card vx-anim vx-anim-d2">
      <h2><i class="fa-solid fa-wand-magic-sparkles me-2" style="color:var(--purple)"></i>Why this price?</h2>
      <div class="vx-ai">
        <p style="margin:0 0 8px">${ex.summary}</p>
        <b style="font-size:11.5px">Biggest drivers</b>
        <ul style="margin:5px 0 8px;padding-left:17px;font-size:12.3px">${ex.drivers.map(d => `<li>${d}</li>`).join("")}</ul>
        <b style="font-size:11.5px">Taxes &amp; fees</b>
        <p style="margin:4px 0 0;font-size:12.3px">${ex.taxes}${r.countyTax ? ` A county tax of ${r.countyRate.toFixed(2)}% for ${r.countyName} added ${vxMoney(r.countyTax)}.` : ""}</p>
        ${ex.warnings.length ? `<div class="mt-2"><span class="vx-b amber">Note</span> <span style="font-size:12.3px">${ex.warnings.join(" ")}</span></div>` : ""}
      </div>
    </div>`;

  document.querySelectorAll(".vx-exp").forEach(el => el.onclick = () => {
    const x = el.dataset.x, body = document.getElementById("exp" + x), ch = document.getElementById("chev" + x);
    body.classList.toggle("on");
    if (ch) ch.style.transform = body.classList.contains("on") ? "rotate(90deg)" : "";
  });
  // per-factor provenance drill-down (stop propagation so it doesn't collapse the parent coverage)
  document.querySelectorAll(".ftrow").forEach(el => el.onclick = e => {
    e.stopPropagation();
    const id = el.dataset.ft, body = document.getElementById("expf" + id), ch = document.getElementById("chf" + id);
    body.classList.toggle("on");
    if (ch) ch.style.transform = body.classList.contains("on") ? "rotate(90deg)" : "";
  });
}

/* The issued quote keeps the full factor chain, not just a total — every
   coverage's factors, the account-level breakdown, and what moved the
   premium — reusing the same trace data the live screen shows, so nothing
   in the "generated" quote can drift from what was actually calculated. */
function issue() {
  if (S.elig && S.elig.declines.length) {
    vxToast("Cannot generate quote", S.elig.declines.length + " eligibility rule(s) decline this risk — resolve them first.", "err");
    return;
  }
  const r = S.res;
  const acctChip = (n, v) => v === 0 ? "" : `<span class="fimp ${v > 0 ? "up" : "down"}" style="margin:2px 4px 2px 0">${n} ${v > 0 ? "+" : ""}${(v * 100).toFixed(0)}%</span>`;
  const acctLines = r.accountFactorLines || [];

  vxModal("Quote Generated", `
    <div style="text-align:center;padding:4px 0 14px;border-bottom:1px solid var(--border);margin-bottom:14px">
      <div style="width:48px;height:48px;border-radius:13px;background:rgba(18,160,106,.13);color:var(--good);display:grid;place-items:center;margin:0 auto 10px;font-size:20px"><i class="fa-solid fa-file-circle-check"></i></div>
      <h4 style="font-size:16px;margin:0 0 3px">Q-2026-${10500 + Math.floor(Math.random() * 400)}</h4>
      <div style="color:var(--text-dim);font-size:13px">${S.insName || "Lonestar Freight LLC"} · ${r.lob} · ${r.state}</div>
      <div style="font-size:25px;font-weight:800;margin-top:9px">${vxMoney(r.finalPremium)}</div>
      ${r.minApplied ? '<div class="vx-b amber mt-1">Minimum premium applied</div>' : ""}
    </div>

    <h6 style="font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-mute);margin-bottom:7px">Coverage Breakdown</h6>
    <div class="vx-tw mb-3"><table class="vx-t" style="margin:0">
      ${r.groups.map(g => `<tr><td><i class="fa-solid ${g.icon} me-1" style="color:${g.color}"></i>${g.name}</td>
        <td style="text-align:right"><b>${vxMoney(g.subtotal)}</b></td></tr>`).join("")}
      <tr><td>Coverage Premium</td><td style="text-align:right">${vxMoney(r.coveragePremium)}</td></tr>
      <tr><td>Fees + Tax${r.countyTax ? " + County" : ""}</td><td style="text-align:right">+${vxMoney(r.fees + r.tax + (r.countyTax || 0))}</td></tr>
      <tr style="background:var(--primary-soft)"><td><b>Total</b></td><td style="text-align:right"><b>${vxMoney(r.finalPremium)}</b></td></tr>
    </table></div>

    ${acctLines.length ? `
    <h6 style="font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-mute);margin-bottom:7px">Account-Level Factor — ${(r.accountFactor || 1).toFixed(3)}×</h6>
    <div class="mb-3" style="font-size:11.5px;line-height:2.1">${acctLines.map(([n, v]) => acctChip(n, v)).join("") || '<span style="color:var(--text-mute)">All eight underwriting answers are neutral.</span>'}</div>` : ""}

    <h6 style="font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text-mute);margin-bottom:2px">What Moved This Premium</h6>
    <div style="max-height:280px;overflow-y:auto">${tracePanel(r)}</div>
  `,
    [{ t: "Close", c: "secondary" }, { t: "Download PDF", c: "primary", fn: () => vxToast("PDF generated", "Quote document ready", "ok") }], "modal-lg");
}

restoreQuoteState();
render();
if (S.res) paint();
</script>
</body>
</html>
