<!DOCTYPE html>
<html lang="en" style="background-color:#1A1D23">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>States — Geography | VeriDex</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body><div id="vxApp"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cosmos-model.js"></script>
<script src="assets/js/tenant-setup.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/grid.js"></script>
<script src="assets/js/ag-grid-adapter.js"></script>
<script>
vxShell("State Management", "State availability and filing status. || Controls which states are included in each rater build.", [{l:"Geography"},{l:"State Management"}]);
document.getElementById("vxBody").innerHTML = `
  ${vxNotWiredBanner('Tax rates here are read-only. <a href="taxes.html">Edit them on State Taxes →</a>',
    'The rating engine charges tax from <b>one place only</b>, <a href="taxes.html">State Taxes</a>. Editing tax on this screen used to silently do nothing while still showing a normal "Saved" message, so the fields are locked here instead.')}
  <div class="vx-card vx-anim"><div id="grid"></div></div>`;
vxAgGrid({ el:"#grid", key:"states", name:"State",
  size:12,
  cols:[{k:"name",l:"State"},{k:"abv",l:"Abv"},{k:"stateCode",l:"Code"},
      {k:"filingStatus",l:"Filing Status",editable:true,r:r=>'<span class="vx-b '+(r.filingStatus==="Approved"?"green":"amber")+'">'+r.filingStatus+'</span>'},
      {k:"surplusTax",l:"Surplus Lines Tax",r:r=>'<span style="color:var(--text-mute)" title="Read-only — edit on State Taxes">'+r.surplusTax.toFixed(2)+"%</span>"},
      /* Real counts, linked through to the records they count — and the LOBs
         shown by NAME. All three were random numbers before, which read as
         internal ids and disagreed with the actual data. */
      {k:"territories",l:"Territories",r:r=>r.territories
        ? '<a href="territories.html?state='+r.abv+'"><span class="vx-b blue">'+r.territories+'</span></a>'
        : '<span class="vx-b gray">None</span>'},
      {k:"counties",l:"Counties",r:r=>r.counties
        ? '<a href="counties.html?state='+r.abv+'"><span class="vx-b blue">'+r.counties+'</span></a>'
        : '<span class="vx-b gray">None</span>'},
      {k:"lobs",l:"Lines of Business",sort:false,r:r=>(r.lobNames||[]).length
        ? r.lobNames.map(n=>'<span class="vx-b cyan me-1">'+(n==="All"?"All lines":n.replace(" (MPL)",""))+'</span>').join("")
        : '<span class="vx-b gray">None configured</span>'},
      {k:"included",l:"In Rater",editable:true,r:r=>'<span class="vx-b '+(r.included?"green":"gray")+'">'+(r.included?"Yes":"No")+'</span>'}],
  form:[{k:"name",l:"State Name"},{k:"abv",l:"Abbreviation"},{k:"stateCode",l:"State Code"},
      {k:"filingStatus",l:"Filing Status",t:"select",opts:["Approved","Pending","Not Filed"]},
      {k:"included",l:"Included in Rater",t:"check"}],
  extraView:[{k:"surplusTax",l:"Surplus Lines Tax (read-only — edit on State Taxes)",r:r=>r.surplusTax.toFixed(2)+"%"}],
  filters:[{k:"filingStatus",l:"Filing",opts:["Approved","Pending","Not Filed"]}] });

</script>
</body>
</html>
