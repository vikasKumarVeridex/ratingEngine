<!DOCTYPE html>
<html lang="en" style="background-color:#1A1D23">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Counties — Geography | VeriDex</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
<link href="assets/css/workspace.css" rel="stylesheet">
<script src="assets/js/tooltip-dictionary.js" defer></script>
<script src="assets/js/ui-ux.js" defer></script>
</head>
<body><div id="vxApp"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cosmos-model.js"></script>
<script src="assets/js/tenant-setup.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/grid.js"></script>
<script src="assets/js/ag-grid-adapter.js"></script>
<script>
vxShell("County Management", "County-level configuration. || Territory assignment, catastrophe zone and municipal tax rates.", [{l:"Geography"},{l:"County Management"}]);
document.getElementById("vxBody").innerHTML = `<div class="vx-card vx-anim"><div id="grid"></div></div>`;
vxAgGrid({ el:"#grid", key:"counties", name:"County",
  size:12,
  cols:[{k:"fips",l:"FIPS"},{k:"name",l:"County"},{k:"state",l:"State"},{k:"stateName",l:"State Name"},
      {k:"territory",l:"Territory",r:r=>'<span class="vx-b blue">'+r.territory+'</span>'},
      {k:"population",l:"Population",r:r=>vxNum(r.population)},
      {k:"catZone",l:"Cat Zone",r:r=>r.catZone==="None"?'<span class="vx-b gray">None</span>':'<span class="vx-b amber">'+r.catZone+'</span>'},
      {k:"taxRate",l:"Municipal Tax",r:r=>r.taxRate.toFixed(2)+"%"}],
  form:[{k:"fips",l:"FIPS Code"},{k:"name",l:"County Name"},{k:"state",l:"State",t:"select",opts:VX.states.map(s=>s.abv)},
      {k:"territory",l:"Territory"},{k:"population",l:"Population",t:"number"},
      {k:"catZone",l:"Catastrophe Zone",t:"select",opts:["None","Wind","Hail","Wind/Hail","Quake","Flood"]},
      {k:"taxRate",l:"Municipal Tax %",t:"number",step:"0.01"}],
  filters:[{k:"state",l:"State",opts:VX.states.map(s=>s.abv)},{k:"catZone",l:"Cat Zone",opts:["None","Wind","Hail","Wind/Hail","Quake","Flood"]}] });

const qs = new URLSearchParams(location.search).get("state");
if (qs) setTimeout(() => {
  const sel = document.querySelector('[data-f="state"]');
  if (sel) { sel.value = qs; sel.dispatchEvent(new Event("change")); vxToast("Filtered", "Showing counties in " + qs, "info"); }
}, 400);
</script>
</body>
</html>
