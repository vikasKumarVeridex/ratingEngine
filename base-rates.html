<!DOCTYPE html>
<html lang="en" style="background-color:#1A1D23">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Base Rates — Pricing | VeriDex</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body><div id="vxApp"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cosmos-model.js"></script>
<script src="assets/js/tenant-setup.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/grid.js"></script>
<script src="assets/js/ag-grid-adapter.js"></script>
<script>
vxShell("Base Rate Tables", "Loss costs and base rates by state, territory, class and coverage. || The starting point of every calculation chain.", [{l:"Rating Data"},{l:"Base Rate Tables"}]);
document.getElementById("vxBody").innerHTML = `
  ${vxNotWiredBanner('An inventory, not what the engine rates from — editing a row here changes no premium.',
    'Each line of business reads its own real, filed tables in <a href="rate-tables.html">Rate Tables</a> instead: loss costs, ILFs, class factors and the rest.')}
  <div class="vx-card vx-anim"><div id="grid"></div></div>`;
vxAgGrid({ el:"#grid", key:"baseRates", name:"Base Rate",
  
  cols:[{k:"lob",l:"LOB"},{k:"state",l:"State"},{k:"territory",l:"Territory"},{k:"classCode",l:"Class"},{k:"coverage",l:"Coverage"},
      {k:"baseRate",l:"Base Rate",r:r=>vxMoney2(r.baseRate)},{k:"unit",l:"Unit"},{k:"filingId",l:"Filing ID"},
      {k:"version",l:"Version",r:r=>'<span class="vx-b gray">'+r.version+'</span>'}],
  form:[{k:"lob",l:"LOB",t:"select",opts:vxLobNames()},
      /* Multi-select with fan-out: pick every state this filed rate applies to
         and each gets its own row, because base rates are stored per state. */
      {k:"state",l:"States",t:"dropdown",fanOut:true,placeholder:"No states selected",
        opts:VX.states.map(s=>({value:s.abv,label:`${s.abv} \u2014 ${s.name}`})),
        hint:"Pick one or many \u2014 a separate base-rate row is created for each state selected."},
      {k:"territory",l:"Territory"},{k:"classCode",l:"Class Code"},{k:"coverage",l:"Coverage"},
      {k:"baseRate",l:"Base Rate",t:"number",step:"0.01"},
      {k:"unit",l:"Rating Unit",t:"select",opts:["Per Unit","Per $100 TIV","Per $1,000 Revenue","Per Employee"]},
      {k:"filingId",l:"Filing ID"},{k:"effectiveDate",l:"Effective Date",t:"date"}],
  filters:[{k:"lob",l:"LOB",opts:vxLobNames()},
      /* Only states that actually have a row — a picker listing all 50 when
         most return nothing reads as broken rather than empty. */
      {k:"state",l:"State",multi:true,opts:[...new Set(VX.baseRates.map(r=>r.state))].sort()},
      {k:"coverage",l:"Coverage",opts:["Liability","Physical Damage","Cargo","Building","BPP","Professional","Cyber"]}] });

</script>
</body>
</html>
