.ep-m.POST{background:var(--primary-soft);color:var(--primary)}

.ep-d{font-size:12.1px;color:var(--text-dim);margin-left:auto;text-align:right}
.ep-b{display:none;padding:13px;border-top:1px solid var(--border);background:var(--surface-2)}
.ep-b.on{display:block}
.pill-auth{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--surface-3);color:var(--text-mute);font-weight:700}
</style>

function drawEps(filter) {
  const f = (filter || "").toLowerCase();
  document.getElementById("eps").innerHTML = GROUPS.map((g, gi) => {
    const eps = g.eps.filter(e => !f || e.p.toLowerCase().includes(f) || e.d.toLowerCase().includes(f) || e.m.toLowerCase() === f);
    if (!eps.length) return "";
    return `<div style="margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
        <i class="fa-solid ${g.i}" style="color:${g.c};font-size:13px"></i>
        <b style="font-size:12.8px">${g.g}</b><span class="vx-b gray">${eps.length}</span></div>
      ${eps.map((e, i) => `<div class="ep">
        <div class="ep-h" data-e="${gi}-${i}">
          <span class="ep-m ${e.m}">${e.m}</span>
          <span class="ep-p"><span class="v">/v1</span>${e.p.replace(/\{(\w+)\}/g, '<span style="color:var(--warn)">{$1}</span>')}</span>
          <span class="ep-d">${e.d}<br><span class="pill-auth">${e.auth}</span></span>
        </div>
        <div class="ep-b" id="b${gi}-${i}">
          ${e.req ? `<div style="font-size:11px;font-weight:700;color:var(--text-mute);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px">${e.m === "GET" ? "Query parameters" : "Request body"}</div>
            <div class="vx-code" style="font-size:11.4px;margin-bottom:11px">${JSON.stringify(e.req, null, 2)}</div>` : ""}
          <div style="font-size:11px;font-weight:700;color:var(--text-mute);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px">200 Response</div>
          <div class="vx-code" style="font-size:11.4px">${JSON.stringify(e.res, null, 2)}</div>
          <div class="d-flex gap-2 mt-2">
            <button class="btn btn-outline-secondary btn-sm" onclick='curl(${JSON.stringify(JSON.stringify({m:e.m,p:e.p,req:e.req}))})'>
              <i class="fa-solid fa-terminal me-1"></i>cURL</button>
            ${e.p.includes("/rate") || e.p.includes("calculate") ? `<button class="btn btn-primary btn-sm" onclick="tryIt()"><i class="fa-solid fa-play me-1"></i>Try it</button>` : ""}
          </div>
        </div></div>`).join("")}
    </div>`;
  }).join("") || `<div class="vx-empty"><i class="fa-solid fa-inbox"></i>No endpoints match.</div>`;

  document.querySelectorAll(".ep-h").forEach(h => h.onclick = () => {
    document.getElementById("b" + h.dataset.e).classList.toggle("on");
  });
}

function curl(payload) {
  const e = JSON.parse(payload);
  const body = e.req && e.m !== "GET" ? ` \\\n  -d '${JSON.stringify(e.req)}'` : "";
  const qs = e.req && e.m === "GET" ? "?" + Object.entries(e.req).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join("&") : "";
  vxModal("cURL", `<div class="vx-code" style="font-size:11.6px">curl -X ${e.m} "${BASE}${e.p}${qs}" \\
  -H "Authorization: Bearer $TOKEN" \\
  -H "Content-Type: application/json"${body}</div>`,
    [{ t: "Close", c: "secondary" }, { t: "Copy", c: "primary", fn: () => vxToast("Copied", "cURL command copied to clipboard", "ok") }], "modal-lg");
}

function tryIt() {
  const r = ENGINE.rate("MPL", { state: "TX", revenue: 250000, hazardGroup: 2, limit: 200000,
    retention: 5000, alae: "Defense Within Limits", yip: "4th or More", experienceFactor: 0.9, uwAdjust: 0 });
  vxModal("POST /v1/rate — live response", `
    <div style="font-size:11px;font-weight:700;color:var(--text-mute);text-transform:uppercase;margin-bottom:5px">Request</div>
    <div class="vx-code" style="font-size:11.4px;margin-bottom:11px">${JSON.stringify({ lob:"MPL", state:"TX", revenue:250000, hazardGroup:2, limit:200000, retention:5000, alae:"Defense Within Limits" }, null, 2)}</div>
    <div style="font-size:11px;font-weight:700;color:var(--text-mute);text-transform:uppercase;margin-bottom:5px">200 Response · ${Math.round(90 + Math.random() * 80)}ms</div>
    <div class="vx-code" style="font-size:11.4px">${JSON.stringify({
      finalPremium: r.finalPremium, coveragePremium: r.coveragePremium,
      fees: r.fees, tax: r.tax, ratingVersion: r.version,
      factors: r.groups[0].factors.slice(0, 5).map(f => ({ name: f[0], value: f[1] })),
      minimumApplied: r.minApplied,
    }, null, 2)}</div>
    <div class="vx-ai mt-2" style="padding:9px 12px;font-size:12.2px">This is the real engine responding — the same code path the Quote Portal uses.</div>`,
    [{ t: "Close", c: "secondary" }], "modal-lg");
}

function openapi() {
  vxModal("OpenAPI 3.1 Specification", `<div class="vx-code" style="font-size:11.4px;max-height:400px;overflow:auto">openapi: 3.1.0
info:
  title: Veridex Rating Engine API
  version: "1.0.0"
  description: Centralized premium calculation for all products and channels
servers:
  - url: ${BASE}
    description: Production
  - url: https://sandbox.veridex.io/v1
    description: Sandbox
security:
  - oauth2: [rate:execute]
paths:
${GROUPS.flatMap(g => g.eps.map(e => `  ${e.p}:
    ${e.m.toLowerCase()}:
      summary: ${e.d}
      tags: [${g.g}]
      security: [{ oauth2: [${e.auth}] }]`)).join("\n")}</div>`,
    [{ t: "Close", c: "secondary" }, { t: "Download YAML", c: "primary", fn: () => vxToast("Spec downloaded", "veridex-openapi-v1.yaml", "ok") }], "modal-xl");
