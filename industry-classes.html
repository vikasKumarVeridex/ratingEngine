<!DOCTYPE html>
<html lang="en" style="background-color:#1A1D23">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Industry Classes — Rating | VeriDex</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body><div id="vxApp"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cosmos-model.js"></script>
<script src="assets/js/tenant-setup.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/grid.js"></script>
<script src="assets/js/ag-grid-adapter.js"></script>
<script>
vxShell("Industry Classes (NAICS)", "What the insured's business actually does. || Separate from Coverages / Class of Business — this drives the hazard group and class factor, not the premium line items.",
  [{ l: "Products & Rating" }, { l: "Industry Classes" }]);

document.getElementById("vxBody").innerHTML = `
  <div class="vx-exp2 vx-anim" id="expInd" style="border-left-color:var(--primary)">
    <div class="hd"><i class="fa-solid fa-circle-info" style="color:var(--primary);font-size:11.5px"></i><b>Not the same as Coverages</b><span>Industry Class = what the business <i>does</i>. Coverage = what carries premium.</span><button type="button" class="tog" onclick="vxExpToggle(&#39;expInd&#39;)">Why?</button></div>
    <div class="bd"><p><b>Industry Class</b> = what the business does (NAICS 484121 — Long-Distance Truckload). <b>Coverage / Class of Business</b> = what is being insured and what carries premium (Auto Liability → Bodily Injury). A quote picks one Industry Class and one or more Coverages. <a href="coverages.html">View the coverage tree →</a></p></div>
  </div>

  <div class="mb-3 vx-anim" style="border:1px solid var(--border);border-left:3px solid var(--bad);background:rgba(210,69,69,.09);border-radius:0 10px 10px 0;padding:12px 16px;font-size:12.4px;line-height:1.65">
    <i class="fa-solid fa-triangle-exclamation me-1" style="color:var(--bad)"></i>
    <b>Class Factor values on this screen are generated, not filed — and the General Liability calculator reads them.</b>
    The NAICS codes and industry names are real (2022 NAICS), and Hazard Groups for the seeded classes are
    considered; but every <b>Class Factor</b> is a random value in the 0.7–1.9 range. Because
    <code>engine.js</code> looks this factor up when rating GL, those random numbers reach the premium.
    Treat any GL quote as illustrative until these are replaced with filed class factors.</div>
  <div class="vx-card vx-anim"><div id="grid"></div></div>`;

vxAgGrid({ el:"#grid", key:"industryClasses", name:"Industry Class", size:12,
  cols:[
    {k:"code",l:"NAICS Code"},{k:"name",l:"Industry Class"},{k:"lob",l:"Typical LOB"},
    {k:"hazardGroup",l:"Hazard Group",r:r=>'<span class="vx-b '+(r.hazardGroup>=4?"red":r.hazardGroup===3?"amber":"green")+'">HG '+r.hazardGroup+'</span>'},
    {k:"factor",l:"Class Factor",r:r=>r.factor.toFixed(3)+"×"},
    {k:"quotes",l:"Quotes"},
    {k:"active",l:"Status",r:r=>'<span class="vx-b '+(r.active?"green":"gray")+'">'+(r.active?"Active":"Inactive")+'</span>'}],
  form:[{k:"code",l:"NAICS Code"},{k:"name",l:"Industry Class Name"},
    {k:"lob",l:"Typical LOB",t:"select",opts:vxLobNames()},
    {k:"hazardGroup",l:"Hazard Group",t:"select",opts:[1,2,3,4,5]},
    {k:"factor",l:"Class Factor",t:"number",step:"0.001"},{k:"active",l:"Active",t:"check"}],
  filters:[{k:"lob",l:"LOB",opts:vxLobNames()},{k:"hazardGroup",l:"Hazard",opts:[1,2,3,4,5]}]
});
</script>
</body>
</html>
