<!DOCTYPE html>
<html lang="en" style="background-color:#1A1D23">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit History — Administration | VeriDex</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
<link href="assets/css/workspace.css" rel="stylesheet">
<script src="assets/js/tooltip-dictionary.js" defer></script>
<script src="assets/js/ui-ux.js" defer></script>
</head>
<body><div id="vxApp"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cosmos-model.js"></script>
<script src="assets/js/tenant-setup.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/grid.js"></script>
<script src="assets/js/ag-grid-adapter.js"></script>
<script>
vxShell("Audit History", "Immutable log of every configuration change. || Includes AI-originated recommendations that were applied.", [{l:"Administration"},{l:"Audit History"}]);
document.getElementById("vxBody").innerHTML = `<div class="vx-card vx-anim"><div id="grid"></div></div>`;
vxAgGrid({ el:"#grid", key:"audit", name:"Audit Entry",
  readOnly:true,size:15,
  cols:[{k:"timestamp",l:"Timestamp"},
      {k:"user",l:"User",r:r=>r.user.includes("ai")?'<span class="vx-b purple"><i class="fa-solid fa-robot me-1"></i>AI</span> '+r.user.split("@")[0]:r.user.split("@")[0]},
      {k:"area",l:"Area"},{k:"action",l:"Action"},{k:"detail",l:"Detail"},
      {k:"version",l:"Version",r:r=>'<span class="vx-b gray">'+r.version+'</span>'},{k:"ip",l:"Source IP"}],
  
  filters:[{k:"area",l:"Area",opts:["Rating Factors","Base Rates","Products","Rating Versions","State Configuration","Coverages","Discounts","Surcharges","Taxes","Eligibility Rules","Lookup Tables","Users & Roles","System Settings","Formula Builder","Form Builder"]}] });

</script>
</body>
</html>
