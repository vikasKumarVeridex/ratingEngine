<script>
/* Same honesty rule as Integration Guide's Technology Stack card (which this
   page is a detailed sibling of, not a replacement for): this platform is a
   browser-only HTML/JS prototype. What follows documents the real .NET/
   Angular/Cosmos system it models, grounded in structures that already exist
   in THIS prototype's own code (engine.js's LOB dispatch table, the factor-
   code generator in factors.html, the typed Cosmos facade in cosmos-model.js)
   rather than invented from scratch — the prototype's shape is deliberately
   a small-scale mirror of the real one. */
vxShell("Technical Guide",
  "Naming conventions and the software design patterns the real implementation follows — and exactly where each one is used. || A detailed sibling to Integration Guide's Technology Stack card, not a restatement of it.",
  [{ l: "Reference & Tools" }, { l: "Technical Guide" }]);

document.getElementById("vxPageActions").innerHTML =
  `<a href="integration.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-plug me-1"></i>Integration Guide</a>
   <a href="engine-flow.html" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-sitemap me-1"></i>Engine Flow</a>`;

document.getElementById("vxBody").innerHTML = `
  <div class="row g-3">
    <div class="col-lg-6">

      <div class="vx-card vx-anim">
        <h2>Naming convention: UPPER_SNAKE_CASE for codes</h2>
        <div class="sub">Reserved for identifiers an actuary reads, not for document properties.</div>
        <div style="font-size:12.3px;color:var(--text-dim);line-height:1.7">
          Every business <b style="color:var(--text)">code</b> — factor codes, LOB codes, product codes —
          is generated as <code>PREFIX_WORD_WORD</code>: uppercase words joined on underscores. See
          <code>vxGenerateFactorCode()</code> in <code>factors.html</code>, which is the real generator this
          platform runs, not a mock:
        </div>
        <pre class="dp-code">// factors.html — slugifyFactorName() + vxGenerateFactorCode()
"Territory Base Loss Cost Factor" + Commercial Trucking
  → words: TERRITORY BASE LOSS COST   (stopword "Factor" dropped)
  → code:  TRK_TERRITORY_BASE_LOSS_COST</pre>
        <div style="font-size:12.3px;color:var(--text-dim);line-height:1.7;margin-top:12px">
          <b style="color:var(--text)">Why snake_case, specifically:</b>
          <ul style="margin:6px 0 0;padding-inline-start:18px">
            <li>Filed rate manuals and NCCI/ISO source tables already use ALL-CAPS, underscore-separated codes —
              a factor code that reads the same way here as it does in the source workbook is one less translation
              an actuary has to hold in their head.</li>
            <li>Codes get embedded verbatim in the formula DSL (Formula Builder), in exported CSV headers, and in
              cross-system lookups. A fixed, single-case convention means matching a code is a plain string
              comparison — no case-folding, no risk of the casing-mismatch bugs this platform's own engine.js had
              to have <code>sameText()</code>/<code>sameProduct()</code> added to guard against at the free-text
              product/LOB-name level.</li>
            <li>Underscore-separated words stay readable at any length or abbreviation density
              (<code>TRK_APD_PACKAGE</code>) where camelCase gets ambiguous once two abbreviations sit next to each
              other (<code>trkAPDPackage</code> — where does APD end?).</li>
          </ul>
        </div>
        <div class="vx-exp2 vx-anim mt-3" style="border-left-color:var(--primary)">
          <div class="hd"><i class="fa-solid fa-circle-info" style="color:var(--primary);font-size:11.5px"></i>
            <b>Not the document schema</b><span>Cosmos document properties stay camelCase.</span></div>
          <div class="bd" style="display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
            <p style="margin:0;font-size:12.3px;color:var(--text-dim);line-height:1.6">
              <code>tenantId</code>, <code>ratingFactor</code>, <code>effectiveStart</code> — every JSON property
              name in <code>cosmos-model.js</code> is camelCase, deliberately the opposite convention from codes.
              That is what .NET's <code>System.Text.Json</code> emits by default and what Angular's TypeScript
              models consume with no mapping layer in between. snake_case is reserved for <em>values</em> a person
              reads and types (codes); camelCase is left alone for <em>keys</em> two frameworks already agree on.
            </p>
          </div>
        </div>
      </div>

    </div>
    <div class="col-lg-6">

      <div class="vx-card vx-anim">
        <h2>Design patterns, and exactly where</h2>
        <div class="sub">Each one maps to a structure that already exists in this platform's own code.</div>

        <div class="dp-pat">
          <div class="hd"><span class="vx-b blue">Behavioral</span><b>Strategy</b></div>
          <p><code>ENGINE.rate(lobCode, input)</code> in <code>engine.js</code> dispatches through one lookup table
            of interchangeable calculators:</p>
          <pre class="dp-code">const MAP = { TRUCK: trucking, MPL: mpl, PROP: property,
               GL: gl, CYBER: cyber, WC: workersComp };
const fn = MAP[lobCode];</pre>
          <p style="margin-top:6px">Every line's calculator shares one contract (risk in, premium + trace out).
            Adding a line is one new entry in <code>MAP</code>; the dispatcher itself never changes — the
            textbook reason to reach for Strategy over a growing <code>if/else</code> chain.</p>
        </div>

        <div class="dp-pat">
          <div class="hd"><span class="vx-b purple">Creational</span><b>Singleton</b></div>
          <p>The rating evaluator is one shared instance, not one-per-request. In this prototype that is literally
            <code>const ENGINE = (() =&gt; { … })()</code> — a single object built once. The real service
            registers its equivalent as a Singleton in the .NET DI container for the same reason: the calculator
            itself is stateless per call, so one instance can safely serve every concurrent request. The one thing
            that has to be handled carefully either way is per-quote trace state — this platform's own
            <code>calcLogReset()</code> clears it at the top of every <code>rate()</code> call specifically so one
            shared instance can never leak one quote's trace into the next.</p>
        </div>

        <div class="dp-pat">
          <div class="hd"><span class="vx-b green">Structural / wiring</span><b>Dependency Injection</b></div>
          <p><b style="color:var(--text)">Backend:</b> ASP.NET Core's built-in container injects the Rating
            evaluator, the eligibility checker and the Cosmos repositories into the Underwriting service by
            interface — exactly the seam that lets a test substitute a fake Rating client without touching
            Underwriting's own code, and the same seam the <a href="integration.html#engineContract">engine
            contract</a> depends on staying narrow.<br>
            <b style="color:var(--text)">Frontend:</b> Angular's own DI provides each screen's data service
            (a <code>ProductsService</code>, a <code>QuoteService</code>) the same way — a component asks for
            the service it needs and is handed one; it never constructs an HTTP client itself.</p>
        </div>

        <div class="dp-pat">
          <div class="hd"><span class="vx-b amber">Structural</span><b>Repository</b></div>
          <p>Every Cosmos read/write goes through one typed facade keyed by <code>docType</code>
            (<code>cosmos-model.js</code>), not a client per screen — see
            <a href="integration.html#storageContract">Storage contract</a> in the Integration Guide for the actual
            container list this facade sits in front of. A schema change is a facade change, which is the
            Repository pattern's whole point.</p>
        </div>

        <div class="dp-pat" style="margin-bottom:0">
          <div class="hd"><span class="vx-b blue">Behavioral</span><b>Chain / Pipeline</b></div>
          <p>A quote runs eligibility → factor resolution → fee/tax assembly as ordered, independently
            testable stages — a decline at eligibility halts the chain before rating runs at all (see
            <a href="integration.html#engineContract">the engine contract</a>). <code>quote-portal.html</code>'s
            own calculation walkthrough renders these as the same ordered stages, not a single opaque call.</p>
        </div>

      </div>

    </div>
  </div>

  <div class="row g-3 mt-1">
    <div class="col-lg-6">

      <div class="vx-card vx-anim">
        <h2>Pagination</h2>
        <div class="sub">Client-side, offset-shaped — and one dead pattern still sitting in the code.</div>
        <div style="font-size:12.3px;color:var(--text-dim);line-height:1.7">
          <b style="color:var(--text)">What's actually live:</b> every grid on the platform (<code>vxAgGrid()</code>
          in <code>ag-grid-adapter.js</code>) uses ag-Grid's own client-side pager —
          <code>pagination: true, paginationPageSize</code> — default 10 rows, entirely in the browser.
        </div>
        <div class="vx-exp2 vx-anim mt-3" style="border-left-color:var(--warn);background:rgba(198,137,15,.07)">
          <div class="hd"><i class="fa-solid fa-triangle-exclamation" style="color:var(--warn);font-size:11.5px"></i>
            <b>The offset API exists but is never actually paged</b></div>
          <div class="bd" style="display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
            <p style="margin:0 0 7px;font-size:12.3px;color:var(--text-dim);line-height:1.6">
              <code>grid.js</code>'s simulated REST layer, <code>API.list(key, {page, size})</code>, genuinely
              accepts offset pagination and returns a real paginated envelope (<code>meta.total</code>,
              <code>meta.pages</code>) with simulated network latency. But <code>vxAgGrid()</code> calls it as
              <code>API.list(key, { size: 1000000 })</code> — every row, one shot — and pages the full result
              client-side afterward. The offset contract is real; nothing on this platform actually walks it
              page by page.</p>
            <p style="margin:0;font-size:12.3px;color:var(--text-dim);line-height:1.6">
              <code>grid.js</code> also still contains its own hand-built numbered pager
              (<code>vxGrid()</code> — prev/next, ellipsis-truncated page numbers, full ARIA labelling) from
              before the ag-Grid migration. No page calls it anymore; it's dead code, not a second live pattern.</p>
          </div>
        </div>
        <div style="font-size:12.3px;color:var(--text-dim);line-height:1.7;margin-top:12px">
          <b style="color:var(--text)">Why this doesn't carry over as-is:</b> Cosmos DB has no efficient
          <code>OFFSET n LIMIT m</code> at scale — a real list endpoint pages via <b>continuation tokens</b>, not
          page numbers. The real API's pagination contract is a token you pass back, not a page index; page/size
          here is this prototype's simulated-API convenience, not a pattern to carry into the real service.
        </div>
      </div>

    </div>
    <div class="col-lg-6">

      <div class="vx-card vx-anim">
        <h2>Global search</h2>
        <div class="sub">One in-memory index, one substring scan — no backend call.</div>
        <div style="font-size:12.3px;color:var(--text-dim);line-height:1.7">
          <code>vxSearchIndex()</code> (<code>core.js</code>) builds one flat array combining every reachable
          nav page with a capped sample from each of ~15 data collections — products, coverage lines, states,
          rating factors, quotes, taxes, discounts, surcharges, fees, versions, formulas, counties, territories,
          ZIP codes, industry classes, coverages. Each collection is sliced (e.g. <code>.slice(0, 150)</code>) so
          the index stays a few hundred rows, not the platform's full dataset.
        </div>
        <pre class="dp-code">// core.js — vxSearchInit()
q.oninput = () => {
  _ix = _ix || vxSearchIndex();               // built once, cached
  const hits = _ix.filter(x =>
    x.t.toLowerCase().includes(v) ||           // title
    x.s.toLowerCase().includes(v)              // subtitle
  ).slice(0, 9);
  ...
};</pre>
        <div style="font-size:12.3px;color:var(--text-dim);line-height:1.7;margin-top:12px">
          <b style="color:var(--text)">What it is:</b> a plain case-insensitive substring scan over that cached
          in-memory array, re-run on every keystroke with no debounce — safe only because the index is small
          enough (a few hundred rows) for a linear scan to be instant.
          <br><br>
          <b style="color:var(--text)">What it is not:</b> not a real search index — no tokenization, no
          inverted index, no ranking beyond source order, no fuzzy/typo tolerance, and no backend call (no Azure
          Cognitive Search, no Elasticsearch). It never leaves the browser.
          <br><br>
          <b style="color:var(--text)">Workspace-gated:</b> in the admin workspace the index is just the 3-item
          admin nav — <code>vxSearchIndex()</code> returns before pushing a single data row, so an admin's search
          never surfaces one tenant's quotes or factors while logged out of any tenant.
        </div>
      </div>

    </div>
  </div>`;
</script>
</body>
