<!DOCTYPE html>
<html lang="en" style="background-color:#1A1D23">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings — Administration | VeriDex</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body><div id="vxApp"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cosmos-model.js"></script>
<script src="assets/js/tenant-setup.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/grid.js"></script>
<script src="assets/js/ag-grid-adapter.js"></script>
<script>
vxShell("System Settings", "Global platform settings. || Govern calculation behaviour, versioning, AI features, security and API limits.", [{l:"Administration"},{l:"System Settings"}]);
document.getElementById("vxBody").innerHTML = `<div class="vx-card vx-anim"><div id="grid"></div></div>`;
vxAgGrid({ el:"#grid", key:"settings", name:"Setting",
  size:15,
  cols:[{k:"label",l:"Setting"},{k:"category",l:"Category",r:r=>'<span class="vx-b blue">'+r.category+'</span>'},
      {k:"value",l:"Value",r:r=>'<b>'+r.value+'</b>'},{k:"key",l:"Config Key",r:r=>'<code style="font-size:11.5px">'+r.key+'</code>'}],
  form:[{k:"label",l:"Setting Label"},{k:"key",l:"Config Key"},
      {k:"category",l:"Category",t:"select",opts:["Localization","Calculation","Versioning","AI","Compliance","Security","API","General"]},
      {k:"value",l:"Value"}],
  filters:[{k:"category",l:"Category",opts:["Localization","Calculation","Versioning","AI","Compliance","Security","API","General"]}] });

</script>
</body>
</html>
