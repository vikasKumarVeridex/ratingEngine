vxShell("Rating Versions", "Each version is a complete rating engine for a product. || Carries its effective window, rate lock date, attached formulas, and exactly which factors were added, changed or removed.",

   <button class="btn btn-outline-secondary btn-sm" id="dupVerBtn"><i class="fa-solid fa-copy me-1"></i>Duplicate Version</button>

/* Create Next Version — the common case (copy what's live, bump the label,
   start editing) as one action instead of clone-then-rename-then-reset. */
/* Versions are partitioned on /tenantId, so reading VX.versions raw lists
   other tenants' rows — which is where the duplicate/stale entries in this
   dialog came from. Everything below goes through here. */
function tenantVersions(product) {
  const tid = (typeof COSMOS !== "undefined") ? COSMOS.tenantId() : null;
  return VX.versions.filter(v => (tid == null || v.tenantId == null || v.tenantId === tid)
    && (!product || v.product === product));
}
function tenantVersionProducts() {
  return [...new Set(tenantVersions().map(v => v.product))];
}

function nextVersionLabel(product) {
  const vers = tenantVersions(product).map(v => v.version);
  // Labels are vYYYY.MM — bump the month off the highest one on file.
  const parsed = vers.map(v => /^v(\d{4})\.(\d{2})/.exec(v)).filter(Boolean)
    .map(m => ({ y: +m[1], m: +m[2] })).sort((a, b) => (b.y - a.y) || (b.m - a.m))[0];
  if (!parsed) return "v" + new Date().toISOString().slice(0, 7).replace("-", ".");
  const next = parsed.m === 12 ? { y: parsed.y + 1, m: 1 } : { y: parsed.y, m: parsed.m + 1 };
  return `v${next.y}.${String(next.m).padStart(2, "0")}`;
}

function createNextVersion() {
  const products = tenantVersionProducts();
  if (!products.length) {
    vxModal("Create Next Version",
      `<div class="vx-empty" style="padding:20px"><i class="fa-solid fa-code-branch"></i>
        ${vxTenant().name} has no rating versions yet. Add a product in
        <a href="products.html">Products</a> first — a version belongs to one.</div>`,
      [{ t: "Close", c: "secondary" }]);
    return;
  }
  vxModal("Create Next Version", `
    <label>Product</label>
    <select class="form-select form-select-sm mb-3" id="nvProd">${products.map(p => `<option>${p}</option>`).join("")}</select>
    <div class="row g-3">
      <div class="col-md-6"><label>Copy configuration from</label>
        <select class="form-select form-select-sm" id="nvFrom"></select></div>
      <div class="col-md-6"><label>New version label</label>
        <input class="form-control form-control-sm" id="nvLabel"></div>
      <div class="col-md-6"><label>Effective start</label>
        <input type="date" class="form-control form-control-sm" id="nvStart"></div>
      <div class="col-md-6"><label class="d-block">Carry over attached formulas</label>
        <div class="form-check form-switch"><input class="form-check-input" type="checkbox" id="nvFormulas" checked></div></div>
    </div>
    <div id="nvSummary"></div>`,
    [{ t: "Cancel", c: "secondary" }, { t: "Create Draft", c: "primary", fn: () => {
      const src = tenantVersions().find(v => v.id == document.getElementById("nvFrom").value);
      if (!src) return;
      const label = document.getElementById("nvLabel").value.trim() || nextVersionLabel(src.product);
      const start = document.getElementById("nvStart").value;
      const carry = document.getElementById("nvFormulas").checked;
      if (tenantVersions(src.product).some(v => v.version === label)) {
        vxToast("Label already used", `${src.product} already has a ${label}`, "warn");
        return false;   // keep the dialog open
      }
      const srcFormulas = attachedFormulas(src);
      API.clone("versions", src.id).then(r => {
        const nv = r.data;
        nv.version = label; nv.status = "Draft";
        nv.effectiveStart = start || ""; nv.effectiveEnd = "";
        nv.quotesRated = 0;
        nv.rateLockDate = "";           // re-locked when this version is published
        nv.createdOn = new Date().toISOString().slice(0, 10);
        nv.createdBy = "vikas.kumar@veridex.io";
        /* Formulas attach to a (product, version) PAIR held on each formula,
           not on the version document — so cloning the version alone carried
           none of them across, despite this dialog promising it did. Copy the
           attachments explicitly. */
        let carried = 0;
        if (carry) {
          srcFormulas.forEach(f => {
            f.attachments = f.attachments || [];
            if (!f.attachments.some(a => a.product === nv.product && a.ratingVersion === label)) {
              f.attachments.push({ product: nv.product, ratingVersion: label });
              carried++;
            }
          });
          localStorage.setItem("vxSavedFormulas", JSON.stringify(VX.savedFormulas));
        }
        localStorage.setItem("vxVersionsState", JSON.stringify(VX.versions));
        vxToast("Draft created",
          `${label} for ${nv.product}, copied from ${src.version}` + (carried ? ` · ${carried} formula(s) carried over` : ""), "ok");
        vxAutoSave(); grid.reload();
      });
    }}]);

  /* Show what will actually be copied, so the dialog states facts about the
     selected source rather than a generic promise. */
  const summarise = src => {
    const el = document.getElementById("nvSummary");
    if (!el) return;
    const fs = src ? attachedFormulas(src) : [];
    const untested = fs.filter(f => !f.tested).length;
    el.innerHTML = `<div class="vx-ai mt-3" style="font-size:12.3px"><i class="fa-solid fa-circle-info me-1"></i>
      Creates a <b>Draft</b> copied from <b>${src ? src.version : "—"}</b> (${src ? src.status : "—"}) —
      ${src ? src.factorCount : 0} factors and
      ${fs.length ? `<b>${fs.length}</b> attached formula${fs.length === 1 ? "" : "s"}${untested ? ` (${untested} untested)` : ""}`
                  : "no attached formulas"}.
      A Draft rates nothing until you publish it.</div>`;
  };

  const fill = () => {
    const p = document.getElementById("nvProd").value;
    const vers = tenantVersions(p)
      .slice()
      .sort((a, b) => (b.effectiveStart || "").localeCompare(a.effectiveStart || ""));
    document.getElementById("nvFrom").innerHTML = vers.map(v => `<option value="${v.id}">${v.version} · ${v.status}</option>`).join("");
    // Default to copying whatever is actually live for that product
    const live = vers.find(v => v.status === "Published") || vers[0];
    if (live) document.getElementById("nvFrom").value = live.id;
    document.getElementById("nvLabel").value = nextVersionLabel(p);
    summarise(live);
  };
  document.getElementById("nvProd").onchange = fill;
  document.getElementById("nvFrom").onchange = e =>
    summarise(tenantVersions().find(v => v.id == e.target.value));
  fill();
}

function compareVersionsPicker() {
  const products = tenantVersionProducts();
  const verOpts = p => tenantVersions(p).slice()
    .sort((a, b) => b.effectiveStart.localeCompare(a.effectiveStart))
    .map(v => `<option value="${v.id}">${v.version} (${v.status})</option>`).join("");

  vxModal("Compare Versions", `
    <label>Product</label>
    <select class="form-select form-select-sm mb-3" id="cmpProd">${products.map(p => `<option>${p}</option>`).join("")}</select>
    <div class="row g-3">
      <div class="col-md-6"><label>Version A (older)</label><select class="form-select form-select-sm" id="cmpA"></select></div>
      <div class="col-md-6"><label>Version B (newer)</label><select class="form-select form-select-sm" id="cmpB"></select></div>
    </div>`,
    [{ t: "Cancel", c: "secondary" }, { t: "Compare", c: "primary", fn: () => {
      showChanges(document.getElementById("cmpB").value, document.getElementById("cmpA").value);
    }}]);

  const fillVersions = () => {
    const p = document.getElementById("cmpProd").value;
    document.getElementById("cmpA").innerHTML = verOpts(p);
    document.getElementById("cmpB").innerHTML = verOpts(p);
    // default B = newest, A = second-newest, so the common case needs zero extra picks
    const opts = tenantVersions(p).slice().sort((a, b) => b.effectiveStart.localeCompare(a.effectiveStart));
    if (opts[0]) document.getElementById("cmpB").value = opts[0].id;
    if (opts[1]) document.getElementById("cmpA").value = opts[1].id;
  };
  document.getElementById("cmpProd").onchange = fillVersions;
  fillVersions();
}

function duplicateVersionPicker() {

    [{ t: "Cancel", c: "secondary" }, { t: "Duplicate", c: "primary", fn: () => {

}


const TCOL = { Added: "green", Changed: "amber", Removed: "red" };

/* Version lifecycle — one shared map so the grid, the engine modal and the
   publish flow can never drift apart on what a status looks like. */
const VVER_STATUS = {

  Archived:  { c: "gray",  i: "fa-box-archive",    d: "Deliberately retired — kept for audit only" },
};
const VVER_ORDER = ["Draft", "Scheduled", "Published", "Expired", "Archived"];
function verStatusChip(s) {

document.getElementById("vxBody").innerHTML = `
  <div class="vx-exp2 vx-anim" id="expVer">
    <div class="hd"><i class="fa-solid fa-lock" style="color:var(--primary);font-size:11.5px"></i><b>Rate lock</b><span>Effective date picks the version; the lock date holds a quote at the prior one.</span><button type="button" class="tog" onclick="vxExpToggle('expVer')">Why?</button></div>
    <div class="bd">
      <p><b>Effective date</b> decides which version rates a transaction — endorsements and renewals use the version whose window contains the transaction date.</p>
      <p><b>Rate lock date</b> is the cut-off before which a quote is honoured at the <i>prior</i> version's rates. A quote issued before the lock date keeps its rates for the lock period even if a new version goes effective in the meantime.</p>
      <p><b>Readiness</b> tracks whether every formula attached to a Draft version has been run through Evaluate Formula in the Formula Builder. Publishing with untested formulas attached requires an explicit override.</p>
    </div>
  </div>
  <div class="vx-card vx-anim"><div id="grid"></div></div>`;

function attachedFormulas(r) { return (VX.savedFormulas || []).filter(f => (f.attachments || []).some(a => a.product === r.product && a.ratingVersion === r.version)); }

function formulasCell(r) {
  const n = attachedFormulas(r).length;
  return n ? `<span class="vx-b blue">${n} formula${n === 1 ? "" : "s"}</span>` : '<span class="vx-b gray">none attached</span>';
}

/* Manage this version's formula attachments from the version side.
   A formula belongs to a rating version, so the relationship has to be
   editable from both ends — the Formula Builder attaches a formula to
   versions, and this attaches versions' formulas here. Same
   VX.savedFormulas[].attachments records either way; nothing new is stored. */
function manageFormulas(r) {
  const eligible = (VX.savedFormulas || []).filter(f => f.lob === r.lob);
  if (!eligible.length) {
    vxModal(`Formulas — ${r.version}`,
      `<div class="vx-empty" style="padding:18px"><i class="fa-solid fa-square-root-variable"></i>
        No formulas exist for ${r.lob} yet. Build one in <a href="formula-builder.html">Formulas</a> first.</div>`,
      [{ t: "Close", c: "secondary" }]);
    return;
  }
  const isOn = f => (f.attachments || []).some(a => a.product === r.product && a.ratingVersion === r.version);
  vxModal(`Formulas attached to ${r.version}`, `
    <div style="font-size:12.3px;color:var(--text-dim);margin-bottom:10px">
      <b>${r.product}</b> · ${r.lob} · <span class="vx-b ${r.status === "Published" ? "green" : "amber"}">${r.status}</span><br>
      Tick every formula this rating version should execute. Only ${r.lob} formulas are listed — a formula rates one line of business.
    </div>
    <div style="max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:10px 12px">
      ${eligible.map(f => `<div class="form-check">
        <input class="form-check-input MF" type="checkbox" id="mf${f.id}" data-fid="${f.id}" ${isOn(f) ? "checked" : ""}>
        <label class="form-check-label" for="mf${f.id}" style="font-size:12.5px">${f.name}
          <span class="vx-b ${f.scope === "Account" ? "purple" : "cyan"}">${f.scope === "Account" ? "Account level" : f.cob}</span>
          ${f.tested ? '<span class="vx-b green">tested</span>' : '<span class="vx-b amber">untested</span>'}</label>
      </div>`).join("")}
    </div>`,
    [{ t: "Cancel", c: "secondary" }, { t: "Save Attachments", c: "primary", fn: () => {
      document.querySelectorAll(".MF").forEach(cb => {
        const f = VX.savedFormulas.find(x => x.id == cb.dataset.fid);
        if (!f) return;
        f.attachments = f.attachments || [];
        const at = a => a.product === r.product && a.ratingVersion === r.version;
        if (cb.checked && !f.attachments.some(at)) f.attachments.push({ product: r.product, ratingVersion: r.version });
        if (!cb.checked) f.attachments = f.attachments.filter(a => !at(a));
      });
      localStorage.setItem("vxSavedFormulas", JSON.stringify(VX.savedFormulas));
      const n = attachedFormulas(r).length;
      vxToast("Attachments saved", `${r.version} now runs ${n} formula${n === 1 ? "" : "s"}`, "ok");
      vxAutoSave(); grid.reload();
    }}]);
}

/* Formulas selectable for a version, scoped to that product's line of
   business — a formula rates one LOB, so offering the rest would let an
   admin attach maths that can never fire. Labelled with scope and tested
   state, because publishing a version carrying untested formulas is exactly
   what readinessCell warns about. */
function lobOfProduct(productName) {
  const p = VX.products.find(x => x.name === productName);
  return p ? p.lob : null;
}
function formulaOpts(cur) {
  const lob = (cur && cur.lob) || lobOfProduct(cur && cur.product);
  if (!lob) return [];
  return (VX.savedFormulas || []).filter(f => f.lob === lob).map(f => ({
    value: f.id,
    label: `${f.name} — ${f.scope === "Account" ? "Account level" : f.cob}` +
           (f.tested ? " · tested" : " · untested"),
  }));
}

/* Write the form's selection back onto the formulas themselves. The version
   record never stores `_formulas`; it is a view of the other side of the
   relationship, so persisting it means adding/removing this (product,
   version) pair on each formula's attachments — the identical shape
   manageFormulas() and the Formula Builder both write. */
function saveFormulaAttachments(rec) {
  const chosen = (rec._formulas || []).map(String);
  const lob = rec.lob || lobOfProduct(rec.product);
  (VX.savedFormulas || []).filter(f => f.lob === lob).forEach(f => {
    f.attachments = f.attachments || [];
    const at = a => a.product === rec.product && a.ratingVersion === rec.version;
    const want = chosen.includes(String(f.id));
    if (want && !f.attachments.some(at)) f.attachments.push({ product: rec.product, ratingVersion: rec.version });
    if (!want) f.attachments = f.attachments.filter(a => !at(a));
  });
  localStorage.setItem("vxSavedFormulas", JSON.stringify(VX.savedFormulas));
  /* `_formulas` is a view of the other side of the relationship, not a field
     of the version document — strip it from both the form object and the
     stored row. API.update merges into a NEW object, so deleting it here
     only is not enough. */
  delete rec._formulas;
  const stored = VX.versions.find(v => v.id === rec.id);
  if (stored) delete stored._formulas;
  localStorage.setItem("vxVersionsState", JSON.stringify(VX.versions));
}

function readinessCell(r) {
  if (r.status !== "Draft") return '<span style="color:var(--text-mute);font-size:11.5px">—</span>';
  const attached = attachedFormulas(r);
  if (!attached.length) return '<span class="vx-b gray"><i class="fa-solid fa-minus me-1"></i>No formulas attached</span>';
  const untested = attached.filter(f => !f.tested);
  return untested.length
    ? `<span class="vx-b amber"><i class="fa-solid fa-triangle-exclamation me-1"></i>${untested.length} untested</span>`
    : `<span class="vx-b green"><i class="fa-solid fa-circle-check me-1"></i>Ready to publish</span>`;
}

/* ==========================================================================
   Post-Rating Workflow Coverage — an honest map of ams-service's real,
   full quote lifecycle (its urls.py: save-and-getpremium through
   post-invoice-processor) against what THIS platform actually implements
   downstream of a calculated premium. Same idea as Rate Tables' "Rating
   Coverage" tab (full/partial/none against tracked rating tables) — this is
   that same discipline applied to the WORKFLOW rather than the rate data.
   Grouped by real ams-service endpoint, not restated as prose, so a gap
   here points at an exact real capability, not a vague claim. Identical
   across every version/LOB today (none of them go past a calculated quote
   yet) — shown per version via "View Rating Engine" because that's where
   an admin is already asking "what does this engine actually do." ========================================================================== */

    endpoints: "get-newrater-dropdown-data, get-deductible-amount, get-business-subtype, get-voilationslist, get-miles-driven, get-highest-ratingclass-and-naics, get-available-radius-use, get-all-commodities, get-stated-value",
    note: "The option lists and lookups behind the sandbox quote form's fields." },

/* Account-Level Factor — the eight predefined credit/debit questions that
   combine into ONE policy-level multiplier, clamped to the program band.
   This is part of the real engine's definition, not a per-quote answer, so
   it belongs on the rating engine alongside the calculation flow. Every
   range below is computed from the real tables (D.truckAcct*) rather than
   typed, so it can't drift from what the engine applies. Neither candidate
   model (Model A / Model B) has an equivalent concept — this section is
   about the real formula only.
   Commercial Trucking only — no other line on this platform has an
   equivalent policy-level factor. */
function acctFactorSection(rec) {
  if (rec.lob !== "Commercial Trucking") return "";
  const pct = v => `${v > 0 ? "+" : ""}${(v * 100).toFixed(0)}%`;
  const span = arr => {
    const f = arr.map(x => x.factor).filter(v => typeof v === "number");
    if (!f.length) return "—";
    const lo = Math.min(...f), hi = Math.max(...f);
    return lo === hi ? pct(lo) : `${pct(lo)} … ${pct(hi)}`;
  };
  const L = VX.truckAcctLicState;
  const min = (VX.programParams.find(p => p.param === "Account Factor Min") || {}).value;
  const max = (VX.programParams.find(p => p.param === "Account Factor Max") || {}).value;

  const rows = [
    ["ICC Filing", "Requires ICC filing?", span(Object.entries(VX.truckAcctICC).map(([, factor]) => ({ factor }))), "Table61"],
    ["FMCSA / Carrier Safety", "Safety rating + open FMCSA alerts", span(VX.truckAcctCarrierSafety), "Table52"],
    ["Renewal Discount", "Renewal AND eligible", span(Object.entries(VX.truckAcctRenewal).map(([, factor]) => ({ factor }))), "Table15"],
    ["AL Loss Frequency", "3yr loss frequency × fleet size", span(VX.truckAcctLossFreq), "Table59"],
    ["OOS — Vehicles", "Vehicle out-of-service rate", span(VX.truckAcctOOS.vehicles), "Table56"],
    ["OOS — Drivers", "Driver out-of-service rate", span(VX.truckAcctOOS.drivers), "Table56"],
    ["Business Years", "Years in business (New Venture … 7+)", span(VX.truckAcctBizExp), "Table60"],
    ["Driver Licence State", "Foreign licence, or NY concentration", `${pct(0)} … ${pct(L.foreign)}`, "Insured!Z14"],
  ];

  return `
    <h6 style="font-size:12.5px;font-weight:700;margin:16px 0 8px">
      <i class="fa-solid fa-user-check me-1"></i>Account-Level Factor
      <span class="vx-b gray">predefined</span></h6>
    <div class="vx-exp2 mb-2" id="expAcct">
      <div class="hd"><i class="fa-solid fa-sliders" style="color:var(--primary);font-size:11.5px"></i><b>Account factor</b><span><code>1 + Σ credits/debits</code>, clamped to <b>${min}–${max}</b>, applied per vehicle.</span><button type="button" class="tog" onclick="vxExpToggle('expAcct')">Why?</button></div>
      <div class="bd"><p>Eight underwriting answers are summed into a single policy-level multiplier and applied inside the liability and physical-damage chains — not once at the end.</p>
      <p>A <b>New Venture</b> floors the safety, out-of-service and loss-frequency lines at 0%: an unproven account can be debited by them but never credited.</p></div>
    </div>
    <div class="vx-tw"><table class="vx-t">
      <thead><tr><th>Component</th><th>Driven by</th><th style="text-align:right">Range</th><th>Source</th></tr></thead>
      <tbody>${rows.map(([n, d, r, s]) => `<tr>
        <td><b>${n}</b></td>
        <td style="font-size:12px;color:var(--text-dim)">${d}</td>
        <td style="text-align:right;font-variant-numeric:tabular-nums">${r}</td>
        <td><code style="font-size:10.6px">${s}</code></td></tr>`).join("")}
        <tr style="background:var(--surface-2)">
          <td colspan="2"><b>Clamped account factor</b></td>
          <td style="text-align:right"><b>${min}× … ${max}×</b></td>
          <td><code style="font-size:10.6px">Insured!Z15</code></td></tr>
      </tbody></table></div>`;
}

function publishVersion(rec) {
  if (rec.status === "Published") { vxToast("Already live", rec.version + " is already the published rating engine for " + rec.product, "info"); return; }
  if (rec.status === "Expired" || rec.status === "Archived") {
    vxToast(`Can't publish an ${rec.status.toLowerCase()} version`, "Duplicate it into a new draft first", "err"); return;
  }
  const attached = attachedFormulas(rec);
  const untested = attached.filter(f => !f.tested);

  const doPublish = () => {
    const today = new Date().toISOString().slice(0, 10);
    // Tenant-scoped: publishing must only retire THIS tenant's prior live
    // version. Unscoped, it expired every tenant's version of the same
    // product name — the clone pass gives several tenants the same names.
    tenantVersions(rec.product).filter(v => v.status === "Published")
      .forEach(v => { v.status = "Expired"; v.effectiveEnd = today; });
    // A future effective date means Scheduled, not live yet — publishing
    // shouldn't claim a version is rating business before its start date.
    const startsInFuture = rec.effectiveStart && rec.effectiveStart > today;
    rec.status = startsInFuture ? "Scheduled" : "Published";
    if (!rec.effectiveStart) rec.effectiveStart = today;
    rec.effectiveEnd = "";
    // Formula status is a separate lifecycle from version status — engine.js
    // matches savedFormulas on status === "Active", so this must stay "Active".
    attached.forEach(f => f.status = "Active");
    const prod = VX.products.find(p => p.name === rec.product);
    if (prod && !startsInFuture) { prod.version = rec.version; prod.status = "Active"; prod.updated = today; }
    localStorage.setItem("vxVersionsState", JSON.stringify(VX.versions));
    localStorage.setItem("vxSavedFormulas", JSON.stringify(VX.savedFormulas));
    localStorage.setItem("vxProductsState", JSON.stringify(VX.products));
    vxToast(startsInFuture ? "Scheduled" : "Published",
      startsInFuture
        ? `${rec.version} goes live for ${rec.product} on ${rec.effectiveStart}`
        : `${rec.version} is now the published rating engine for ${rec.product}`, "ok");
    grid.reload();
  };

  if (untested.length) {
    vxModal(`Publish ${rec.version} for ${rec.product}?`,
      `<div style="display:flex;gap:14px;align-items:flex-start">
        <div style="width:40px;height:40px;border-radius:10px;flex:none;display:grid;place-items:center;background:rgba(210,69,69,.12);color:var(--bad)">
          <i class="fa-solid fa-triangle-exclamation"></i></div>
        <div style="font-size:13.5px;line-height:1.6">
          This retires the current Active version and makes <b>${rec.version}</b> the rating engine used for all new policies on <b>${rec.product}</b>,
          carrying ${attached.length} formula${attached.length === 1 ? "" : "s"} into production —
          <b>${untested.length}</b> of them untested: ${untested.map(f => `<b>${f.name}</b>`).join(", ")}
          ${untested.length === 1 ? "hasn't" : "haven't"} been run through Evaluate Formula in the Formula Builder.
          <div style="margin-top:8px"><a href="formula-builder.html">Go test ${untested.length === 1 ? "it" : "them"} first →</a></div>
        </div></div>`,
      [{ t: "Cancel", c: "secondary" }, { t: "Publish Anyway", c: "danger", fn: doPublish }], "modal-md");
    return;
  }

  vxConfirm(`Publish ${rec.version} for ${rec.product}?`,
    `This retires the current Active version and makes <b>${rec.version}</b> the rating engine used for all new policies on <b>${rec.product}</b>.` +
    (attached.length
      ? ` It carries <b>${attached.length}</b> tested formula${attached.length === 1 ? "" : "s"} into production.`
      : ` No formulas are attached to this version yet — attach some from the Formula Builder before publishing if this line rates on formulas.`),
    doPublish);
}

/* What Changed drawer replaces the generic history modal for versions —
   wired via vxAgGrid's onHist hook above, not a DOM click-interception hack. */
function showChanges(id, pickedOlderId) {
  const v = VX.versions.find(x => x.id == id);
  if (!v) return;
  const realPrior = tenantVersions(v.product).filter(x => x.id !== v.id)
    .sort((a, b) => b.effectiveStart.localeCompare(a.effectiveStart))
    .find(x => x.effectiveStart < v.effectiveStart);
  const pickedOlder = pickedOlderId != null ? VX.versions.find(x => x.id == pickedOlderId) : null;
  // Change tracking only stores a diff of a version against the one immediately
  // before it — if the admin picked a non-adjacent pair, be honest about that
  // instead of fabricating a diff, and fall back to the real adjacent pair.
  const mismatch = pickedOlder && realPrior && pickedOlder.id !== realPrior.id;
  const prior = realPrior;

  const rows = t => v.changes.filter(c => c.type === t);
  const sec = (t, icon) => {
    const list = rows(t);
    if (!list.length) return "";
    return `<h6 style="font-size:12.3px;font-weight:700;margin:14px 0 7px;display:flex;align-items:center;gap:7px">
        <span class="vx-b ${TCOL[t]}"><i class="fa-solid ${icon} me-1"></i>${t}</span>
        <span style="color:var(--text-mute);font-weight:500">${list.length} factor${list.length>1?"s":""}</span></h6>
      <div class="vx-tw"><table class="vx-t">
        <thead><tr><th>Factor</th><th>Category</th><th>From</th><th>To</th><th>Why</th></tr></thead>
        <tbody>${list.map(c => `<tr>
          <td><b>${c.factor}</b></td>
          <td><span class="vx-b gray">${c.category}</span></td>
          <td style="color:var(--text-mute)">${c.from}</td>
          <td style="font-weight:650;color:${t==="Added"?"var(--good)":t==="Removed"?"var(--bad)":"var(--primary)"}">${c.to}</td>
          <td style="font-size:12px;color:var(--text-dim)">${c.detail}</td></tr>`).join("")}
        </tbody></table></div>`;
  };

  vxModal(`What changed in ${v.version} — ${v.product}`, `
    ${mismatch ? vxNotWiredBanner(`Change tracking only stores a diff of a version against the one immediately before it. <b>${pickedOlder.version}</b> is not ${v.version}'s immediate predecessor — that's <b>${realPrior ? realPrior.version : "none"}</b> — so a direct ${pickedOlder.version} → ${v.version} diff isn't available. Showing ${v.version}'s tracked changes vs its real predecessor below instead.`) : ""}
    <div class="row g-2 mb-2">
      <div class="col-md-3"><div class="vx-stat stack" style="padding:11px 13px"><div>
        <div class="lbl">Effective</div><div style="font-size:14px;font-weight:700;margin-top:3px">${v.effectiveStart || "not set"}</div>
        <div class="dt flat">${v.effectiveEnd || "open-ended"}</div></div></div></div>
      <div class="col-md-3"><div class="vx-stat stack" style="padding:11px 13px"><div>
        <div class="lbl"><i class="fa-solid fa-lock me-1"></i>Rate Lock</div>
        <div style="font-size:14px;font-weight:700;margin-top:3px">${v.rateLockDate || "not set"}</div>
        <div class="dt flat">${v.rateLockDays}-day lock</div></div></div></div>
      <div class="col-md-3"><div class="vx-stat stack" style="padding:11px 13px"><div>
        <div class="lbl">Rate Impact</div>
        <div style="font-size:14px;font-weight:700;margin-top:3px;color:${v.rateImpact>0?"var(--bad)":"var(--good)"}">${v.rateImpact>0?"+":""}${v.rateImpact.toFixed(1)}%</div>
        <div class="dt flat">avg premium</div></div></div></div>
      <div class="col-md-3"><div class="vx-stat stack" style="padding:11px 13px"><div>
        <div class="lbl">Quotes Rated</div><div style="font-size:14px;font-weight:700;margin-top:3px">${vxNum(v.quotesRated)}</div>
        <div class="dt flat">on this version</div></div></div></div>
    </div>

    <div class="vx-ai" style="padding:10px 13px">
      <b>${v.version}</b> supersedes <b>${prior ? prior.version : "— (first version)"}</b>.
      It contains <b>${v.factorCount}</b> rating factors in total, of which
      <b>${v.added} were added</b>, <b>${v.changed} were changed</b>${v.removed?` and <b>${v.removed} removed</b>`:""}.
      Quotes issued on or before <b>${v.rateLockDate}</b> stay on ${prior ? prior.version : "the prior version"}'s rates for ${v.rateLockDays} days.
    </div>

    ${sec("Added","fa-plus")}${sec("Changed","fa-pen")}${sec("Removed","fa-minus")}`,
    [{ t: "Close", c: "secondary" },
     { t: "Export Change Log", c: "primary", fn: () => {
        vxCSV(`${v.product.replace(/\s+/g,"-")}-${v.version}-changes`,
          [{k:"type",l:"Type"},{k:"factor",l:"Factor"},{k:"category",l:"Category"},{k:"from",l:"From"},{k:"to",l:"To"},{k:"detail",l:"Reason"}],
          v.changes);
     }}], "modal-xl");
}
</script>
</body>
</html>
