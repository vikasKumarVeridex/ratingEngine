<!DOCTYPE html>
<html lang="en" style="background-color:#1A1D23">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Users — Administration | VeriDex</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
<link href="assets/css/workspace.css" rel="stylesheet">
<script src="assets/js/tooltip-dictionary.js" defer></script>
<script src="assets/js/ui-ux.js" defer></script>
</head>
<body><div id="vxApp"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cosmos-model.js"></script>
<script src="assets/js/tenant-setup.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/grid.js"></script>
<script src="assets/js/ag-grid-adapter.js"></script>
<script>
vxShell("User Management", "Platform users, including AI and API service accounts. || All actions are attributed in the audit log.", [{l:"Administration"},{l:"User Management"}]);
document.getElementById("vxBody").innerHTML = `<div class="vx-card vx-anim"><div id="grid"></div></div>`;
vxAgGrid({ el:"#grid", key:"users", name:"User",
  
  cols:[{k:"name",l:"Name",r:r=>(r.role==="Service Account"?'<i class="fa-solid fa-robot me-1" style="color:var(--purple)"></i>':"")+r.name},
      {k:"email",l:"Email"},{k:"role",l:"Role",r:r=>'<span class="vx-b blue">'+r.role+'</span>'},
      {k:"mfa",l:"MFA",r:r=>'<span class="vx-b '+(r.mfa==="Enabled"?"green":"amber")+'">'+r.mfa+'</span>'},
      {k:"status",l:"Status",r:r=>'<span class="vx-b '+(r.status==="Active"?"green":"red")+'">'+r.status+'</span>'},
      {k:"lastLogin",l:"Last Login"}],
  form:[{k:"name",l:"Full Name"},{k:"email",l:"Email"},{k:"role",l:"Role",t:"select",opts:VX.roles.map(r=>r.name)},
      {k:"mfa",l:"MFA",t:"select",opts:["Enabled","Disabled"]},{k:"status",l:"Status",t:"select",opts:["Active","Suspended"]}],
  filters:[{k:"role",l:"Role",opts:VX.roles.map(r=>r.name)},{k:"status",l:"Status",opts:["Active","Suspended"]}] });

</script>
</body>
</html>
