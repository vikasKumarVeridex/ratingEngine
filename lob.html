<!DOCTYPE html>
<html lang="en" style="background-color:#1A1D23">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lines of Business — Configuration | VeriDex</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body><div id="vxApp"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cosmos-model.js"></script>
<script src="assets/js/tenant-setup.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/grid.js"></script>
<script src="assets/js/ag-grid-adapter.js"></script>
<script>
vxShell("Lines of Business", "Each LOB has its own calculation engine. || Read-only: lines are provisioned per tenant from the enabled lines on the tenant record.", [{l:"Configuration"},{l:"Lines of Business"}]);
document.getElementById("vxBody").innerHTML = `<div class="vx-card vx-anim"><div id="grid"></div></div>`;
vxAgGrid({ el:"#grid", key:"lobs", name:"Line of Business",
  
  cols:[{k:"code",l:"Code",r:r=>'<span class="vx-b blue">'+r.code+'</span>'},{k:"name",l:"Line of Business"},{k:"desc",l:"Description"},
      {k:"sourceSheets",l:"Rating Tables"},{k:"engine",l:"Rating Engine"},{k:"products",l:"Products"},
      {k:"status",l:"Status",r:r=>'<span class="vx-b '+(r.status==="Active"?"green":"amber")+'">'+r.status+'</span>'}],
  form:[{k:"code",l:"Code"},{k:"name",l:"Name"},{k:"desc",l:"Description",t:"textarea"},{k:"engine",l:"Rating Engine"},
      {k:"sourceSheets",l:"Rating Tables",t:"number"},{k:"status",l:"Status",t:"select",opts:["Active","Draft","Retired"]}],
  /* A line of business maps to a calculation engine — it is not something an
     operator adds, edits or removes from a grid. New tenants receive their
     lines through provisionTenant(), copied from the enabled lines on the
     tenant record, so nothing here needs a create path. */
  readOnly:true, noHist:true,
   });

</script>
</body>
</html>
