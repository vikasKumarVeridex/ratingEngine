/* ==========================================================================
   Everything here rolls up from VX.quotes, which is a representative
   PORTFOLIO SAMPLE, not real claims data — this platform (and the source
   trucking workbook) has no historical loss-run feed. The banner below says
   so. Structure and math are real: earned premium and incurred losses are
   summed straight off the quote records, loss ratio = incurred / earned,
   and the "target" compared against is the program's real Target Loss
   Ratio (Trucking 0.60 and Property 0.52 are sourced values; GL/MPL/Cyber
   are labelled illustrative in Rate Tables' own registry).
   ========================================================================== */
const TARGETS = Object.fromEntries(VX.programParams.filter(p => p.param === "Target Loss Ratio").map(p => [p.lob, p]));
const Q = VX.quotes;

/* Rollups can be restricted to one quote status. Loss ratio on BOUND premium
   is the figure that actually matters — mixing in declined and expired
   submissions inflates the denominator with premium never written — so the
   status filter re-runs the rollup rather than filtering the rolled-up rows,
   which would leave the ratios computed off the wrong base. */
/* `f` narrows the underlying QUOTES before the rollup, so loss ratios are
   computed off the filtered base. Filtering rolled-up rows instead would
   leave every ratio calculated against the whole book — e.g. "MGA = Anchor"
   would show Anchor's states but everyone's loss ratio. */
function rollup(groupFn, f) {
  f = f || {};
  const g = {};
  const src = Q.filter(q =>
    (!f.status  || q.status  === f.status) &&
    (!f.state   || q.state   === f.state) &&
    (!f.lob     || q.lob     === f.lob) &&
    (!f.carrier || q.carrier === f.carrier) &&
    (!f.mga     || q.mga     === f.mga) &&
    (!f.broker  || q.broker  === f.broker));
  src.forEach(q => {
    const key = groupFn(q);
    if (!key) return;
    if (!g[key]) g[key] = { key, country: q.country || "US", premium: 0, incurred: 0, claims: 0, quotes: 0, lobs: {} };
    g[key].premium += q.premium; g[key].incurred += q.incurredLosses; g[key].claims += q.claims; g[key].quotes++;
    g[key].lobs[q.lob] = (g[key].lobs[q.lob] || 0) + q.premium;
  });
  return Object.values(g).map(r => {
    const topLob = Object.entries(r.lobs).sort((a, b) => b[1] - a[1])[0][0];
    const target = (TARGETS[topLob] || {}).value ?? 0.55;
    const lr = r.premium ? r.incurred / r.premium : 0;
    return { ...r, topLob, target, lr, gap: lr - target };
  });
}
// State/province view covers both USA and Canada (cross-border trucking
// exposure); County view is USA-only, since D.counties has no Canadian
// equivalent — Canadian quotes simply don't have a county and are excluded
// from that rollup rather than faked.
const byState = rollup(q => q.state).sort((a, b) => b.lr - a.lr);
const byCounty = rollup(q => q.county ? q.county + ", " + q.state : null).sort((a, b) => b.lr - a.lr);
/* Canadian provinces are treated exactly like states here — one combined
   list, no country filter. Rating/taxes elsewhere still assume a US state;
   this dashboard is the only place cross-border exposure is rolled up. */
const LOB_OPTS = [...new Set(byState.map(r => r.topLob))].sort();
const STATUS_OPTS  = [...new Set(Q.map(q => q.status))].filter(Boolean).sort();
const STATE_OPTS   = [...new Set(Q.map(q => q.state))].filter(Boolean).sort();
const CARRIER_OPTS = [...new Set(Q.map(q => q.carrier))].filter(Boolean).sort();
const MGA_OPTS     = [...new Set(Q.map(q => q.mga))].filter(Boolean).sort();
/* Brokers appointed to one MGA — the Broker filter only appears once an MGA
   is chosen, and lists just that wholesaler's retail agencies. */
function brokersFor(mga) {
  return [...new Set(Q.filter(q => !mga || q.mga === mga).map(q => q.broker))].filter(Boolean).sort();
}
/* Paging state per tab — these tables run to 50+ rows and were a single
   scroll box with no sense of how far through you were. */
const PAGE = { st: 1, ct: 1, size: 15 };

/* -------- LOB rollup (real target per LOB, same TARGETS map as the state view) -------- */
const byLob = Object.values(Q.reduce((g, q) => {
  (g[q.lob] = g[q.lob] || { key: q.lob, premium: 0, incurred: 0, claims: 0, quotes: 0 });
  g[q.lob].premium += q.premium; g[q.lob].incurred += q.incurredLosses; g[q.lob].claims += q.claims; g[q.lob].quotes++;
  return g;
}, {})).map(r => {
  const target = (TARGETS[r.key] || {}).value ?? 0.55;
  const lr = r.premium ? r.incurred / r.premium : 0;
  return { ...r, target, lr, gap: lr - target, targetSrc: (TARGETS[r.key] || {}).src || "Illustrative" };
}).sort((a, b) => b.lr - a.lr);

/* -------- Monthly trend, real per-quote effectiveDate bucketed by month --------
   The sample portfolio spans roughly Jun 2025 – Jan 2026 (see data.js's dt()
   helper) — real dates on real records, bucketed here, not a fabricated series. */
const byMonth = Object.values(Q.reduce((g, q) => {
  const m = q.effectiveDate.slice(0, 7);
  (g[m] = g[m] || { key: m, premium: 0, incurred: 0, quotes: 0 });
  g[m].premium += q.premium; g[m].incurred += q.incurredLosses; g[m].quotes++;
  return g;
}, {})).map(r => ({ ...r, lr: r.premium ? r.incurred / r.premium : 0 }))
  .sort((a, b) => a.key.localeCompare(b.key));

const totalPrem = Q.reduce((s, q) => s + q.premium, 0);
const totalInc = Q.reduce((s, q) => s + q.incurredLosses, 0);
const overallLR = totalPrem ? totalInc / totalPrem : 0;
const increaseStates = byState.filter(s => s.gap > 0.08 && s.quotes >= 3);
const decreaseStates = byState.filter(s => s.gap < -0.15 && s.quotes >= 3);

function actionOf(gap) { return gap > 0.08 ? "up" : gap < -0.15 ? "down" : "flat"; }
function lrColor(gap) { return gap > 0.08 ? "var(--bad)" : gap < -0.15 ? "var(--good)" : "var(--warn)"; }
function lrChip(gap) {
  if (gap > 0.08) return `<span class="vx-b red"><i class="fa-solid fa-arrow-trend-up me-1"></i>Increase</span>`;
  if (gap < -0.15) return `<span class="vx-b green"><i class="fa-solid fa-arrow-trend-down me-1"></i>Decrease</span>`;
  return `<span class="vx-b gray">On target</span>`;
}

/* -------- AI rate-action suggestions -------- */
function suggestions() {
  const out = [];
  increaseStates.slice(0, 6).forEach(s => {
    const pct = Math.round(Math.min(s.gap / s.target, 0.35) * 100);
    out.push({ sev: "danger", state: s.key, action: `Increase ${s.topLob} rates ~${pct}%`,
      text: `${s.key}: loss ratio ${(s.lr * 100).toFixed(0)}% vs. ${(s.target * 100).toFixed(0)}% target for ${s.topLob} — ${s.claims} claims across ${s.quotes} quotes, ${vxNum(s.incurred)} incurred.` });
  });
  decreaseStates.slice(0, 4).forEach(s => {
    const pct = Math.round(Math.min(Math.abs(s.gap) / s.target, 0.25) * 100);
    out.push({ sev: "info", state: s.key, action: `Room to decrease ${s.topLob} rates ~${pct}%`,
      text: `${s.key}: loss ratio ${(s.lr * 100).toFixed(0)}% vs. ${(s.target * 100).toFixed(0)}% target for ${s.topLob} — consistently profitable, competitive opportunity.` });
  });
  return out;
}

        <div class="lrbar"><i style="width:${Math.round(Math.abs(r.gap) / maxAbs * 100)}%;background:${lrColor(r.gap)}"></i></div>
        <b style="color:${lrColor(r.gap)}">${(r.lr * 100).toFixed(1)}%</b>

}
/* Shared pager. Renders First/Prev/pages/Next/Last and clamps the current
   page when a filter shrinks the result set under it. */
function renderPager(prefix, total, onGo) {
  const pages = Math.max(1, Math.ceil(total / PAGE.size));
  if (PAGE[prefix] > pages) PAGE[prefix] = pages;
  const cur = PAGE[prefix];
  const from = total ? (cur - 1) * PAGE.size + 1 : 0;
  const to = Math.min(cur * PAGE.size, total);
  document.getElementById(prefix + "Range").textContent =
    total ? `Showing ${from}–${to} of ${total}` : "Nothing to show";
  const btn = (lbl, page, dis, active) =>
    `<button class="btn btn-sm ${active ? "btn-primary" : "btn-outline-secondary"}" ${dis ? "disabled" : ""} data-pg="${page}">${lbl}</button>`;
  // a short window around the current page, so 60 counties don't render 60 buttons
  const win = [];
  const lo = Math.max(1, cur - 2), hi = Math.min(pages, cur + 2);
  for (let i = lo; i <= hi; i++) win.push(btn(i, i, false, i === cur));
  document.getElementById(prefix + "Pager").innerHTML = pages > 1
    ? btn('<i class="fa-solid fa-angles-left"></i>', 1, cur === 1)
      + btn('<i class="fa-solid fa-angle-left"></i>', cur - 1, cur === 1)
      + win.join("")
      + btn('<i class="fa-solid fa-angle-right"></i>', cur + 1, cur === pages)
      + btn('<i class="fa-solid fa-angles-right"></i>', pages, cur === pages)
    : "";
  document.querySelectorAll(`#${prefix}Pager [data-pg]`).forEach(b =>
    b.onclick = () => { PAGE[prefix] = +b.dataset.pg; onGo(); });
}

function filterRows(all, q, lob, act) {
  return all.filter(r =>
    (!q || r.key.toLowerCase().includes(q)) &&
    (!lob || r.topLob === lob) &&
    (!act || actionOf(r.gap) === act));
}

/* Collect the quote-level filters for a tab, and reveal the Broker picker
   only once an MGA is chosen — a broker list spanning every wholesaler is
   not a useful control, and the appointment is what makes it meaningful. */
function chainFilters(pfx) {
  const val = id => { const el = document.getElementById(pfx + id); return el ? el.value : ""; };
  const mga = val("Mga");
  const bEl = document.getElementById(pfx + "Broker");
  if (bEl) {
    const show = !!mga;
    bEl.style.display = show ? "" : "none";
    if (show && bEl.dataset.mga !== mga) {
      bEl.dataset.mga = mga;
      const keep = bEl.value;
      const opts = brokersFor(mga);
      bEl.innerHTML = `<option value="">All brokers under ${mga}</option>`
        + opts.map(b => `<option>${b}</option>`).join("");
      bEl.value = opts.includes(keep) ? keep : "";
    }
    if (!show) { bEl.value = ""; bEl.dataset.mga = ""; }
  }
  return { status: val("Status"), state: val("State"), lob: val("Lob"),
           carrier: val("Carrier"), mga, broker: bEl ? bEl.value : "" };
}
function activeChain(f) {
  return [f.status && f.status + " quotes", f.state, f.lob, f.carrier, f.mga, f.broker]
    .filter(Boolean).join(" · ");
}

function renderState() {
  const q = (document.getElementById("stq").value || "").toLowerCase().trim();
  const act = document.getElementById("stAct").value;
  const f = chainFilters("st");
  // any quote-level filter re-runs the rollup so ratios use the filtered base
  const dirty = f.status || f.state || f.lob || f.carrier || f.mga || f.broker;
  const all = dirty ? rollup(x => x.state, f).sort((a, b) => b.lr - a.lr) : byState;
  const rows = filterRows(all, q, "", act);
  const chain = activeChain(f);
  document.getElementById("stCount").textContent =
    `${rows.length} of ${all.length}` + (chain ? ` · ${chain}` : "");
  renderPager("st", rows.length, renderState);
  const page = rows.slice((PAGE.st - 1) * PAGE.size, PAGE.st * PAGE.size);
  document.getElementById("stBody").innerHTML = page.length ? page.map(r => rowHtml(r)).join("")
    : `<tr><td colspan="7"><div class="vx-empty" style="padding:22px"><i class="fa-solid fa-inbox"></i>
       No states or provinces match these filters.</div></td></tr>`;
}

function renderCounty() {
  const q = (document.getElementById("ctq").value || "").toLowerCase().trim();
  const act = document.getElementById("ctAct").value;
  const f = chainFilters("ct");
  const dirty = f.status || f.state || f.lob || f.carrier || f.mga || f.broker;
  const all = dirty
    ? rollup(x => x.county ? x.county + ", " + x.state : null, f).sort((a, b) => b.lr - a.lr)
    : byCounty;
  const rows = filterRows(all, q, "", act);
  const chain = activeChain(f);
  document.getElementById("ctCount").textContent =
    `${rows.length} of ${all.length}` + (chain ? ` · ${chain}` : "");
  renderPager("ct", rows.length, renderCounty);
  const page = rows.slice((PAGE.ct - 1) * PAGE.size, PAGE.ct * PAGE.size);
  document.getElementById("ctBody").innerHTML = page.length ? page.map(r => rowHtml(r)).join("")
    : `<tr><td colspan="7"><div class="vx-empty" style="padding:22px"><i class="fa-solid fa-inbox"></i>
       No counties match these filters.</div></td></tr>`;
}

function renderChanges(q) {
  q = (q || "").toLowerCase().trim();
  const stateByAbv = Object.fromEntries(byState.map(s => [s.key, s]));
  const addressedStates = new Set(VX.factorChangeLog.map(c => c.state));
  const rows = VX.factorChangeLog.filter(c => !q || [c.factorName, c.factorCode, c.user, c.state, c.reason].join(" ").toLowerCase().includes(q));
  document.getElementById("fcCount").textContent = `${rows.length} of ${VX.factorChangeLog.length}`;
  document.getElementById("fcBody").innerHTML = rows.length ? rows.map(c => {
    const st = stateByAbv[c.state];
    const overTarget = st && st.gap > 0.08;
    return `<tr>
      <td style="font-size:11.3px;white-space:nowrap">${c.timestamp}</td>
      <td style="font-size:11.8px">${c.user.replace("@veridex.io", "")}</td>
      <td><b style="font-size:12.3px">${c.factorName}</b><div style="font-size:10.5px;color:var(--text-mute)">${c.lob} · <code style="font-size:9.5px">${c.factorCode}</code></div></td>
      <td>${c.state}</td>
      <td style="text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums">${c.from} → ${c.to} <span style="color:${c.pctChange > 0 ? "var(--bad)" : "var(--good)"};font-size:11px">(${c.pctChange > 0 ? "+" : ""}${c.pctChange}%)</span></td>
      <td style="font-size:11.5px">${c.reason}</td>
      <td>${overTarget ? '<span class="vx-b amber">Still over target</span>' : (st ? '<span class="vx-b green">Resolved</span>' : '<span class="vx-b gray">—</span>')}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="7" style="text-align:center;color:var(--text-mute);padding:20px">No changes match "${q}".</td></tr>`;
}

/* Filter wiring — every control on a tab re-renders that tab's table, and
   resets it to page 1: staying on page 4 of a freshly-filtered 12-row result
   would show an empty table. */
["stq","stLob","stAct","stStatus","stCarrier","stMga","stBroker"].forEach(id => {
  const el = document.getElementById(id);
  el[id === "stq" ? "oninput" : "onchange"] = () => { PAGE.st = 1; renderState(); };
});
document.getElementById("stClr").onclick = () => {
  ["stq","stLob","stAct","stStatus","stCarrier","stMga","stBroker"].forEach(id => { const e=document.getElementById(id); if(e) e.value=""; });
  PAGE.st = 1; renderState();
};
["ctq","ctLob","ctAct","ctStatus","ctState","ctCarrier","ctMga","ctBroker"].forEach(id => {
  const el = document.getElementById(id);
  el[id === "ctq" ? "oninput" : "onchange"] = () => { PAGE.ct = 1; renderCounty(); };
});
document.getElementById("ctClr").onclick = () => {
  ["ctq","ctLob","ctAct","ctStatus","ctState","ctCarrier","ctMga","ctBroker"].forEach(id => { const e=document.getElementById(id); if(e) e.value=""; });
  PAGE.ct = 1; renderCounty();
};
document.getElementById("fcq").oninput = e => renderChanges(e.target.value);

function toggleSugg() {
  const b = document.getElementById("aiSugg"), c = document.getElementById("suggChev");
  const open = b.style.display !== "none";
  b.style.display = open ? "none" : "block";
  c.style.transform = open ? "" : "rotate(180deg)";
}

renderState(); renderCounty(); renderChanges("");

/* -------- charts -------- */
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
let charts = [];
function drawCharts() {
  charts.forEach(c => c.destroy()); charts = [];
  const grid = css("--border"), txt = css("--text-dim");
  vxChartDefaults();
  const bad = css("--bad"), good = css("--good"), warn = css("--warn"), primary = css("--primary"), accent = css("--accent");
  // lrColor() returns a literal "var(--x)" string, valid as an inline HTML
  // style but not as a Canvas fillStyle (Chart.js draws to canvas, which
  // can't parse CSS var() syntax) — resolve to the actual color here.
  const lrColorResolved = gap => gap > 0.08 ? bad : gap < -0.15 ? good : warn;

  const monthLabel = m => new Date(m + "-01").toLocaleDateString("en-US", { month: "short", year: "2-digit" });
  charts.push(new Chart(document.getElementById("cTrend"), {
    data: { labels: byMonth.map(m => monthLabel(m.key)), datasets: [
      { type: "bar", label: "Earned Premium", data: byMonth.map(m => m.premium), backgroundColor: primary, borderRadius: 4, barPercentage: .6, yAxisID: "y" },
      { type: "bar", label: "Incurred Losses", data: byMonth.map(m => m.incurred), backgroundColor: accent, borderRadius: 4, barPercentage: .6, yAxisID: "y" },
      { type: "line", label: "Loss Ratio", data: byMonth.map(m => m.lr * 100), borderColor: bad, backgroundColor: "transparent",
        borderWidth: 2, tension: .3, pointRadius: 3, pointBackgroundColor: bad, yAxisID: "y1" },
    ]},
    options: { responsive: true, interaction: { mode: "index", intersect: false },
      plugins: { legend: { position: "bottom", labels: { usePointStyle: true, pointStyle: "circle", boxWidth: 7, padding: 14 } },
        tooltip: { callbacks: { label: ctx => ctx.dataset.yAxisID === "y1" ? ` ${ctx.dataset.label}: ${ctx.raw.toFixed(1)}%` : ` ${ctx.dataset.label}: ${vxMoney(ctx.raw)}` } } },
      scales: {
        x: { grid: { display: false } },
        y: { grid: { color: grid }, border: { display: false }, ticks: { callback: v => "$" + vxNum(v) } },
        y1: { position: "right", grid: { display: false }, border: { display: false }, ticks: { callback: v => v + "%" } },
      } } }));

  charts.push(new Chart(document.getElementById("cLob"), {
    type: "bar", data: { labels: byLob.map(r => r.key.replace(" (MPL)", "")), datasets: [
      { label: "Loss Ratio", data: byLob.map(r => +(r.lr * 100).toFixed(1)), backgroundColor: byLob.map(r => lrColorResolved(r.gap)), borderRadius: 4, barPercentage: .55 },
      { label: "Target", data: byLob.map(r => +(r.target * 100).toFixed(1)), backgroundColor: css("--text-mute"), borderRadius: 4, barPercentage: .55 },
    ]},
    options: { indexAxis: "y", responsive: true,
      plugins: { legend: { position: "bottom", labels: { usePointStyle: true, pointStyle: "circle", boxWidth: 7, padding: 14 } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${ctx.raw}%` } } },
      scales: { x: { grid: { color: grid }, border: { display: false }, ticks: { callback: v => v + "%" } }, y: { grid: { display: false } } } } }));

  const movers = [...byState].sort((a, b) => Math.abs(b.gap) - Math.abs(a.gap)).slice(0, 10).sort((a, b) => a.gap - b.gap);
  charts.push(new Chart(document.getElementById("cGap"), {
    type: "bar", data: { labels: movers.map(m => m.key),
      datasets: [{ label: "Loss ratio gap vs target", data: movers.map(m => +(m.gap * 100).toFixed(1)),
        backgroundColor: movers.map(m => lrColorResolved(m.gap)), borderRadius: 4, barPercentage: .65 }] },
    options: { indexAxis: "y", responsive: true, plugins: { legend: { display: false },
        tooltip: { callbacks: { label: ctx => ` ${ctx.raw > 0 ? "+" : ""}${ctx.raw}pt vs target` } } },
      scales: { x: { grid: { color: grid }, border: { display: false }, ticks: { callback: v => (v > 0 ? "+" : "") + v + "pt" } }, y: { grid: { display: false } } } } }));
}
drawCharts();
document.addEventListener("vx-theme", drawCharts);

/* ---------------------------------------------------------------------------
   Page-level scope.

   These same filters already existed per-tab, but only inside the State table,
   which sits below two charts - out of sight, and scoping only that one table
   while the headline loss ratio above it still showed the whole book. The bar
   at the top now owns scope: it recomputes the headline cards and mirrors its
   values down into both tabs, so the page can never show a filtered table
   under an unfiltered headline.
   --------------------------------------------------------------------------- */
function pageScope() {
  const v = id => { const el = document.getElementById(id); return el ? el.value : ""; };
  return { lob: v("pgLob"), carrier: v("pgCarrier"), mga: v("pgMga"), broker: v("pgBroker"), status: v("pgStatus") };
}

function renderHeadline() {
  const f = pageScope();
  const qs = Q.filter(q =>
    (!f.status  || q.status  === f.status) &&
    (!f.lob     || q.lob     === f.lob) &&
    (!f.carrier || q.carrier === f.carrier) &&
    (!f.mga     || q.mga     === f.mga) &&
    (!f.broker  || q.broker  === f.broker));
  const prem = qs.reduce((a, q) => a + q.premium, 0);
  const inc  = qs.reduce((a, q) => a + q.incurredLosses, 0);
  const lr   = prem ? inc / prem : 0;
  const st   = rollup(q => q.state, f);
  const up   = st.filter(x => x.gap > 0.08 && x.quotes >= 3);
  const down = st.filter(x => x.gap < -0.15 && x.quotes >= 3);
  const scope = [f.lob, f.carrier, f.mga, f.broker, f.status && f.status + " quotes"].filter(Boolean).join(" \u00b7 ");

  const el = document.getElementById("lrStats");
  if (el) el.innerHTML = `
    <div class="col-6 col-lg-3"><div class="vx-stat stack"><div class="lbl">Overall Loss Ratio</div>
      <div class="val" style="color:${lrColor(lr - 0.55)}">${(lr * 100).toFixed(1)}%</div>
      <div class="dt flat">$${vxNum(inc)} incurred / $${vxNum(prem)} earned</div></div></div>
    <div class="col-6 col-lg-3"><div class="vx-stat stack"><div class="lbl">States \u2014 Rate Increase Indicated</div>
      <div class="val" style="color:var(--bad)">${up.length}</div><div class="dt flat">loss ratio &gt;8pt over target</div></div></div>
    <div class="col-6 col-lg-3"><div class="vx-stat stack"><div class="lbl">States \u2014 Room to Decrease</div>
      <div class="val" style="color:var(--good)">${down.length}</div><div class="dt flat">loss ratio &gt;15pt under target</div></div></div>
    <div class="col-6 col-lg-3"><div class="vx-stat stack"><div class="lbl">Total Claims (sample)</div>
      <div class="val">${vxNum(qs.reduce((a, q) => a + q.claims, 0))}</div>
      <div class="dt flat">across ${vxNum(qs.length)} quotes</div></div></div>`;

  const sc = document.getElementById("pgScope");
  if (sc) sc.textContent = scope ? "Showing: " + scope : "Whole book \u00b7 " + vxNum(qs.length) + " quotes";
}

/* Push page scope down into the per-tab filters so the tables below match the
   headline, then let each tab's own renderer run exactly as before. */
function applyScopeToTabs() {
  const f = pageScope();
  [["st", renderState], ["ct", renderCounty]].forEach(([p, fn]) => {
    const set = (sfx, val) => { const el = document.getElementById(p + sfx); if (el && el.value !== val) el.value = val; };
    set("Lob", f.lob); set("Carrier", f.carrier); set("Mga", f.mga); set("Status", f.status);
    // the broker list is built lazily per MGA, so refresh it before setting
    chainFilters(p);
    set("Broker", f.broker);
    try { fn(); } catch (e) { /* tab not built yet */ }
  });
}

function onScopeChange() {
  // Broker only makes sense under a chosen MGA - same rule the tab filters use
  const mga = document.getElementById("pgMga").value;
  const b = document.getElementById("pgBroker");
  if (b) {
    b.style.display = mga ? "" : "none";
    if (!mga) b.value = "";
    else if (b.dataset.mga !== mga) {
      b.dataset.mga = mga;
      b.innerHTML = `<option value="">All brokers under ${mga}</option>`
        + brokersFor(mga).map(x => `<option>${x}</option>`).join("");
    }
  }
  renderHeadline();
  applyScopeToTabs();
}

["pgLob", "pgCarrier", "pgMga", "pgBroker", "pgStatus"].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.onchange = onScopeChange;
});
const pgClr = document.getElementById("pgClr");
if (pgClr) pgClr.onclick = () => {
  ["pgLob", "pgCarrier", "pgMga", "pgBroker", "pgStatus"].forEach(id => {
    const el = document.getElementById(id); if (el) el.value = "";
  });
  onScopeChange();
};
renderHeadline();

</script>
