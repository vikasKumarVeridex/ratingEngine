<!DOCTYPE html>
<html lang="en" style="background-color:#1A1D23">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lookup Tables — Rating | VeriDex</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body><div id="vxApp"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cosmos-model.js"></script>
<script src="assets/js/tenant-setup.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/grid.js"></script>
<script src="assets/js/ag-grid-adapter.js"></script>
<script>
vxShell("Lookup Tables", "Inventory of the large reference tables behind the engine. || What exists, and how big it is.", [{l:"Rating Data"},{l:"Lookup Tables"}]);

/* Which of these 23 inventoried tables actually have rows loaded, and where
   to browse them. Only the 5 Commercial Trucking entries below have real
   extracted data behind them (see rate-tables.html); the other 18 — General
   Liability, Property, MPL and Cyber lookups — are inventory-only. Rather
   than fabricate rows for those, the action is disabled and says so. */
const LOOKUP_LIVE = {
  "ZIP → Territory (Trucking)": "fullZip",
  "Increased Limits Factors": "fullIlf",
  "Liability Loss Costs": "fullLiabLC",
  "Garagekeepers Rates": "fullGkl",
  "PhysDam Rates by TIV": "truckPhysDamRate",
};

document.getElementById("vxBody").innerHTML = `
  <div class="mb-3 vx-anim" style="border:1px solid var(--border);border-left:3px solid var(--accent);background:var(--primary-soft);border-radius:0 10px 10px 0;padding:11px 15px;font-size:12.3px;line-height:1.6">
    <i class="fa-solid fa-circle-info me-1" style="color:var(--accent)"></i>
    <b>This is an inventory, not the data itself.</b> It records each table's size at production scale — most rows
    are not loaded here. <b>${Object.keys(LOOKUP_LIVE).length} of ${VX.lookupTables.length}</b> tables (all Commercial
    Trucking) have real rows extracted and browsable — click <i class="fa-solid fa-table-cells"></i> on those rows.
    The rest are sized but not yet loaded.</div>
  <div class="vx-card vx-anim"><div id="grid"></div></div>`;
vxAgGrid({ el:"#grid", key:"lookupTables", name:"Lookup Table",

  cols:[{k:"name",l:"Lookup Table"},{k:"lob",l:"LOB"},{k:"keys",l:"Key Columns"},
      {k:"rows",l:"Rows",r:r=>'<b>'+vxNum(r.rows)+'</b>'},
      {k:"records",l:"Records",r:r=>LOOKUP_LIVE[r.name] ? '<span class="vx-b green">Loaded</span>' : vxWiredChip(false,"Not loaded")},
      {k:"version",l:"Version",r:r=>'<span class="vx-b gray">'+r.version+'</span>'}],
  form:[{k:"name",l:"Table Name"},{k:"lob",l:"LOB",t:"select",opts:vxLobNames()},{k:"keys",l:"Key Columns"},
      {k:"rows",l:"Row Count",t:"number"},{k:"version",l:"Version"}],
  filters:[{k:"lob",l:"LOB",opts:vxLobNames()}],
  rowActions:[{i:"fa-table-cells",t:"View records",fn:viewRecords}] });

function viewRecords(rec) {
  const tableId = LOOKUP_LIVE[rec.name];
  if (!tableId) {
    vxToast("No records loaded", `${rec.name} is sized in the inventory but its rows haven't been extracted yet.`, "warn");
    return;
  }
  location.href = "rate-tables.html?table=" + encodeURIComponent(tableId);
}

</script>
</body>
</html>
