<!DOCTYPE html>
<html lang="en" style="background-color:#1A1D23">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lookup Tables — Rating | VeriDex</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body><div id="vxApp"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/rate-data-full.js"></script>
<script src="assets/js/rate-tables-registry.js"></script>
<script src="assets/js/cosmos-model.js"></script>
<script src="assets/js/tenant-setup.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/grid.js"></script>
<script src="assets/js/tooltip-dictionary.js"></script>
<script src="assets/js/ag-grid-adapter.js"></script>
<script>
vxShell("Lookup Tables", "Inventory of the large reference tables behind the engine. || What exists, and how big it is.", [{l:"Rating Data"},{l:"Lookup Tables"}]);

/* Which of these inventoried tables actually have rows loaded, and where to
   browse them. 5 of the original 23 hand-curated rows map to real, filed
   data this way already (see rate-tables.html). */
const LOOKUP_LIVE = {
  "ZIP → Territory (Trucking)": "fullZip",
  "Increased Limits Factors": "fullIlf",
  "Liability Loss Costs": "fullLiabLC",
  "Garagekeepers Rates": "fullGkl",
  "PhysDam Rates by TIV": "truckPhysDamRate",
};
/* RATE_TABLES (rate-tables-registry.js) is the real, engine-wired registry —
   39 tables engine.js actually reads while rating, none of them fabricated.
   Only 5 of those ever had a row here: every OTHER rating factor whose
   Lookup Table points at a real RATE_TABLES entry (Fleet Size Factors,
   Primary Class Factors, Driver Class Factors, and so on) was invisible on
   this screen — the factor said "reads a real table," but Lookup Tables had
   nowhere to show it. Every RATE_TABLES entry not already one of the 5
   above becomes its own inventory row here too: real, "Loaded", click-
   through to Rate Tables — not persisted, since it is fully derived from
   RATE_TABLES and regenerating it here every load is what keeps it from
   ever going stale relative to the registry it mirrors. */
if (typeof RATE_TABLES !== "undefined") {
  const claimedTableIds = new Set(Object.values(LOOKUP_LIVE));
  const existingNames = new Set(VX.lookupTables.map(t => t.name));
  let nextInvId = Math.max(0, ...VX.lookupTables.map(t => +t.id || 0)) + 1;
  RATE_TABLES.forEach(t => {
    if (claimedTableIds.has(t.id)) return;               // already one of the 5 above
    if (LOOKUP_LIVE[t.name] === undefined) LOOKUP_LIVE[t.name] = t.id;
    if (existingNames.has(t.name)) return;                // row already exists this session
    let n = 0; try { n = (t.rows() || []).length; } catch (e) {}
    VX.lookupTables.push({ id: nextInvId++, name: t.name, lob: t.lob, keys: t.cov || "—",
      rows: n, source: t.id, active: true, columns: [], data: [], sample: false });
    existingNames.add(t.name);
  });
}

document.getElementById("vxBody").innerHTML = `
  <div class="mb-3 vx-anim" style="border:1px solid var(--border);border-left:3px solid var(--accent);background:var(--primary-soft);border-radius:0 10px 10px 0;padding:11px 15px;font-size:12.3px;line-height:1.6">
    <i class="fa-solid fa-circle-info me-1" style="color:var(--accent)"></i>
    <b>This is an inventory, not the data itself.</b> It records each table's size at production scale, not the filed
    numbers. <b>${Object.keys(LOOKUP_LIVE).length} of ${VX.lookupTables.length}</b> tables — every line of business
    the engine rates, not just Trucking — have real rows extracted and browsable — click <i class="fa-solid fa-table-cells"></i> on those rows.
    <b>${VX.lookupTables.filter(t => t.sample).length}</b> more have a small <span class="vx-b amber">Sample</span> dataset —
    a few placeholder rows shaped like the real key columns, generated here rather than filed, so the table isn't empty
    while you wait on the real extract. Upload a real CSV (or edit rows directly) to replace them.</div>
  <div id="lookupApprovals"></div>
  <div class="vx-card vx-anim"><div id="grid"></div></div>`;
/* Rows is never typed in — it always reflects reality. A table whose
   structure has been defined (columns.length) reports the number of rows
   actually in force today (VX.lookupRowsAsOf — see data.js), not the raw
   length of `data`, which now also holds every past revision of an edited
   or deleted row. A table nobody has touched yet still shows its original
   production-scale sizing estimate, unchanged. */
const rowCount = r => (r.columns && r.columns.length) ? VX.lookupRowsAsOf(r).length : r.rows;

const grid = vxAgGrid({ el:"#grid", key:"lookupTables", name:"Lookup Table",
  noClone: true,
  noHist: true,

  // Same pattern as products.html/vxProductsState — an admin-defined table
  // (and the columns on it) is real configuration, not demo data, so it must
  // survive a refresh instead of resetting to the seed inventory.
  onAfterSave: (rec, isNew) => {
    refreshSampleCsv(rec); persistLookupTables();
    /* Defining columns and entering the first row used to be two separate
       trips — Save the table, then go find "Add row" on the grid. Offered
       here instead, right when the structure is fresh in mind, but never
       forced: "Later" leaves the table exactly as saved, and Add row keeps
       working from the grid whenever it's wanted. */
    if (isNew && (rec.columns || []).length && !LOOKUP_LIVE[rec.name]) {
      setTimeout(() => vxModal(`${rec.name} — add your first row now?`,
        `<div style="font-size:13px;line-height:1.6">
          The table's structure is saved. You can start entering rows now, one at a time,
          or come back to <b>Add row</b> on this table whenever you're ready — nothing here is required.
        </div>`,
        [{ t: "Later", c: "secondary" }, { t: "Add first row", c: "primary", fn: () => { setTimeout(() => openRowModal(rec), 260); } }],
        "modal-md"), 300);
    }
  },
  onAfterDelete: () => persistLookupTables(),

  cols:[{k:"name",l:"Lookup Table"},{k:"lob",l:"LOB"},{k:"keys",l:"Key Columns"},
      {k:"rows",l:"Rows",r:r=>'<b>'+vxNum(rowCount(r))+'</b>'},
      {k:"records",l:"Records",r:r=>
        LOOKUP_LIVE[r.name] ? '<span class="vx-b green">Loaded</span>'
        : r.sample ? '<span class="vx-b amber hintdot" title="Placeholder rows shaped like the real key columns — not filed data. Upload a real CSV to replace them.">Sample</span>'
        : rowCount(r) ? '<span class="vx-b green">Loaded</span>'
        : vxWiredChip(false, "Not loaded")}],
  form:[{k:"name",l:"Table Name"},{k:"lob",l:"LOB",t:"select",opts:vxLobNames()},
      {k:"columns",l:"Columns",t:"columns",
        hint:"Define the table's structure. You'll be offered the choice to add your first row right after saving, or you can always add rows later from the grid."}],
  filters:[{k:"lob",l:"LOB",opts:vxLobNames()}],
  rowActions:[{i:"fa-table-cells",t:"View records",fn:viewRecords},{i:"fa-plus",t:"Add row",fn:addRow},
    {i:"fa-file-csv",t:"Download sample CSV",fn:downloadSampleCsv},{i:"fa-upload",t:"Upload CSV",fn:uploadCsv}] });
renderLookupApprovals();

function vxLookupTableById(id) { return (VX.lookupTables || []).find(t => t.id === id); }
function persistLookupTables() {
  try { localStorage.setItem("vxLookupTables", JSON.stringify(VX.lookupTables)); } catch (e) {}
}
function csvCell(v) {
  const s = String(v ?? "");
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function sampleValue(column, index) {
  const key = `${column.name || ""} ${column.id || ""}`.toLowerCase();
  if (column.type === "Boolean") return "false";
  if (column.type === "Date") return VX.referenceDate || "2026-09-07";
  if (column.type === "Number" || column.type === "Range") return column.min ?? (/(factor|rate)/.test(key) ? "1" : "100");
  if (/state/.test(key)) return "CA";
  if (/zip|postal/.test(key)) return "00000";
  if (/territory/.test(key)) return "001";
  if (/code/.test(key)) return `SAMPLE_${index + 1}`;
  return `Sample ${column.name || index + 1}`;
}
/* The template is regenerated from the current field definitions every time
   a table is saved or downloaded. Adding/renaming a column therefore cannot
   leave a stale CSV header behind. */
function buildSampleCsv(rec) {
  const cols = (rec && rec.columns) || [];
  if (!cols.length) return "# Define one or more columns, then download the sample again.\r\n";
  return [cols.map(c => csvCell(c.name)).join(","), cols.map((c, i) => csvCell(sampleValue(c, i))).join(",")].join("\r\n") + "\r\n";
}
function refreshSampleCsv(rec) {
  if (rec) rec.sampleCsv = buildSampleCsv(rec);
}
function downloadSampleCsv(rec) {
  refreshSampleCsv(rec);
  const blob = new Blob([rec.sampleCsv], { type: "text/csv;charset=utf-8" });
  const link = document.createElement("a");
  const url = URL.createObjectURL(blob);
  link.href = url;
  link.download = `${String(rec.name || "lookup-table").replace(/[^a-z0-9]+/gi, "-").replace(/(^-|-$)/g, "").toLowerCase()}-sample.csv`;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
  vxToast("Sample CSV downloaded", `${rec.name}: ${((rec.columns || []).length)} field${(rec.columns || []).length === 1 ? "" : "s"} plus one example row`, "ok");
}
function parseCsv(text) {
  const rows = [[]]; let cell = "", quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"' && quoted && text[i + 1] === '"') { cell += '"'; i++; }
    else if (ch === '"') quoted = !quoted;
    else if (ch === "," && !quoted) { rows[rows.length - 1].push(cell); cell = ""; }
    else if ((ch === "\n" || ch === "\r") && !quoted) {
      if (ch === "\r" && text[i + 1] === "\n") i++;
      rows[rows.length - 1].push(cell); cell = ""; rows.push([]);
    } else cell += ch;
  }
  if (cell || rows[rows.length - 1].length) rows[rows.length - 1].push(cell);
  return rows.filter(r => r.some(v => String(v).trim() !== ""));
}
function typedCsvValue(value, column) {
  if (column.type === "Boolean") return /^(true|1|yes)$/i.test(value);
  if (column.type === "Number" || column.type === "Range") return value === "" ? "" : Number(value);
  return value;
}
function uploadCsv(rec) {
  if (LOOKUP_LIVE[rec.name]) { vxToast("Not editable here", `${rec.name} is a filed dataset.`, "info"); return; }
  if (!rec.columns || !rec.columns.length) { vxToast("Define columns first", "Add fields before uploading a CSV.", "warn"); return; }
  vxModal(`Upload CSV — ${rec.name}`, `<div class="sub mb-3">Use this table's <b>Download sample CSV</b> action for the exact headers. Uploading replaces this table's local rows only.</div>
    <input id="lookupCsvFile" type="file" class="form-control" accept=".csv,text/csv">`,
    [{t:"Cancel",c:"secondary"},{t:"Upload CSV",c:"primary",fn:() => importCsv(rec)}]);
}
function importCsv(rec) {
  const file = document.getElementById("lookupCsvFile").files[0];
  if (!file) { vxToast("Choose a CSV", "Select a .csv file to upload.", "warn"); return false; }
  const reader = new FileReader();
  reader.onerror = () => vxToast("Upload failed", "The CSV file could not be read.", "err");
  reader.onload = () => {
    const csv = parseCsv(String(reader.result || ""));
    const headers = csv.shift() || [];
    const expected = rec.columns.map(c => c.name);
    const missing = expected.filter(name => !headers.includes(name));
    if (missing.length) { vxToast("Upload failed", `Missing column${missing.length === 1 ? "" : "s"}: ${missing.join(", ")}`, "err"); return; }
    const rows = csv.map((values, i) => ({
      ...Object.fromEntries(rec.columns.map(c => [c.name, typedCsvValue(values[headers.indexOf(c.name)] ?? "", c)])),
      __rowId: i + 1, effectiveStart: "", effectiveEnd: "",
    }));
    rec.data = rows; rec.rows = rows.length; rec.sample = false; refreshSampleCsv(rec);
    // A real upload replaces the auto-generated placeholder rows (if any)
    // with real ones — the Records column should say "Loaded" from here on,
    // not "Sample".
    // A full CSV upload replaces every row's identity, so any change request
    // still pending against this table is now pointing at a __rowId that no
    // longer exists — reject it rather than leave it dangling on the
    // approvals panel with nothing left for an approver to apply it to.
    (VX.lookupChangeRequests || []).filter(r => r.tableId === rec.id && r.status === "Pending")
      .forEach(r => vxRejectLookupRowChange(r.id, "Table replaced by a CSV upload before this could be approved"));
    API.update("lookupTables", rec.id, { data: rows, rows: rec.rows, sample: false, sampleCsv: rec.sampleCsv }).then(() => {
      persistLookupTables(); vxAutoSave(); grid.reload(); renderLookupApprovals();
      vxToast("CSV uploaded", `${rec.name} now has ${rows.length} row${rows.length === 1 ? "" : "s"}`, "ok");
    });
  };
  reader.readAsText(file);
}

function viewRecords(rec) {
  const tableId = LOOKUP_LIVE[rec.name];
  if (tableId) { location.href = "rate-tables.html?table=" + encodeURIComponent(tableId); return; }
  if (rowCount(rec)) { viewLocalData(rec); return; }
  vxToast("No records loaded", `${rec.name} is sized in the inventory but its rows haven't been extracted yet. Use "Add row" to start entering data.`, "warn");
}

/* Rows could only ever be ADDED, never fixed — a typo entered through "Add
   row" had no way back except deleting the whole table and starting over.
   Each row now carries its own Edit/Delete; both go through the same
   approve-then-effective-date gate as a Rating Factor's Default Value
   (vxRequestLookupRowChange in core.js) rather than writing over the row
   immediately, so the list here always shows VX.lookupRowsAsOf — the row in
   force TODAY, not a proposed change still waiting on someone else. */
function viewLocalData(rec) {
  const cols = rec.columns || [];
  const editable = !LOOKUP_LIVE[rec.name];
  const rows = VX.lookupRowsAsOf(rec).slice().sort((a, b) => a.__rowId - b.__rowId);
  const sampleNote = rec.sample ? `<div class="vx-ai mb-3" style="padding:10px 14px;font-size:12.3px">
      <i class="fa-solid fa-circle-info me-1"></i>
      <b>Sample data</b> — placeholder rows shaped like this table's real key columns, generated here rather than filed.
      <a href="#" onclick="event.preventDefault();setTimeout(()=>uploadCsv(vxLookupTableById(${rec.id})),300)">Upload a real CSV</a> or edit rows below to replace them.
    </div>` : "";
  vxModal(`${rec.name} — ${rows.length} row${rows.length === 1 ? "" : "s"}`,
    `${sampleNote}<div class="vx-tw"><table class="vx-t"><thead><tr>${cols.map(c => `<th>${c.name}</th>`).join("")}${editable ? "<th></th>" : ""}</tr></thead>
      <tbody>${rows.map(row => {
        const pending = editable && vxPendingLookupRequest(rec.id, row.__rowId);
        return `<tr>${cols.map(c => `<td>${row[c.name] ?? '<span style="color:var(--text-mute)">—</span>'}</td>`).join("")}
        ${editable ? `<td style="white-space:nowrap;text-align:end">
          ${pending ? `<span class="vx-b amber hintdot" style="margin-inline-end:6px" title="${pending.action === "delete" ? "Pending deletion" : "Pending edit"}, effective ${pending.effectiveFrom} — requested by ${pending.requestedBy.split("@")[0]}. This row still shows what's in force today.">pending</span>` : ""}
          <button class="vx-icobtn" data-rowedit="${row.__rowId}" title="Edit this row" style="width:28px;height:28px"><i class="fa-solid fa-pen" style="font-size:11px"></i></button>
          <button class="vx-icobtn" data-rowdel="${row.__rowId}" title="Delete this row" style="width:28px;height:28px"><i class="fa-solid fa-trash" style="font-size:11px"></i></button>
        </td>` : ""}</tr>`;
      }).join("")}</tbody>
    </table></div>`,
    [{ t:"Close", c:"secondary" }, ...(editable ? [{ t:"Add Row", c:"primary", fn:() => { setTimeout(() => addRow(rec), 300); } }] : [])], "modal-lg");
  if (!editable) return;
  const modal = document.getElementById("vxModal");
  modal.querySelectorAll("[data-rowedit]").forEach(b => b.onclick = () => { setTimeout(() => openRowModal(rec, +b.dataset.rowedit), 260); });
  modal.querySelectorAll("[data-rowdel]").forEach(b => b.onclick = () => deleteRow(rec, +b.dataset.rowdel));
}

/* `rowId` is the row's stable __rowId, not an array index — table.data now
   holds every revision of every row (see VX.lookupRowsAsOf), so an index
   into it stopped meaning "this row" the moment a second revision existed. */
function deleteRow(rec, rowId) {
  const row = VX.lookupRowsAsOf(rec).find(r => r.__rowId === rowId);
  if (!row) return;
  const label = (rec.columns || []).map(c => row[c.name]).filter(v => v !== undefined && v !== "").slice(0, 2).join(" · ") || "this row";
  const suggested = VX.referenceDate || new Date().toISOString().slice(0, 10);
  vxModal("Delete this row?", `
    <div style="font-size:13px;line-height:1.6">Removes <b>${label}</b> from <b>${rec.name}</b>.
      <div style="margin-top:8px">Sent for someone else's approval first — the row stays in force, unchanged, until then.</div>
    </div>
    <div class="row g-3 mt-2">
      <div class="col-md-6"><label>In force from</label><input type="date" class="form-control form-control-sm" id="rowDelEffDate" value="${suggested}"></div>
      <div class="col-md-6"><label>Reason</label><input type="text" class="form-control form-control-sm" id="rowDelReason" placeholder="Optional"></div>
    </div>`,
    [{ t:"Cancel", c:"secondary" }, { t:"Send for approval", c:"primary", fn:() => {
      const effDate = document.getElementById("rowDelEffDate").value || suggested;
      const reason = document.getElementById("rowDelReason").value;
      const req = vxRequestLookupRowChange(rec, rowId, row, null, effDate, reason);
      vxToast("Sent for approval", `${rec.name}: row deletion effective ${req.effectiveFrom}. It stays in force until someone else approves it.`, "info");
      renderLookupApprovals(); grid.reload();
      setTimeout(() => viewLocalData(rec), 260);
    } }]);
}

/* Entering rows is a separate step from defining the table, and reuses
   whatever `columns` the Add/Edit form saved — one text/number/date/checkbox
   input per column, typed to match. The 5 Commercial Trucking tables in
   LOOKUP_LIVE are the real filed dataset, browsable (not editable) on
   Rate Tables (live); this only writes to the local, admin-entered rows a
   table on this screen can otherwise hold. */
function addRow(rec) {
  if (LOOKUP_LIVE[rec.name]) {
    vxToast("Not editable here", `${rec.name} is the filed rate-table dataset — browse it on Rate Tables (live) instead.`, "info");
    return;
  }
  if (!rec.columns || !rec.columns.length) {
    vxToast("Define columns first", `${rec.name} has no columns yet — open Edit and add at least one before entering rows.`, "warn");
    return;
  }
  openRowModal(rec);
}

/* `rowId` (undefined on Add) switches this into edit mode: fields pre-fill
   from the row's current, in-force values, the title reads "Edit", there's
   no "Save & Add Another" (you're fixing one row, not entering a run of new
   ones), and saving raises an approval request instead of writing over the
   row — see the effective-date/reason fields added below the form. Adding a
   brand-new row stays immediate: nothing was relying on a row that did not
   exist yet, the same distinction Rating Factors draws between creating a
   factor and changing an existing one's value. */
function openRowModal(rec, rowId) {
  const editing = rowId != null;
  const existing = editing ? (VX.lookupRowsAsOf(rec).find(r => r.__rowId === rowId) || {}) : {};
  const fields = `<div class="row g-3">${rec.columns.map(c => {
    const val = existing[c.name];
    if (c.type === "Boolean") return `<div class="col-md-6"><label class="d-block">${c.name}</label>
      <div class="form-check form-switch"><input class="form-check-input" type="checkbox" data-rf="${c.name}"${val ? " checked" : ""}></div></div>`;
    if (c.type === "Range") return `<div class="col-md-6"><label>${c.name} <span style="font-weight:400;color:var(--text-mute)">(${c.min ?? "–"}–${c.max ?? "–"})</span></label>
      <input type="number" class="form-control form-control-sm" data-rf="${c.name}" data-rfrange="${c.name}" value="${val ?? ""}"${c.min !== undefined ? ` min="${c.min}"` : ""}${c.max !== undefined ? ` max="${c.max}"` : ""}>
      <div style="font-size:10.8px;color:var(--bad);margin-top:3px;display:none" data-rfrangeerr="${c.name}"></div></div>`;
    const type = c.type === "Number" ? "number" : c.type === "Date" ? "date" : "text";
    return `<div class="col-md-6"><label>${c.name}</label><input type="${type}" class="form-control form-control-sm" data-rf="${c.name}" value="${val ?? ""}"></div>`;
  }).join("")}</div>`;
  const suggested = VX.referenceDate || new Date().toISOString().slice(0, 10);
  const approvalFields = editing ? `
    <div class="row g-3 mt-1">
      <div class="col-md-6"><label>In force from</label><input type="date" class="form-control form-control-sm" id="rowEffDate" value="${suggested}"></div>
      <div class="col-md-6"><label>Reason for the change</label><input type="text" class="form-control form-control-sm" id="rowReason" placeholder="e.g. Filed rate revision 2026-09"></div>
    </div>
    <div class="mt-2" style="font-size:11.4px;color:var(--text-dim)">
      Sent for someone else's approval — this row keeps showing its current values until then.
    </div>` : "";
  vxModal(`${editing ? "Edit" : "Add"} Row — ${rec.name}`, fields + approvalFields,
    editing
      ? [{ t:"Cancel", c:"secondary" }, { t:"Send for approval", c:"primary", fn:() => saveRow(rec, false, rowId, existing) }]
      : [{ t:"Cancel", c:"secondary" },
         { t:"Save & Add Another", c:"secondary", fn:() => saveRow(rec, true) },
         { t:"Save Row", c:"primary", fn:() => saveRow(rec, false) }]);
  // Live feedback as you type — the number input's min/max attributes are
  // only a browser hint (spinner behaviour), not something that stops an
  // out-of-range value from being typed or saved, so the check is repeated
  // here and enforced for real in saveRow() below.
  document.getElementById("vxModal").querySelectorAll("[data-rfrange]").forEach(inp => {
    inp.oninput = () => rangeFieldError(inp, rec);
  });
}
/* Reads one Range field's current value against its column's min/max and
   shows/clears its inline error. Returns the offending column (so saveRow
   can build one summary message) or null when the value is fine. */
function rangeFieldError(inp, rec) {
  const name = inp.dataset.rfrange;
  const col = (rec.columns || []).find(c => c.name === name);
  const errEl = document.querySelector(`[data-rfrangeerr="${name}"]`);
  if (!col || inp.value === "") { if (errEl) errEl.style.display = "none"; inp.style.borderColor = ""; return null; }
  const v = +inp.value;
  const min = col.min !== undefined && col.min !== "" ? +col.min : null;
  const max = col.max !== undefined && col.max !== "" ? +col.max : null;
  const bad = (min !== null && v < min) || (max !== null && v > max);
  if (errEl) errEl.style.display = bad ? "" : "none";
  if (errEl && bad) errEl.textContent = `Must be between ${col.min ?? "–"} and ${col.max ?? "–"} — this table won't save ${v}.`;
  inp.style.borderColor = bad ? "var(--bad)" : "";
  return bad ? col : null;
}

function saveRow(rec, again, rowId, beforeRow) {
  const el = document.getElementById("vxModal");
  const row = {};
  el.querySelectorAll("[data-rf]").forEach(inp => {
    row[inp.dataset.rf] = inp.type === "checkbox" ? inp.checked : (inp.type === "number" ? +inp.value : inp.value);
  });
  if (!Object.values(row).some(v => v !== "" && v !== false)) {
    vxToast("Nothing to save", "Fill in at least one field.", "warn");
    return false;
  }
  // A Range column declares a band for a reason — block the save rather
  // than silently accept a value outside it, the way min/max attributes
  // alone never did.
  const badCol = [...el.querySelectorAll("[data-rfrange]")].map(inp => rangeFieldError(inp, rec)).find(Boolean);
  if (badCol) {
    vxToast("Value out of range", `${badCol.name} must be between ${badCol.min ?? "–"} and ${badCol.max ?? "–"} — got ${row[badCol.name]}.`, "err");
    return false;
  }
  rec.data = rec.data || [];
  const editing = rowId != null;
  if (editing) {
    const effDate = document.getElementById("rowEffDate").value || VX.referenceDate || new Date().toISOString().slice(0, 10);
    const reason = document.getElementById("rowReason").value;
    const req = vxRequestLookupRowChange(rec, rowId, beforeRow, row, effDate, reason);
    vxToast("Sent for approval", `${rec.name}: row change effective ${req.effectiveFrom}. The current value stays in force until someone else approves it.`, "info");
    renderLookupApprovals(); grid.reload();
    setTimeout(() => viewLocalData(rec), 260);
    return;
  }
  const nextRowId = Math.max(0, ...rec.data.map(r => +r.__rowId || 0)) + 1;
  rec.data.push({ ...row, __rowId: nextRowId, effectiveStart: "", effectiveEnd: "" });
  rec.rows = VX.lookupRowsAsOf(rec).length;
  API.update("lookupTables", rec.id, { data: rec.data, rows: rec.rows }).then(() => {
    try { localStorage.setItem("vxLookupTables", JSON.stringify(VX.lookupTables)); } catch (e) {}
    vxToast("Row added", `${rec.name} now has ${rec.rows} row${rec.rows === 1 ? "" : "s"}`, "ok");
    vxAutoSave(); grid.reload();
    if (again) setTimeout(() => openRowModal(rec), 260);
  });
}

/* Pending row changes across every table, shown above the grid — the same
   "it exists to be cleared" reasoning as factors.html's approvals panel:
   burying this would let a change wait unnoticed while a table quietly
   still showed the old row. */
function renderLookupApprovals() {
  const host = document.getElementById("lookupApprovals");
  if (!host) return;
  const pending = (VX.lookupChangeRequests || []).filter(r => r.status === "Pending");
  const recent = (VX.lookupChangeRequests || []).filter(r => r.status !== "Pending").slice(0, 3);
  if (!pending.length && !recent.length) { host.innerHTML = ""; return; }

  const me = vxCurrentUser();
  const row = r => {
    const mine = r.requestedBy === me;
    return `<tr>
      <td><b>${r.tableName}</b><div style="font-size:10.6px;color:var(--text-mute)">${r.action === "delete" ? "delete row" : "edit row"}</div></td>
      <td>${r.effectiveFrom}</td>
      <td style="font-size:11.4px">${r.requestedBy.split("@")[0]}
        <div style="color:var(--text-mute);font-size:10.5px">${r.requestedOn}</div></td>
      <td style="font-size:11.4px;color:var(--text-dim)">${r.reason || "—"}</td>
      <td style="text-align:right;white-space:nowrap">
        ${mine
          ? `<span class="vx-b gray hintdot" title="You raised this change. Approval is a second pair of eyes, so it has to be someone else — that is the only thing this step guarantees.">awaiting someone else</span>`
          : `<button class="btn btn-outline-secondary btn-sm" data-lrej="${r.id}">Reject</button>
             <button class="btn btn-primary btn-sm ms-1" data-lapp="${r.id}">Approve</button>`}
      </td></tr>`;
  };

  host.innerHTML = `
    ${pending.length ? `<div class="vx-card vx-anim" style="margin-bottom:14px;border-left:3px solid var(--warn)">
      <div class="vx-card-head">
        <div><h2>Row changes awaiting approval <span class="vx-b amber">${pending.length}</span></h2>
          <div class="sub">A row edit or delete does not take effect until someone else approves it, and then only from its effective date.</div></div>
      </div>
      <div class="vx-tw"><table class="vx-t" style="font-size:12.2px">
        <thead><tr><th>Table</th><th>Effective from</th><th>Requested by</th><th>Reason</th><th></th></tr></thead>
        <tbody>${pending.map(row).join("")}</tbody></table></div>
      <div style="font-size:11px;color:var(--text-mute);margin-top:8px">
        The table keeps showing the row currently in force while a change waits here — so what you see is what applies.
      </div>
    </div>` : ""}
    ${recent.length ? `<div style="font-size:11.4px;color:var(--text-mute);margin-bottom:14px">
      Recently decided: ${recent.map(r => `<b>${r.tableName}</b> ${r.status.toLowerCase()} by ${String(r.decidedBy || "").split("@")[0] || "—"}`).join(" · ")}
    </div>` : ""}`;

  host.querySelectorAll("[data-lapp]").forEach(b => b.onclick = () => {
    const r = VX.lookupChangeRequests.find(x => x.id === +b.dataset.lapp);
    const suggested = vxSuggestedLookupApprovalDate(r);
    const stale = suggested !== r.effectiveFrom;
    vxModal("Approve this change?", `
      <div style="font-size:13px;line-height:1.6">
        <b>${r.tableName}</b> — ${r.action === "delete" ? "delete this row" : "update this row"}.
        <div style="margin-top:8px">The current row stays on file, closed the day before — nothing that already read it changes retroactively.</div>
      </div>
      <div class="row g-3 mt-2">
        <div class="col-md-7">
          <label>In force from</label>
          <input type="date" class="form-control form-control-sm" id="lookupApEffDate" value="${suggested}">
          ${stale ? `<div style="font-size:11px;color:var(--warn);margin-top:4px">
              <i class="fa-solid fa-triangle-exclamation me-1"></i>${r.effectiveFrom} was requested, but that date has already passed while this sat pending — defaulted to today instead.</div>`
            : `<div style="font-size:11px;color:var(--text-mute);margin-top:4px">As requested.</div>`}
        </div>
      </div>`,
      [{ t: "Cancel", c: "secondary" }, { t: "Approve", c: "primary", fn: () => {
        const eff = document.getElementById("lookupApEffDate").value || suggested;
        if (vxApproveLookupRowChange(r.id, "", eff)) {
          vxToast("Approved", `${r.tableName} in force from ${eff}`, "ok");
          renderLookupApprovals(); grid.reload();
        }
      } }], "modal-md");
  });
  host.querySelectorAll("[data-lrej]").forEach(b => b.onclick = () => {
    const r = VX.lookupChangeRequests.find(x => x.id === +b.dataset.lrej);
    vxConfirm("Reject this change?",
      `<b>${r.tableName}</b> keeps its current row, unchanged. The request stays in the audit trail with your name on it.`,
      () => { vxRejectLookupRowChange(r.id, ""); vxToast("Rejected", r.tableName + " unchanged", "err"); renderLookupApprovals(); grid.reload(); }, true);
  });
}
</script>
<script src="assets/js/column-tooltips.js"></script>
