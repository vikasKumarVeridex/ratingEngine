<!DOCTYPE html>
<html lang="en" style="background-color:#1A1D23">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tenant Stat Dashboard — Administration | VeriDex</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
<link href="assets/css/workspace.css" rel="stylesheet">
<script src="assets/js/tooltip-dictionary.js" defer></script>
<script src="assets/js/ui-ux.js" defer></script>
</head>
<body><div id="vxApp"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cosmos-model.js"></script>
<script src="assets/js/tenant-setup.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/grid.js"></script>
<script>
vxShell("Tenant Stat Dashboard", "Every tenant on this account, at a glance. || Unlike Dashboard, which is scoped to whichever tenant is active, this reads across every one of them — the admin console's own landing page.",
  [{ l: "Administration" }, { l: "Tenant Stat Dashboard" }]);

/* Deliberately reads the RAW, unpartitioned collections rather than going
   through COSMOS.query() — that facade exists precisely to answer "what does
   THIS tenant see", and the one thing this page is for is answering the
   opposite question, across every tenant at once. */
const tenants = VX.tenants || [];
const rows = tenants.map(t => {
  const products = (VX.products || []).filter(p => p.tenantId === t.id);
  const versions = (VX.versions || []).filter(v => v.tenantId === t.id);
  const factors = (VX.ratingFactors || []).filter(f => f.tenantId === t.id);
  const quotes = (VX.quotes || []).filter(q => q.tenantId === t.id);
  const bound = quotes.filter(q => q.status === "Bound");
  return {
    tenant: t, products: products.length,
    published: versions.filter(v => v.status === "Published").length,
    factors: factors.length, quotes: quotes.length,
    boundCount: bound.length,
    boundPremium: bound.reduce((s, q) => s + (q.premium || 0), 0),
  };
});

const totalQuotes = rows.reduce((s, r) => s + r.quotes, 0);
const totalBoundPremium = rows.reduce((s, r) => s + r.boundPremium, 0);
const totalProducts = rows.reduce((s, r) => s + r.products, 0);

const stat = (l, v, dt, ic, bg) => `<div class="col-6 col-lg-3"><div class="vx-stat vx-anim">
  <div><div class="lbl">${l}</div><div class="val">${v}</div><div class="dt flat">${dt}</div></div>
  <div class="ic" style="background:${bg}"><i class="fa-solid ${ic}"></i></div></div></div>`;

document.getElementById("vxBody").innerHTML = `
<div class="row g-3 mb-1">
  ${stat("Tenants", tenants.length, tenants.filter(t=>t.status==="Active").length + " active", "fa-building", "var(--cat-1)")}
  ${stat("Products Configured", vxNum(totalProducts), "Across every tenant", "fa-cubes", "var(--cat-2)")}
  ${stat("Quotes Rated", vxNum(totalQuotes), rows.reduce((s,r)=>s+r.boundCount,0) + " bound", "fa-file-lines", "var(--cat-4)")}
  ${stat("Bound Premium", vxMoney(totalBoundPremium), "Summed across every tenant", "fa-sack-dollar", "var(--cat-3)")}
</div>

<div class="vx-card vx-anim">
  <div class="vx-card-head"><div><h2>Tenants</h2><div class="sub">One row per tenant on this account — open one to switch into its own workspace.</div></div>
    <a href="tenants.html" class="btn btn-primary btn-sm"><i class="fa-solid fa-plus me-1"></i>Onboard a tenant</a></div>
  <div class="vx-tw"><table class="vx-t">
    <thead><tr><th>Tenant</th><th>Plan</th><th>Lines of Business</th><th>Products</th><th>Published Versions</th>
      <th>Rating Factors</th><th>Quotes</th><th>Bound Premium</th><th>Status</th><th style="text-align:right">Switch to</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td><b>${r.tenant.name}</b><div style="font-size:10.5px;color:var(--text-mute)"><code>${r.tenant.code}</code></div></td>
      <td>${r.tenant.plan}</td>
      <td>${r.tenant.lobs.length}</td>
      <td>${r.products}</td>
      <td>${r.published}</td>
      <td>${r.factors}</td>
      <td>${vxNum(r.quotes)}</td>
      <td style="font-variant-numeric:tabular-nums">${vxMoney(r.boundPremium)}</td>
      <td><span class="vx-b ${r.tenant.status==='Active'?'green':'gray'}">${r.tenant.status}</span></td>
      <td style="text-align:right"><button class="btn btn-primary btn-sm" data-login="${r.tenant.id}">
        <i class="fa-solid fa-right-to-bracket me-1"></i>Log in</button></td>
    </tr>`).join("")}</tbody>
  </table></div>
</div>`;

/* One action: sets the active tenant AND opens its workspace (vxLoginToTenant,
   core.js) — logging in to a tenant used to be two separate steps (pick the
   tenant, then separately switch the Acting-As user's role) that could land
   you half-switched with no obvious reason why. Logging back out is the
   "Tenant Management" link this tenant's own sidebar carries once inside —
   see vxLogoutOfTenant, wired into vxShell's topbar for every workspace page. */
document.querySelectorAll("[data-login]").forEach(b => b.onclick = () => vxLoginToTenant(+b.dataset.login));
</script>
</body>
</html>
