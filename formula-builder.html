<!DOCTYPE html>

<head>

<style>
/* Step scaffold for the LOB / coverage picker. A numbered chip per step and
   a rule beneath the label give the two questions ("which line", "which
   coverage") clear sequence and separation, rather than two card grids
   sitting back to back with only spacing to imply order. */
.fb-step{margin-bottom:20px}
.fb-step:last-child{margin-bottom:0}
.fb-step-hd{display:flex;align-items:baseline;gap:9px;font-size:13px;font-weight:700;
  padding-bottom:9px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.fb-step-n{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:50%;background:var(--primary-soft);color:var(--primary);font-size:11px;font-weight:800;flex:none}
.fb-step-sub{font-weight:400;color:var(--text-mute);font-size:11.5px;margin-inline-start:4px}

/* An intrinsic grid, not a fixed Bootstrap column count. A column count
   tuned to "7 lines of business" strands the 7th card alone on its own row
   the moment an 8th is added, or looks sparse the moment one is removed —
   this balances at whatever width the cards and the viewport actually allow. */
.fb-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.fb-picker-grid.cob{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}

.covcard{position:relative;border:1.5px solid var(--border);border-radius:10px;padding:10px 11px;
  cursor:pointer;transition:border-color .14s,background-color .14s,box-shadow .14s,transform .14s;
  background:var(--surface);height:100%}
.covcard:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.covcard:active{transform:scale(.98)}
.covcard.on{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px var(--primary) inset}
.covcard i{font-size:16px;margin-bottom:5px;display:block}
.covcard b{display:block;font-size:12.3px;margin-bottom:2px;line-height:1.25}
.covcard-code{display:inline-block;font-size:9.6px;color:var(--text-mute);background:var(--surface-2);
  border:1px solid var(--border);border-radius:5px;padding:1px 6px;font-family:ui-monospace,Consolas,monospace}
.covcard-check{position:absolute !important;top:7px;right:7px;font-size:12px !important;margin:0 !important;
  color:var(--primary) !important}
/* One compact status row instead of a stacked engine-badge line plus a full
   warning sentence — the sentence itself still shows in full once this
   coverage is actually selected (the banner above the canvas); here it is a
   tooltip, so a caution does not cost the same vertical space as a heading. */
.covcard-status{display:flex;align-items:center;gap:6px;margin-top:6px;min-height:15px}
.covcard-status .vx-b{font-size:8.5px}
.covwarn-i{color:var(--warn) !important;font-size:11px !important;margin:0 !important;cursor:help}
/* Compact form used only for the LOB row — same card language, smaller
   footprint since this step never carries a description line. */
.covcard.sm{padding:9px 8px;text-align:center}
.covcard.sm i{font-size:15px;margin-bottom:4px}
.covcard.sm b{font-size:11.3px;margin-bottom:0}
.vx-vartile{border:1px solid var(--border);border-radius:8px;padding:7px 9px;margin-bottom:6px;cursor:grab;background:var(--surface);transition:.12s}
.vx-vartile:hover{border-color:var(--primary);background:var(--primary-soft)}
.vx-vartile:active{cursor:grabbing}
.vx-vartile-label{font-size:12.3px;font-weight:600;color:var(--text)}
.vx-vartile-meta{display:flex;justify-content:space-between;align-items:center;margin-top:2px;gap:8px}
.vx-vartile-meta code{font-family:ui-monospace,Consolas,monospace;font-size:10px;color:var(--text-mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vx-vartile-meta b{font-size:11px;color:var(--primary);font-weight:700;flex:none;white-space:nowrap}
.vx-vartile-driver{font-size:10.2px;color:var(--text-dim);margin-top:2px;line-height:1.35}
.vx-vartile-hint{font-size:9.8px;color:var(--text-mute);margin-top:3px}
.vx-vartile-hint a{color:var(--primary);text-decoration:underline}
#fbTip{position:fixed;z-index:var(--z-tooltip);max-width:280px;background:var(--surface);border:1px solid var(--border);
  border-radius:10px;box-shadow:var(--shadow-lg,0 12px 32px rgba(0,0,0,.22));padding:10px 12px;display:none;pointer-events:none}
#fbTip .fbtip-h{font-size:11.5px;font-weight:700;margin-bottom:2px}
#fbTip .fbtip-d{font-size:10.5px;color:var(--text-dim);margin-bottom:7px;line-height:1.4}
#fbTip table{width:100%;border-collapse:collapse;font-size:11px}
#fbTip td{padding:2px 0;border-bottom:1px solid var(--border)}
#fbTip tr:last-child td{border-bottom:none}
#fbTip td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;padding-left:8px}
#fbTip tr.def{background:var(--primary-soft)}
#fbTip .fbtip-more{font-size:10px;color:var(--text-mute);margin-top:4px;text-align:center}
#fbTip .fbtip-foot{font-size:9.5px;color:var(--text-mute);margin-top:6px;border-top:1px solid var(--border);padding-top:5px}
</style>
</head>

<script>
/* The page lands on the formula LIST, so it is titled for that; fbShowBuilder()
   retitles to "Formula Builder" when you are actually editing one. */
vxShell("Rating Formulas", "Every rating formula on this tenant. || What it rates, which versions run it, and whether it has been evaluated.",
  [{ l: "Rating" }, { l: "Rating Formulas" }]);

/* Which coverage is being rated drives which variables even make sense — a
   formula for Auto Liability, Physical Damage, GL Premises/Ops or Cyber
   Breach Response each runs on a different real factor chain. This is
   driven off the platform's actual Class-of-Business tree (VX.cobParents),
   not a hand-picked shortlist, so every real COB across every LOB shows up
   here — not just trucking's three. */
const ACCOUNT_KEY = "__ACCOUNT__";
const LOB_META = {
  "Commercial Trucking": { icon: "fa-truck", color: "var(--cat-1)" },
  "General Liability": { icon: "fa-store", color: "var(--cat-2)" },
  "Commercial Property": { icon: "fa-building", color: "var(--cat-3)" },
  "Professional Liability (MPL)": { icon: "fa-user-tie", color: "var(--cat-4)" },
  "Cyber": { icon: "fa-shield-virus", color: "var(--cat-5)" },
  "Umbrella / Excess": { icon: "fa-umbrella", color: "var(--cat-6)" },
};

/* Per-COB variable sets. AL/PD are verified against the source rating
   workbook; GL/Property/MPL/Cyber mirror engine.js's approximate formulas
   for those LOBs (real code, not workbook-verified); Cargo, Liquor
   Liability, Business Auto and Inland Marine have no sourced rate at all
   and are flagged accordingly. */
const COB_VARS = {
  "Auto Liability": [
    { n: "BaseLossCost", v: 321 }, { n: "ILF", v: 2.06 }, { n: "LiabDeductibleFactor", v: 0.138 },
    { n: "LCM", v: 1.67 }, { n: "PrimaryClassFactor", v: 1.62 }, { n: "SecondaryClassFactor", v: 1.98 },
    { n: "FleetSizeFactor", v: 1.061 }, { n: "VehicleAgeFactor", v: 1.04 }, { n: "OCNFactor", v: 0.85 },
    { n: "RadiusFactor", v: 1.15 }, { n: "NAICSFactor", v: 1.10 }, { n: "TortLimitationFactor", v: 1.00 },
    { n: "MilesDrivenFactor", v: 1.00 }, { n: "RatingClassFactor", v: 1.00 }, { n: "DashcamFactor", v: 0.95 },
    { n: "CDLExpDiscFactor", v: 0.90 }, { n: "DriverClassFactor", v: 0.925 },
    { n: "VehicleOwnedFactor", v: 1.00 }, { n: "PollutionFactor", v: 1.00 },
    { n: "DriverCriteriaFactor", v: 1.00 }, { n: "LossExperienceFactor", v: 1.00 },
    { n: "PaymentPlanFactor", v: 1.00 }, { n: "UwCreditDebitFactor", v: 1.00 },
    { n: "HeavyFarmFactor", v: 1.00 }, { n: "HeavyDumpingFactor", v: 1.00 },
    { n: "AccountFactor", v: 0.85 }, { n: "RemainingFactors", v: 1.00 },
  ],
  "Physical Damage": [
    { n: "VehicleValue", v: 145000 }, { n: "APDRate", v: 0.0475 }, { n: "APDDeductibleFactor", v: 0.875 },
    { n: "APDRadiusFactor", v: 1.125 }, { n: "TrailerPhysDamFactor", v: 0.90 }, { n: "MilesDrivenFactor", v: 1.00 },
    { n: "RatingClassFactor", v: 1.00 }, { n: "DashcamFactor", v: 0.95 }, { n: "APDStateFactor", v: 0.95 },
    { n: "APDPackageFactor", v: 0.90 }, { n: "CDLExpDiscFactor", v: 0.90 }, { n: "DriverClassFactor", v: 0.925 },
    { n: "AccountFactor", v: 0.85 },
  ],
  "Motor Truck Cargo": [
    { n: "CargoLimit", v: 100000 }, { n: "CargoLossCostFactor", v: 0.798 },
    { n: "CargoRadiusFactor", v: 1.125 },
  ],
  "General Liability": [
    { n: "BasicLimitLossCost", v: 10375 }, { n: "IncreasedLimitsFactor", v: 1.262 }, { n: "LCM", v: 1.62 },
    { n: "ClassFactor", v: 1.10 }, { n: "ScheduleRatingMod", v: 1.00 }, { n: "ExperienceMod", v: 1.00 },
  ],
  "Liquor Liability": [{ n: "BaseRate", v: 500 }, { n: "LCM", v: 1.62 }, { n: "ClassFactor", v: 1.00 }],
  "Business Auto": [{ n: "BaseRate", v: 800 }, { n: "LCM", v: 1.62 }, { n: "ClassFactor", v: 1.00 }],
  "Inland Marine": [{ n: "BaseRate", v: 400 }, { n: "LCM", v: 1.62 }, { n: "ClassFactor", v: 1.00 }],
  "Property": [
    { n: "TotalInsuredValue", v: 1450000 }, { n: "BaseRatePer100", v: 0.42 }, { n: "ConstructionFactor", v: 1.10 },
    { n: "ProtectionClassFactor", v: 1.09 }, { n: "OccupancyFactor", v: 1.00 }, { n: "WindHailFactor", v: 1.00 },
    { n: "DeductibleFactor", v: 0.90 }, { n: "LCM", v: 1.00 }, { n: "IRPM", v: 1.00 },
  ],
  "Professional Liability": [
    { n: "BasicLimitLossCost", v: 1660 }, { n: "LCM", v: 1.538 }, { n: "AdjILF", v: 0.983 },
    { n: "HazardGroupFactor", v: 0.80 }, { n: "ALAEFactor", v: 1.00 }, { n: "ClaimsMadeFactor", v: 1.00 },
    { n: "LossExperienceFactor", v: 0.90 }, { n: "StateModFactor", v: 1.00 }, { n: "UWModFactor", v: 1.00 },
  ],
};
const CYBER_VARS = [
  { n: "BaseRate", v: 3360 }, { n: "BaseRateDeviation", v: 1.00 }, { n: "RevenueBandFactor", v: 1.00 },
  { n: "IndustryClassFactor", v: 1.10 }, { n: "MFAControlsFactor", v: 1.05 }, { n: "AggregateLimitFactor", v: 1.00 },
  { n: "RetentionFactor", v: 0.88 }, { n: "ScheduleRatingFactor", v: 1.00 },
];
["Liability", "Breach Response", "Cyber Crime", "Business Loss"].forEach(k => COB_VARS[k] = CYBER_VARS);
/* The account-level palette used to hold generic placeholders — BaseLossCost,
   ILF, LCM — which are per-coverage terms with nothing to do with the account
   factor. A formula authored there referenced variables the engine never
   supplies for this scope, so it could not have worked even once a hook
   existed. These are the eight credit/debit answers the engine actually
   passes, plus the two program-band bounds the clamp needs. */
COB_VARS[ACCOUNT_KEY] = [
  { n: "RenewalDiscount", v: 0 }, { n: "BusinessExperience", v: 0 },
  { n: "CarrierSafetyFMCSA", v: 0 }, { n: "OOSVehicles", v: 0 },
  { n: "OOSDrivers", v: 0 }, { n: "ICCFiling", v: 0 },
  { n: "LossFrequency", v: 0 }, { n: "DriverLicenseStates", v: 0 },
  { n: "AccountFactorMin", v: 0.85 }, { n: "AccountFactorMax", v: 1.50 },
];

/* Coverages with no sourced rate at all — shown with a warning instead of a
   confident starting template. */
const COB_UNSOURCED = { "Motor Truck Cargo": true, "Liquor Liability": true, "Business Auto": true, "Inland Marine": true,
  "Liability": true, "Breach Response": true, "Cyber Crime": true, "Business Loss": true };
const COB_WARN = {
  "Motor Truck Cargo": "Rate not yet sourced from a filed rating manual — treat as a placeholder.",
  "Liquor Liability": "No rating engine implementation yet — placeholder variables only.",
  "Business Auto": "No rating engine implementation yet — placeholder variables only.",
  "Inland Marine": "No rating engine implementation yet — placeholder variables only.",
  "Liability": "Cyber's engine doesn't split premium by insuring-agreement group yet — all four groups share this same calculation.",
  "Breach Response": "Cyber's engine doesn't split premium by insuring-agreement group yet — all four groups share this same calculation.",
  "Cyber Crime": "Cyber's engine doesn't split premium by insuring-agreement group yet — all four groups share this same calculation.",
  "Business Loss": "Cyber's engine doesn't split premium by insuring-agreement group yet — all four groups share this same calculation.",
};

/* Starting templates — AL/PD match engine.js's real per-vehicle formula
   term-for-term; GL/Property/MPL/Cyber match engine.js's working
   approximation for those LOBs. Loading a coverage gives the analyst a
   working formula to adjust rather than a blank canvas. */
const DEFAULT_TOKENS = {
  "Auto Liability": ["BaseLossCost","×","(","ILF","−","LiabDeductibleFactor",")","×","LCM","×","PrimaryClassFactor","×",
    "SecondaryClassFactor","×","FleetSizeFactor","×","VehicleAgeFactor","×","OCNFactor","×","RadiusFactor","×",
    "NAICSFactor","×","TortLimitationFactor","×","MilesDrivenFactor","×","RatingClassFactor","×","DashcamFactor","×",
    "CDLExpDiscFactor","×","DriverClassFactor","×","VehicleOwnedFactor","×","PollutionFactor","×",
        "DriverCriteriaFactor","×","LossExperienceFactor","×","PaymentPlanFactor","×","UwCreditDebitFactor","×",
        "HeavyFarmFactor","×","HeavyDumpingFactor","×","AccountFactor","×","RemainingFactors"],
  "Physical Damage": ["VehicleValue","×","APDRate","×","APDDeductibleFactor","×","APDRadiusFactor","×","TrailerPhysDamFactor","×",
    "MilesDrivenFactor","×","RatingClassFactor","×","DashcamFactor","×","APDStateFactor","×","APDPackageFactor","×",
    "CDLExpDiscFactor","×","DriverClassFactor","×","AccountFactor"],
  "Motor Truck Cargo": ["(","CargoLimit","÷","100",")","×","CargoLossCostFactor","×","CargoRadiusFactor"],
  "General Liability": ["BasicLimitLossCost","×","IncreasedLimitsFactor","×","LCM","×","ClassFactor","×","ScheduleRatingMod","×","ExperienceMod"],
  "Property": ["(","TotalInsuredValue","÷","100",")","×","BaseRatePer100","×","ConstructionFactor","×","ProtectionClassFactor","×",
    "OccupancyFactor","×","WindHailFactor","×","DeductibleFactor","×","LCM","×","IRPM"],
  "Professional Liability": ["BasicLimitLossCost","×","LCM","×","AdjILF","×","HazardGroupFactor","×","ALAEFactor","×",
    "ClaimsMadeFactor","×","LossExperienceFactor","×","StateModFactor","×","UWModFactor"],
  "Liability": ["BaseRate","×","BaseRateDeviation","×","RevenueBandFactor","×","IndustryClassFactor","×","MFAControlsFactor","×",
    "AggregateLimitFactor","×","RetentionFactor","×","ScheduleRatingFactor"],
};
DEFAULT_TOKENS["Breach Response"] = DEFAULT_TOKENS["Cyber Crime"] = DEFAULT_TOKENS["Business Loss"] = DEFAULT_TOKENS["Liability"];
/* Opens on the filed expression rather than an empty canvas: additive, then
   clamped to the program band. This is the one chain that is not a product. */
DEFAULT_TOKENS[ACCOUNT_KEY] = ["MIN","(","AccountFactorMax",",","MAX","(","AccountFactorMin",",",
  "1","+","RenewalDiscount","+","BusinessExperience","+","CarrierSafetyFMCSA","+",
  "OOSVehicles","+","OOSDrivers","+","ICCFiling","+","LossFrequency","+",
  "DriverLicenseStates",")",")"];

/* Progressive disclosure: Basic shows only what a rating formula normally
   needs (multiply factors, group with parens); Advanced adds comparisons,
   conditionals and rounding. OPS stays the full list because toTokens()
   uses it to classify saved formulas regardless of the current view. */
const OPS_BASIC = ["×", "÷", "(", ")"];
const OPS_ADV = ["+", "−", "^", ","];
const OPS = [...OPS_BASIC, ...OPS_ADV];
const FNS = ["IF", "ELSE", "MIN", "MAX", "ROUND", "LOOKUP", "AND", "OR", ">", "<", "="];

function toTokens(arr, cobKey) {
  const varNames = new Set((COB_VARS[cobKey] || []).map(v => v.n));
  /* Function names are structure, not data — classifying MIN/MAX as numbers
     styled them as literals and made an additive, clamped chain read as if it
     were multiplying by a constant called MIN. */
  return arr.map(v => ({
    t: (OPS.includes(v) || FNS.includes(v)) ? "op" : (varNames.has(v) ? "var" : "num"), v }));
}
function findVarDefault(name) {
  for (const key in COB_VARS) { const hit = COB_VARS[key].find(x => x.n === name); if (hit) return hit.v; }
  return 1;
}
function currentVars() { return COB_VARS[currentCob || ACCOUNT_KEY] || []; }

/* Plain-language label + definition + value type for every variable name —
   PascalCase identifiers like "LiabDeductibleFactor" are what the formula
   engine needs, not what a person should have to read. The palette, canvas
   chips, test panel and rule builder all display through these instead of
   the raw name; the raw name still drives evaluation and is always still
   visible in the technical Expression preview and on hover. */
const VAR_META = {
  BaseLossCost: { l: "Base Loss Cost", d: "Starting expected-loss rate before any factors are applied.", u: "money" },

  AccountFactorMax: { l: "Account Factor Max", d: "Upper bound of the filed program band.", u: "x" },

  VehicleOwnedFactor: { l: "Vehicle Ownership Factor", d: "Adjustment for whether the unit is owned, leased, owner-operator or non-owned.", u: "x" },
  PollutionFactor: { l: "Pollution Factor", d: "Auto liability pollution grade. The scale is not centred on 1.00 — a Low grade is still a debit.", u: "x" },
  DriverCriteriaFactor: { l: "Driver Criteria Factor", d: "Applies when the rated driver schedule breaches the filed age or CDL-experience thresholds.", u: "x" },
  LossExperienceFactor: { l: "Loss Experience Factor", d: "Banded on the prior-term loss ratio.", u: "x" },
  PaymentPlanFactor: { l: "Payment Plan Factor", d: "Adjustment for the billing arrangement.", u: "x" },
  UwCreditDebitFactor: { l: "UW Credit / Debit", d: "Underwriter judgment, clamped to the filed program band.", u: "x" },
  HeavyFarmFactor: { l: "Heavy Farm Factor", d: "Specialised-use credit for farm operation.", u: "x" },
  HeavyDumpingFactor: { l: "Heavy Dumping Factor", d: "Specialised-use load for dump operation.", u: "x" },
  LiabDeductibleFactor: { l: "Liability Deductible Factor", d: "Subtracted from the ILF to reflect the liability deductible chosen.", u: "x" },
  LCM: { l: "Loss Cost Multiplier (LCM)", d: "Converts a pure loss cost into a gross rate.", u: "x" },
  PrimaryClassFactor: { l: "Primary Class Factor", d: "Adjustment for the vehicle's primary ISO class code.", u: "x" },
  SecondaryClassFactor: { l: "Secondary Class Factor", d: "Adjustment for the vehicle's secondary ISO class code.", u: "x" },
  FleetSizeFactor: { l: "Fleet Size Factor", d: "Discount or surcharge based on how many like-type vehicles are rated together.", u: "x" },
  VehicleAgeFactor: { l: "Vehicle Age Factor", d: "Adjustment for the vehicle's model-year age.", u: "x" },
  OCNFactor: { l: "OCN Factor", d: "Liability adjustment banded by the vehicle's stated value.", u: "x" },
  RadiusFactor: { l: "Radius Factor", d: "Liability adjustment for radius of operation.", u: "x" },

   real business: an endorsement is priced on the version in force when the
   policy incepted (see resolveRatingAsOf in engine.js), so a policy written
   under an expired version is still rated by that version's formulas for the
   rest of its term. Excluding them meant a formula could never be attached

    && (tid == null || v.tenantId == null || v.tenantId === tid));
  const seen = new Set();
  const uniq = rows.filter(v => (seen.has(v.version) ? false : (seen.add(v.version), true)));

  pushHist(); TOK = []; canvasTested = false; draw(); vxAutoSave();
  vxToast("Canvas cleared", "Undo restores it", "info");
}
/* ---------- Drop positioning ----------
   Drops used to append unconditionally, so inserting a term in the middle of
   a chain meant deleting everything after it and retyping. The drop index is
   now the gap nearest the pointer, shown live as a caret. */
function dropIndexAt(clientX) {
  const toks = [...cv().querySelectorAll("[data-i]")];
  for (let i = 0; i < toks.length; i++) {
    const r = toks[i].getBoundingClientRect();
    if (clientX < r.left + r.width / 2) return i;
  }
  return toks.length;
}
function showCaret(i) {
  clearCaret();
  const toks = [...cv().querySelectorAll("[data-i]")];
  const caret = document.createElement("span");
  caret.className = "vx-fb-caret";
  caret.id = "fbCaret";
  if (i >= toks.length) cv().appendChild(caret); else cv().insertBefore(caret, toks[i]);
}
function clearCaret() { const c = document.getElementById("fbCaret"); if (c) c.remove(); }

cv().ondragover = e => {
  e.preventDefault();
  cv().classList.add("over");
  showCaret(dropIndexAt(e.clientX));
};
cv().ondragleave = e => {
  // only when the pointer actually leaves the canvas, not on child transitions
  if (e.relatedTarget && cv().contains(e.relatedTarget)) return;
  cv().classList.remove("over"); clearCaret();
};
cv().ondrop = e => {
  e.preventDefault();
  const at = dropIndexAt(e.clientX);
  cv().classList.remove("over"); clearCaret();
  let payload;
  try { payload = JSON.parse(e.dataTransfer.getData("text/plain")); } catch (err) { return; }
  if (!payload) return;
  if (payload.move != null) moveToken(payload.move, at);
  else addToken(payload, at);
};

/* Ctrl/Cmd+Z anywhere on the builder — undo existed only as a toolbar button. */
document.addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"
      && document.getElementById("fbBuilder") && document.getElementById("fbBuilder").style.display !== "none"
      && !/INPUT|TEXTAREA|SELECT/.test((e.target.tagName || ""))) {

});
function addNum() {
  const n = document.getElementById("numIn").value;
  if (!n) return;
  addToken({ t: "num", v: n });
  document.getElementById("numIn").value = "";
}
/* Evaluate the canvas through the ENGINE's own evaluator, not a second one
   written here. This screen previously substituted the variables itself and
   called Function() with nothing in scope, so MIN / MAX / ROUND / ABS — all
   offered in the palette, and all used by the seeded Account-Level Factor
   formulas — threw ReferenceError and every such formula reported "Invalid
   expression". Two evaluators also meant a formula could test clean here and
   rate differently once activated. There is now one. */
function test() {
  const vals = {};
  document.querySelectorAll(".TV").forEach(i => {
    const v = parseFloat(i.value);
    if (!isNaN(v)) vals[i.dataset.n] = v;
  });

  const out = document.getElementById("testOut");
  const fail = (title, detail) => {
    out.innerHTML = `<div style="border:1px solid var(--border);border-left:3px solid var(--bad);
        background:rgba(210,69,69,.09);border-radius:0 8px 8px 0;padding:10px 13px">
        <div style="font-size:12.3px;font-weight:700;color:var(--bad)">${title}</div>
        <div style="font-size:11.6px;color:var(--text-dim);line-height:1.55;margin-top:3px">${detail}</div>
      </div>`;
    canvasTested = false;
    renderCanvasContext();
  };

  if (!TOK.length) return fail("Nothing to evaluate", "The canvas is empty — drag in variables and operators first.");

  const missing = [...new Set(TOK.filter(t => t.t === "var" && t.v !== "RemainingFactors" && vals[t.v] === undefined).map(t => t.v))];
  if (missing.length) {
    return fail("Missing test values",
      `No value entered for ${missing.map(n => `<b>${varLabel(n)}</b>`).join(", ")}. Fill every box above before evaluating.`);
  }

  let result;
  try {
    result = ENGINE.evalFormula(TOK, vals);
  } catch (e) {
    /* Report what actually went wrong — an unbalanced bracket, a stray
       operator and a missing value are different problems with different
       fixes, and "Invalid expression" told the author none of them. */
    const opens = TOK.filter(t => t.v === "(").length, closes = TOK.filter(t => t.v === ")").length;
    const hint = opens !== closes
      ? `Brackets don't balance — ${opens} opening, ${closes} closing.`
      : `${e.message}. Check for two operators in a row, or an operator at the end.`;
    return fail("Formula did not evaluate", hint);
  }

  const expr = TOK.map(t => t.t === "var" ? `${t.v}=${vals[t.v] ?? "…"}` : t.v).join(" ");
  out.innerHTML = `<div class="vx-ai"><span class="tag"><i class="fa-solid fa-flask"></i>Test Result</span>
     <div style="font-size:22px;font-weight:800;margin:4px 0">${result.toFixed(4).replace(/\.?0+$/, "")}</div>
     <div style="font-size:11px;color:var(--text-mute);margin-bottom:5px">Evaluated by the rating engine — the same code that runs this formula once it is Active.</div>
     <div style="font-size:11.2px;color:var(--text-dim);word-break:break-all">${expr}</div></div>`;
  vxToast("Formula evaluated", "Result: " + result.toFixed(4).replace(/\.?0+$/, ""), "ok");
  canvasTested = true;
  if (currentFormula) { currentFormula.tested = true; currentFormula.lastTestedAt = new Date().toISOString().slice(0, 10); }
  renderCanvasContext();
}

function loadFormula(id) {
  const f = VX.savedFormulas.find(x => x.id === id);
  if (!f) return;
  const modalEl = document.getElementById("vxModal");
  const inst = modalEl && bootstrap.Modal.getInstance(modalEl);
  if (inst) inst.hide();
  currentFormula = { ...f };
  currentLob = f.lob || VX.lobs[0].name;
  currentCob = f.scope === "Class of Business" ? f.cob : null;
  pushHist();
  TOK = f.tokens.map(t => ({ ...t }));
  canvasTested = !!f.tested;
  renderLobPicker();
  renderCobPicker();
  palVars(document.getElementById("vq").value);
  draw();
  drawRules();
  fbShowBuilder();
  vxToast("Formula loaded", f.name + " loaded into canvas — Save Formula stages a new draft revision", "ok");
}

function saveF() {
  const src = currentFormula || {};
  const defLob = src.lob || currentLob;
  const defScope = src.scope || (currentCob ? "Class of Business" : "Account");
  const defCobValue = src.cob || (currentCob || "");
  const cobOpts = lob => cobOptionsForLob(lob).map(c => `<option ${c === defCobValue ? "selected" : ""}>${c}</option>`).join("");
  /* A formula attaches to a RATING VERSION, not to a product.
     A product owns many versions, and the same coverage's math legitimately
     differs between them — attaching at product level silently bound the
     formula to whichever version happened to be first on file, so an admin
     could never target a specific engine. The checklist is therefore one row
     per version, grouped under its product. */
  const attachedKey = a => `${a.product}||${a.ratingVersion}`;
  const selectedVersions = new Set((src.attachments || []).map(attachedKey));
  const versionChecklist = lob => {
    const prods = productsForLob(lob);
    if (!prods.length) return `<div style="font-size:12px;color:var(--text-mute)">No products under this LOB yet.</div>`;
    const blocks = prods.map(p => {
      const vers = versionsForProduct(p);
      if (!vers.length) return `<div style="margin-bottom:9px">
        <div style="font-size:11.5px;font-weight:700;color:var(--text-dim)">${p}</div>
        <div style="font-size:11.5px;color:var(--text-mute);padding-left:10px">No rating version on file for this product yet.</div></div>`;
      return `<div style="margin-bottom:9px">
        <div style="font-size:11.5px;font-weight:700;color:var(--text-dim);margin-bottom:2px">${p}</div>
        ${vers.map(v => {
          const id = "sfVer-" + (p + v.version).replace(/[^a-z0-9]/gi, "");
          const chk = selectedVersions.has(`${p}||${v.version}`);
          return `<div class="form-check" style="padding-left:1.9rem">
            <input class="form-check-input" type="checkbox" id="${id}" data-prod="${p}" data-ver="${v.version}" ${chk ? "checked" : ""}>
            <label class="form-check-label" for="${id}" style="font-size:12.5px">${v.version}
              <span class="vx-b ${v.status === "Published" ? "green" : v.status === "Draft" ? "amber" : v.status === "Scheduled" ? "blue" : "gray"}">${v.status}</span>
              ${versionIsClosed(v) ? `<span class="vx-b amber" style="font-size:8.5px" title="Closed version. Policies written under it are still rated by it on endorsement, so changing its formulas affects business already in force — not new business.">affects in-force only</span>` : ""}</label>
          </div>`;
        }).join("")}
      </div>`;
    }).join("");
    return blocks;
  };

  vxModal(currentFormula ? "Save Formula — " + currentFormula.name : "Save Formula", `<div class="row g-3">
    <div class="col-md-6"><label>Formula Name</label><input class="form-control form-control-sm" id="sfName" value="${src.name || "New Formula"}"></div>
    <div class="col-md-6"><label>Line of Business</label><select class="form-select form-select-sm" id="sfLob">${vxLobNames().map(n => `<option ${n === defLob ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    <div class="col-md-6"><label>Scope</label><select class="form-select form-select-sm" id="sfScope">
      <option value="Account" ${defScope === "Account" ? "selected" : ""}>Account Level — applies once across the policy</option>
      <option value="Class of Business" ${defScope === "Class of Business" ? "selected" : ""}>Class of Business Level — applies to one coverage</option>
    </select></div>
    <div class="col-md-6" id="sfCobWrap" style="${defScope === "Account" ? "display:none" : ""}"><label>Class of Business</label><select class="form-select form-select-sm" id="sfCob">${cobOpts(defLob)}</select></div>
    <div class="col-12">
      <div class="d-flex align-items-center justify-content-between mb-1">
        <label class="mb-0">Attach to Rating Versions</label>
        <div class="d-flex gap-2"><a href="#" id="sfSelAll" style="font-size:11.5px">Select all</a><a href="#" id="sfSelNone" style="font-size:11.5px">Clear</a></div>
      </div>
      <div id="sfProducts" style="max-height:230px;overflow:auto;border:1px solid var(--border);border-radius:8px;padding:10px 12px">${versionChecklist(defLob)}</div>
      <div style="font-size:11px;color:var(--text-mute);margin-top:4px">A formula attaches to a specific <b>rating version</b>, not to a product — a product owns many versions and the same coverage's math can differ between them. Pick every version this formula should rate on.</div>
    </div>
    <div class="col-12"><label>Expression</label><div class="vx-code">${TOK.map(t => t.v).join(" ") || "// empty formula"}</div></div></div>
    ${currentCob && COB_UNSOURCED[currentCob] ? `<div class="mb-3 mt-3" style="border:1px solid var(--border);border-left:3px solid var(--warn);background:rgba(198,137,15,.08);border-radius:0 10px 10px 0;padding:9px 13px;font-size:11.8px"><i class="fa-solid fa-triangle-exclamation me-1" style="color:var(--warn)"></i>${COB_WARN[currentCob]}</div>` : ""}
    ${canvasTested
      ? `<div class="vx-ai mt-3"><span class="tag"><i class="fa-solid fa-circle-check"></i>Evaluated</span>
         This formula was run through Evaluate Formula and produced a result. Saving carries that tested status forward — it still stages as <b>Draft</b> until its rating engine is published.</div>`
      : `<div class="callout mt-3" style="border-left:3px solid var(--warn);background:rgba(198,137,15,.08);border-radius:0 10px 10px 0;padding:12px 16px">
         <span style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);display:block;margin-bottom:4px"><i class="fa-solid fa-triangle-exclamation me-1"></i>Not evaluated yet</span>
         This formula hasn't been run through <b>Evaluate Formula</b> since it was last changed. It will still save as Draft, but Rating Versions will warn before letting anyone publish an engine with an untested formula attached.</div>`}`,
    [{ t: "Cancel", c: "secondary" }, { t: "Save as Draft", c: "primary", fn: () => {
      const name = document.getElementById("sfName").value.trim() || "Untitled Formula";
      const lob = document.getElementById("sfLob").value;
      const scope = document.getElementById("sfScope").value;
      const cob = scope === "Class of Business" ? document.getElementById("sfCob").value : "";
      const attachments = [...document.querySelectorAll("#sfProducts [data-prod]:checked")]
        .map(el => ({ product: el.dataset.prod, ratingVersion: el.dataset.ver }));
      const rec = {
        id: currentFormula ? currentFormula.id : Date.now(),
        name, lob, scope, cob, attachments, status: "Draft",
        tested: canvasTested, lastTestedAt: canvasTested ? (src.lastTestedAt || new Date().toISOString().slice(0, 10)) : null,
        createdBy: (src.createdBy || "vikas.kumar@veridex.io"), updated: new Date().toISOString().slice(0, 10),
        tokens: TOK.slice(),
      };
      const i = VX.savedFormulas.findIndex(f => f.id === rec.id);
      if (i >= 0) VX.savedFormulas[i] = rec; else VX.savedFormulas.push(rec);
      localStorage.setItem("vxSavedFormulas", JSON.stringify(VX.savedFormulas));
      currentFormula = rec;
      vxToast("Formula saved", name + " staged as Draft" + (attachments.length ? ` on ${attachments.length} rating version${attachments.length === 1 ? "" : "s"}` : "") + " — publish each version to go live", "ok");
      renderCanvasContext();
      if (fbGrid) fbGrid.reload();   // the grid is the landing view — keep it current
    }}]);

  document.getElementById("sfLob").onchange = e => {
    document.getElementById("sfCob").innerHTML = cobOpts(e.target.value);
    document.getElementById("sfProducts").innerHTML = versionChecklist(e.target.value);
  };
  document.getElementById("sfScope").onchange = e => {
    document.getElementById("sfCobWrap").style.display = e.target.value === "Class of Business" ? "" : "none";
  };
  document.getElementById("sfSelAll").onclick = e => { e.preventDefault(); document.querySelectorAll("#sfProducts [data-prod]:not(:disabled)").forEach(c => c.checked = true); };
  document.getElementById("sfSelNone").onclick = e => { e.preventDefault(); document.querySelectorAll("#sfProducts [data-prod]").forEach(c => c.checked = false); };
}

/* Bulk-attach selected formulas to a rating version.
   This used to live inside a "Load Formula" dialog that became unreachable
   when the page moved to a grid-first layout — the grid already lists and
   opens formulas, so only the multi-select attach was worth keeping, and it
   belongs where the multi-select is. */
function bulkAttach(recs) {
  if (!recs.length) { vxToast("Nothing selected", "Select at least one formula first", "warn"); return; }
  const tid = (typeof COSMOS !== "undefined") ? COSMOS.tenantId() : null;
  const vers = VX.versions.filter(v => v.status !== "Expired" && v.status !== "Archived"
    && (tid == null || v.tenantId == null || v.tenantId === tid));

  vxModal("Attach to a Rating Version", `
    <div style="font-size:12.4px;color:var(--text-dim);margin-bottom:10px">
      A formula belongs to a <b>version</b>, not to a product — a product owns many versions.
      This adds the version alongside whatever these formulas are already attached to.
    </div>
    <div class="vx-tw mb-3"><table class="vx-t"><tbody>
      ${recs.map(f => `<tr><td><b>${f.name}</b>
        <div style="font-size:10.5px;color:var(--text-mute)">${f.scope === "Account" ? "Account level" : f.cob} · ${f.lob}</div></td>
        <td style="text-align:right"><span class="vx-b ${f.status === "Active" ? "green" : "amber"}">${f.status}</span></td></tr>`).join("")}
    </tbody></table></div>
    <label>Rating version</label>
    <select class="form-select form-select-sm" id="bulkVersion">
      <option value="">Select a rating version…</option>
      ${vers.map(v => `<option value="${v.id}">${v.product} — ${v.version} (${v.status})</option>`).join("")}
    </select>`,
    [{ t: "Cancel", c: "secondary" }, { t: "Attach", c: "primary", fn: () => {
      const verId = +document.getElementById("bulkVersion").value;
      if (!verId) { vxToast("Pick a rating version", "Choose which version to attach these formulas to", "warn"); return false; }
      const ver = VX.versions.find(v => v.id === verId);
      const doAssign = () => {
        recs.forEach(rec => {
          const f = VX.savedFormulas.find(x => x.id === rec.id);
          if (!f) return;
          f.attachments = f.attachments || [];
          if (!f.attachments.some(a => a.product === ver.product && a.ratingVersion === ver.version)) {
            f.attachments.push({ product: ver.product, ratingVersion: ver.version });
          }
          f.status = "Draft";
        });
        localStorage.setItem("vxSavedFormulas", JSON.stringify(VX.savedFormulas));
        vxToast("Formulas attached", `${recs.length} formula(s) staged as Draft on ${ver.version} (${ver.product})`, "ok");
        vxAutoSave(); fbGrid.reload();
      };
      /* Attaching demotes a live formula to Draft until the engine is
         republished — that is a production change, so it is confirmed. */
      const live = recs.filter(f => f.status === "Active").map(f => f.name);
      if (live.length) {
        setTimeout(() => vxConfirm("Demote live formulas to Draft?",
          `<b>${live.length}</b> of the formulas selected — ${live.map(n => `<b>${n}</b>`).join(", ")} — ${live.length === 1 ? "is" : "are"} currently <span class="vx-b green">Active</span> in production. Attaching ${live.length === 1 ? "it" : "them"} to ${ver.version} demotes ${live.length === 1 ? "it" : "them"} to Draft until that engine is republished.`,
          doAssign, true), 320);
      } else doAssign();
    }}]);
}

/* Land on the grid. ?new opens a blank builder, ?id=<n> opens that formula —
   so the two views are linkable and Back always has somewhere to return to. */
(() => {
  const q = new URLSearchParams(location.search);
  if (q.has("new")) return fbNewFormula();
  const id = +q.get("id");
  if (id && VX.savedFormulas.some(f => f.id === id)) return loadFormula(id);
  fbShowList();
})();
</script>
