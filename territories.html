<!DOCTYPE html>
<html lang="en" style="background-color:#1A1D23">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Territories — Geography | VeriDex</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-grid.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/styles/ag-theme-quartz.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body><div id="vxApp"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/cosmos-model.js"></script>
<script src="assets/js/tenant-setup.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/grid.js"></script>
<script src="assets/js/ag-grid-adapter.js"></script>
<script>
vxShell("Territory Management", "Rating territories with ISO mapping and relativity. || Territory drives base loss cost selection.", [{l:"Geography"},{l:"Territory Management"}]);
document.getElementById("vxBody").innerHTML = `<div class="vx-card vx-anim"><div id="grid"></div></div>`;
vxAgGrid({ el:"#grid", key:"territories", name:"Territory",
  size:12,
  cols:[{k:"code",l:"Territory Code"},{k:"state",l:"State"},{k:"name",l:"Territory Name"},
      {k:"isoTerr",l:"ISO Terr"},{k:"relativity",l:"Relativity",r:r=>r.relativity.toFixed(3)+"×"},
      {k:"zips",l:"ZIPs",r:r=>vxNum(r.zips)},{k:"lob",l:"Applies To"}],
  form:[{k:"code",l:"Territory Code"},{k:"state",l:"State",t:"select",opts:VX.states.map(s=>s.abv)},{k:"name",l:"Name"},
      {k:"isoTerr",l:"ISO Territory",t:"number"},{k:"relativity",l:"Relativity",t:"number",step:"0.001"},
      {k:"zips",l:"ZIP Count",t:"number"},{k:"lob",l:"Applies To"}],
  filters:[{k:"state",l:"State",opts:VX.states.map(s=>s.abv)}] });

</script>
</body>
</html>
